      function renderRouteSkinPreviewCard(rb) {
        const previewRoute = { title: rb.title, purpose: rb.purpose, skin: rb.skin };
        const v = getRouteSkinVisuals(previewRoute);
        const attrs = routeCardSkinAttrs(v, 'padding:10px; gap:6px; min-height:150px;');
        const pv = PURPOSE_VISUAL[rb.purpose] || { emoji: '📍', gradient: 'linear-gradient(135deg,#EEE,#DDD)' };
        return `
          <div class="route-card${attrs.cls}"${attrs.style}>
            <div style="display:flex; align-items:center; gap:4px;">
              <span class="purpose-pill" style="font-size:10px; padding:3px 8px;">${rb.purpose}</span>
              ${v.titleBadge}
            </div>
            <div style="font-size:12px; font-weight:900; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(rb.title || '루트 제목 미리보기')}</div>
            <div class="card-img" style="height:64px; font-size:24px; background:${pv.gradient};">${pv.emoji}</div>
            <div style="display:flex; align-items:center; gap:4px;">
              <span style="font-size:10px; font-weight:800; color:var(--text-sub);">${esc(state.user.name)}</span>
              ${v.authorBadge}
            </div>
            ${v.stickerHtml}
            ${v.weatherHtml}
          </div>
        `;
      }

      // 스킨 이름 저장 - "꾸미기" 탭에서 꾸민 12파츠 조합(state.skinStudioDraft.skin)을 이름 붙여
      // state.routeSkinPresets에 저장해두면, 새 루트를 만들 때 드롭다운에서 골라 즉시 같은 조합을
      // 적용할 수 있다(applyRouteSkinPreset, 새 루트 만들기 화면 전용). 로그인 상태면
      // syncProfileToServer()의 프로필 블롭에 실려 다른 기기에도 동기화된다.
      window.startSaveRouteSkinPreset = function() {
        if (Object.keys(state.skinStudioDraft.skin).length === 0) { showToast('먼저 스킨을 1개 이상 꾸며주세요.'); return; }
        state.ui.skinPresetNameDraft = '';
        render();
      };

      window.cancelSaveRouteSkinPreset = function() {
        state.ui.skinPresetNameDraft = null;
        render();
      };

      window.confirmSaveRouteSkinPreset = function() {
        const name = (state.ui.skinPresetNameDraft || '').trim();
        if (!name) { showToast('스킨 이름을 입력해주세요.'); return; }
        if (containsBannedWord(name)) { showToast('부적절한 단어는 사용할 수 없어요.'); return; }
        if (Object.keys(state.skinStudioDraft.skin).length === 0) { showToast('먼저 스킨을 1개 이상 꾸며주세요.'); return; }
        const preset = { id: 'skin_' + Date.now(), name, skin: { ...state.skinStudioDraft.skin } };
        state.routeSkinPresets.push(preset);
        state.ui.skinPresetNameDraft = null;
        saveState();
        showToast(`"${name}" 이름으로 스킨을 저장했어요! 💾`);
        render();
        syncProfileToServer();
      };

      // "꾸미기" 탭의 저장된 스킨 목록에서 "불러오기" - 계속 다듬을 수 있도록 draft로 되돌려놓는다.
      // (이름을 바꿔가며 다시 저장하고 싶을 때를 위함 - 기존 이름으로 덮어쓰지는 않고 항상 새 항목으로
      // 저장된다, confirmSaveRouteSkinPreset 참고.)
      window.loadSkinPresetForEditing = function(presetId) {
        const preset = state.routeSkinPresets.find(p => p.id === presetId);
        if (!preset) return;
        state.skinStudioDraft.skin = { ...preset.skin };
        saveState();
        showToast(`"${preset.name}" 스킨을 불러왔어요. 수정 후 저장하면 새 이름으로 저장돼요.`);
        render();
      };

      // 새 루트 만들기 화면 드롭다운 전용 - 저장된 스킨을 rb.skin에 통째로 적용한다.
      window.applyRouteSkinPreset = function(presetId) {
        const rb = state.ui.routeBuilder;
        if (!rb) return;
        if (!presetId) { rb.appliedPresetId = null; render(); return; }
        const preset = state.routeSkinPresets.find(p => p.id === presetId);
        if (!preset) return;
        rb.skin = { ...preset.skin };
        rb.appliedPresetId = preset.id;
        showToast(`"${preset.name}" 스킨을 적용했어요 ✨`);
        render();
      };

      window.deleteRouteSkinPreset = function(presetId) {
        const idx = state.routeSkinPresets.findIndex(p => p.id === presetId);
        if (idx === -1) return;
        const name = state.routeSkinPresets[idx].name;
        state.routeSkinPresets.splice(idx, 1);
        const rb = state.ui.routeBuilder;
        if (rb && rb.appliedPresetId === presetId) rb.appliedPresetId = null;
        saveState();
        showToast(`"${name}" 스킨을 삭제했어요.`);
        render();
        syncProfileToServer();
      };

      // "꾸미기" 탭 (별도 페이지) - 루트카드 스킨 12파츠(배경/프레임/지도스타일/핀/뱃지/스티커/
      // 날씨이펙트/필터)를 꾸미고 이름 붙여 저장한다. 특정 루트에 묶이지 않은 독립 작업공간이라
      // state.skinStudioDraft에 그 자체로 지속되고, "새 루트 만들기" 화면에서는 여기서 저장한
      // 이름을 드롭다운으로 골라 적용만 한다(직접 아이템을 고르지 않음 - applyRouteSkinPreset 참고).
      function renderSkinStudio() {
        const draft = state.skinStudioDraft;
        const previewData = { title: '나의 트레일 경로', purpose: ROUTE_PURPOSES[0], skin: draft.skin };
        const currentPart = ROUTE_SKIN_PARTS.find(p => p.key === draft.skinTab) || ROUTE_SKIN_PARTS[0];
        const itemsForPart = state.routeSkinShop.items.filter(i => i.part === draft.skinTab);

        let html = `
          <div style="font-size:18px; font-weight:900; margin-bottom:14px;">🎨 경로 커스텀 상점</div>

          <div style="font-size:13px; font-weight:800; color:var(--text-sub); margin-bottom:8px;">내 경로 미리보기</div>
          <div style="margin-bottom:16px;">${renderRouteSkinPreviewCard(previewData)}</div>

          <div class="skin-part-tabs" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin-bottom:14px;">
            ${ROUTE_SKIN_PARTS.map(p => `
              <div onclick="selectRouteSkinTab('${p.key}')" style="flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 14px; border-radius:14px; cursor:pointer; background:${draft.skinTab === p.key ? 'var(--primary)' : '#F5F5F0'};">
                <span style="font-size:18px;">${p.emoji}</span>
                <span style="font-size:10px; font-weight:800; white-space:nowrap; color:${draft.skinTab === p.key ? '#FFF' : 'var(--text)'};">${p.label}${draft.skin[p.key] ? ' ✓' : ''}</span>
              </div>
            `).join('')}
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div style="font-size:14px; font-weight:900;">${currentPart.label} 선택</div>
            <div style="font-size:12px; color:var(--text-sub);">${itemsForPart.length}개</div>
          </div>
          <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:16px;">
            ${itemsForPart.map(item => renderRouteSkinShopItem(item, draft)).join('')}
            ${state.routeSkinShop.loaded && itemsForPart.length === 0 ? `<div style="grid-column:1/-1; text-align:center; color:var(--text-sub); font-size:12px; padding:10px;">아이템을 불러오지 못했어요.</div>` : ''}
          </div>

          <div style="font-size:14px; font-weight:900; margin-bottom:8px;">저장한 스킨${state.routeSkinPresets.length ? ` (${state.routeSkinPresets.length}개)` : ''}</div>
        `;

        if (state.routeSkinPresets.length === 0) {
          html += `
            <div style="text-align:center; padding:26px 20px; color:var(--text-sub); background:#FAFAF8; border-radius:16px; border:1px dashed var(--border); font-size:12px; line-height:1.6; margin-bottom:16px;">
              📦 저장한 스킨이 없어요<br/>커스텀한 디자인을 저장하면 여기에 표시돼요
            </div>
          `;
        } else {
          html += `<div style="display:flex; flex-direction:column; gap:8px; margin-bottom:16px;">`;
          html += state.routeSkinPresets.map(p => `
            <div style="display:flex; align-items:center; gap:10px; padding:10px; background:#FFF; border:1px solid var(--border); border-radius:14px;">
              <div style="font-size:20px; flex-shrink:0;">🎨</div>
              <div style="flex:1; min-width:0; font-size:13px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(p.name)}</div>
              <button class="step-mini-btn" onclick="loadSkinPresetForEditing('${esc(p.id)}')">✏️ 불러오기</button>
              <button class="step-mini-btn" onclick="deleteRouteSkinPreset('${esc(p.id)}')">🗑️ 삭제</button>
            </div>
          `).join('');
          html += `</div>`;
        }

        html += state.ui.skinPresetNameDraft !== null ? `
          <div style="display:flex; gap:6px;">
            <input type="text" placeholder="스킨 이름 (예: 파스텔 감성)" value="${esc(state.ui.skinPresetNameDraft)}" maxlength="16" oninput="filteredInput(this, 'ui.skinPresetNameDraft')" style="flex:1; min-width:0; border:1px solid var(--border); border-radius:10px; padding:9px 10px; font-size:12px;" />
            <button class="cta-btn" style="padding:9px 12px; font-size:12px; flex-shrink:0;" onclick="confirmSaveRouteSkinPreset()">저장</button>
            <button class="btn-secondary" style="padding:9px 10px; font-size:12px; flex-shrink:0;" onclick="cancelSaveRouteSkinPreset()">취소</button>
          </div>
        ` : `
          <button class="cta-btn" style="width:100%; padding:13px; font-size:14px; opacity:${Object.keys(draft.skin).length === 0 ? '0.5' : '1'};" onclick="startSaveRouteSkinPreset()">🏷️ 저장하기</button>
        `;

        return html;
      }

      // ==========================================
      // 2c. 별사탕 선물하기 - 화폐는 기존 state.user.points(⭐) 그대로 쓴다. 별도 "금별" 화폐나
      // localStorage 키는 없다 - 이 앱은 이미 어디서나 별사탕을 🍬가 아닌 ⭐로만 표시해왔다.
      // ==========================================
      const GIFT_AMOUNT_PRESETS = [5, 10, 20, 50, 100];
      const GIFT_MESSAGE_PRESETS = [
        '고마워요! 덕분에 좋은 루트 갔어요 ⭐',
        '스킨 너무 예뻐요! 🌟',
        '다음에 같이 가요! 💫',
        "kyungyu's pick 인정! ⭐",
      ];
      let _lastGiftSentAt = 0;

      window.openGiftSheet = function(toUserId, toUserName, routeId) {
        if (!state.user.isLoggedIn) { showToast('로그인 후 선물할 수 있어요 🔐'); openLoginSheet('initial'); return; }
        if (!toUserId || toUserId === state.user.id) { showToast('자기 자신에게는 선물할 수 없어요 😅'); return; }
        state.ui.giftSheet = { toUserId, toUserName: toUserName || '상대방', routeId: routeId || null, amount: 10, message: GIFT_MESSAGE_PRESETS[0] };
        render();
      };

      window.closeGiftSheet = function() {
        state.ui.giftSheet = null;
        render();
      };

      window.selectGiftAmount = function(amount) {
        if (!state.ui.giftSheet) return;
        state.ui.giftSheet.amount = amount;
        render();
      };

      window.setGiftCustomAmount = function(value) {
        if (!state.ui.giftSheet) return;
        const n = parseInt(value, 10);
        state.ui.giftSheet.amount = Number.isFinite(n) ? n : '';
      };

      window.selectGiftMessagePreset = function(idx) {
        if (!state.ui.giftSheet) return;
        state.ui.giftSheet.message = GIFT_MESSAGE_PRESETS[idx];
        render();
      };

      // 별이 반짝이며 날아가는 연출 - 실제 애니메이션 대상(받는 사람 화면)은 알 수 없으니
      // "화면 위로 날아간다"는 느낌만 주는 1회성 연출. render()를 거치지 않고 body에 직접
      // 붙였다 애니메이션 종료 시 제거한다 (다른 곳의 토스트와 같은 성격의 일회성 이펙트).
      function playGiftFlyAnimation() {
        const el = document.createElement('div');
        el.className = 'gift-star-fly';
        el.textContent = '⭐';
        document.body.appendChild(el);
        const cleanup = () => { if (el.parentElement) el.remove(); };
        el.addEventListener('animationend', cleanup);
        setTimeout(cleanup, 1500);
      }

      window.sendCandyGift = async function() {
        const g = state.ui.giftSheet;
        if (!g) return;
        const amount = parseInt(g.amount, 10);
        if (!Number.isFinite(amount) || amount < 5) { showToast('최소 5개부터 선물할 수 있어요.'); return; }
        if (state.user.points < amount) { showToast(`별사탕이 부족해요! (보유: ${state.user.points}개 / 필요: ${amount}개)`); return; }
        if (containsBannedWord(g.message)) { showToast('부적절한 단어는 사용할 수 없어요.'); return; }
        const now = Date.now();
        if (now - _lastGiftSentAt < 3000) { showToast('잠시 후 다시 시도해주세요.'); return; }
        _lastGiftSentAt = now;

        try {
          const result = await apiJsonAwait('/api/points/gift', 'POST', {
            from_user_id: state.user.id,
            from_user_name: state.user.name,
            to_user_id: g.toUserId,
            to_user_name: g.toUserName,
            amount,
            message: g.message || '',
            route_id: g.routeId,
          });
          state.user.points = result.new_balance;
          const toUserName = g.toUserName;
          state.ui.giftSheet = null;
          saveState();
          render();
          playGiftFlyAnimation();
          showToast(`⭐ ${toUserName}님에게 ${amount}개 선물했어요!`);
          if (result.bonus_given > 0) {
            setTimeout(() => showToast(`🌟 답례 보너스! +${result.bonus_given}개 추가 지급됐어요`), 1600);
          }
        } catch (err) {
          showToast(err.message || '선물에 실패했어요.');
        }
      };

      // 받은 선물함 - candy_gifts를 to_user_id로 직접 조회한다(별도 inbox 테이블 없음).
      // 열 때마다 새로 불러온다 - deco/스킨 카탈로그와 달리 선물은 자주 들어오는 데이터라
      // "한 번만 로드" 캐시를 쓰면 새로 받은 선물이 안 보일 수 있다.
      window.openGiftbox = function() {
        if (!state.user.isLoggedIn) { showToast('로그인 후 선물함을 볼 수 있어요 🔐'); openLoginSheet('initial'); return; }
        state.ui.bottomSheet = 'giftbox';
        render();
        refreshGiftbox();
      };

      async function refreshGiftbox() {
        try {
          const res = await fetch(`${API_BASE}/api/points/gifts?user_id=${encodeURIComponent(state.user.id)}`);
          const data = await res.json();
          state.giftbox.gifts = data.gifts || [];
          state.giftbox.loaded = true;
          render();
        } catch (e) { console.warn('[giftbox] load failed', e); }
        apiJson('/api/points/gifts/read', 'POST', { user_id: state.user.id });
      }

      window.replyGift = function(fromUserId, fromUserName) {
        openGiftSheet(fromUserId, fromUserName, null);
      };

      // ==========================================
      // 3. Follow Route Overlay & GPS Check-in
      // ==========================================
      window.startFollowRoute = function(routeId) {
        state.ui.followRouteId = routeId;
        saveState();
        render();
      };

      window.closeFollowRoute = function() {
        state.ui.followRouteId = null;
        state.ui.mapFullscreen = null;
        if (state.ui.chatSheet) {
          if (_chatPollTimer) { clearInterval(_chatPollTimer); _chatPollTimer = null; }
          state.ui.chatSheet = null;
          state.ui.chatMessages = [];
        }
        saveState();
        render();
      };

      // 루트 따라가기 화면의 카카오맵 (map_style/route_line/pin_start/pin_via/pin_end 스킨).
      // 기존 카카오 로그인과 같은 JS 키를 재사용한다 - Kakao Developers 콘솔에서 해당 앱에
      // "카카오맵" 제품이 활성화돼 있어야 한다(로그인과 별개로 켜야 하는 설정, 새 키는 필요 없음).
      // autoload=false + kakao.maps.load()는 Kakao Maps 공식 지연 로딩 패턴 - 지도를 실제로
      // 열 때(루트 따라가기)까지 SDK를 내려받지 않는다.
      let _kakaoMapsLoading = null;
      function loadKakaoMapsSdk() {
        if (window.kakao && window.kakao.maps && window.kakao.maps.Map) return Promise.resolve();
        if (_kakaoMapsLoading) return _kakaoMapsLoading;
        _kakaoMapsLoading = new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KAKAO_JS_KEY}&autoload=false`;
          script.onload = () => window.kakao.maps.load(resolve);
          script.onerror = () => { _kakaoMapsLoading = null; reject(new Error('Kakao Maps SDK load failed')); };
          document.head.appendChild(script);
        });
        return _kakaoMapsLoading;
      }

      let _routeMapInstance = null;
      let _routeMapOverlays = [];
      let _routeMapSignature = null; // route.id + gps 좌표 + 지도 관련 스킨의 해시 - 안 바뀌면 다시 안 그림
      let _fullscreenMapInstance = null; // 지도 크게보기(#route-map-fullscreen-host) 전용 별도 인스턴스
      let _fullscreenMapRouteId = null;

      // #route-map-host는 #root 밖에서 body의 직속 자식으로 영구히 살아있다 - render()가
      // #root.innerHTML을 통째로 재생성할 때마다 #route-map-slot(플레이스홀더 <div>)도 매번
      // 파괴되고 새로 만들어지므로, 실제 지도 요소를 그 슬롯 "안으로" appendChild 해서 옮기면
      // (처음엔 그렇게 짰었다) 바로 다음 render()에서 그 슬롯째로 함께 파괴돼 버린다. 대신 여기서는
      // host를 절대 옮기지 않고, 매 render() 끝에서 이 함수가 슬롯의 화면 좌표(getBoundingClientRect)
      // 를 읽어 position:fixed인 host를 그 위에 겹쳐 그린다 - 슬롯은 매번 새로 그려지는 빈
      // 자리표시자일 뿐이고, 실제 kakao.maps.Map은 host 위에서 단 한 번만 만들어진다.
      // Repositions the fixed map host over the slot's current screen rect, and tells Kakao Maps to
      // relayout if the size actually changed. Split out of ensureRouteMap() so it can also run from
      // the scroll/resize listener below (see the "GPS 연결이 되었다가 안되었다가" comment there) -
      // ensureRouteMap() itself only fires on render(), which a plain scroll/mobile browser chrome
      // show-or-hide/on-screen-keyboard resize does NOT trigger, so without this the host could drift
      // out of alignment with its slot (or Kakao Maps could keep rendering into a now-wrong-sized
      // canvas) until the next unrelated render happened to fire.
      function syncRouteMapPosition() {
        const host = document.getElementById('route-map-host');
        const slot = state.ui.followRouteId ? document.getElementById('route-map-slot') : null;
        if (host && slot && host.style.display !== 'none') {
          const rect = slot.getBoundingClientRect();
          const newTop = rect.top + 'px', newLeft = rect.left + 'px', newWidth = rect.width + 'px', newHeight = rect.height + 'px';
          const sizeChanged = host.style.width !== newWidth || host.style.height !== newHeight;
          host.style.position = 'fixed';
          host.style.top = newTop;
          host.style.left = newLeft;
          host.style.width = newWidth;
          host.style.height = newHeight;
          if (sizeChanged && _routeMapInstance) _routeMapInstance.relayout();

          // 지도가 이제 .route-timeline-scroll 안에서 함께 스크롤된다 - 다만 실제 <div>(host)는
          // position:fixed라 그 스크롤 영역의 overflow:hidden에 의해 자동으로 잘리지 않으므로,
          // 스크롤로 슬롯이 뷰포트 밖으로 나간 만큼을 clip-path로 직접 잘라 자연스럽게 사라지게
          // 한다 (지도 캔버스 자체를 리사이즈하는 게 아니라 시각적으로만 자르는 것이라 relayout이
          // 필요 없고, 스크롤 중 매 프레임 호출돼도 가볍다).
          const scrollBox = slot.closest('.route-timeline-scroll');
          if (scrollBox) {
            const box = scrollBox.getBoundingClientRect();
            const clipTop = Math.max(0, box.top - rect.top);
            const clipBottom = Math.max(0, rect.bottom - box.bottom);
            host.style.clipPath = (clipTop || clipBottom) ? `inset(${clipTop}px 0px ${clipBottom}px 0px)` : '';
          } else {
            host.style.clipPath = '';
          }
        }

        // 지도 크게보기(fullscreen) 호스트는 슬롯이 아니라 #app-frame(모바일 폭으로 가운데 정렬된
        // 앱 프레임)의 가로 위치만 따라간다 - 세로는 항상 '헤더 아래 ~ 화면 끝'으로 고정이라 스크롤에
        // 영향받지 않지만, 가로 위치는 창 크기(예: 데스크톱 브라우저 리사이즈)에 따라 바뀔 수 있다.
        const fsHost = document.getElementById('route-map-fullscreen-host');
        if (fsHost && state.ui.mapFullscreen && fsHost.style.display !== 'none') {
          const frame = document.getElementById('app-frame');
          if (frame) {
            const fRect = frame.getBoundingClientRect();
            const newLeft = fRect.left + 'px', newWidth = fRect.width + 'px';
            const sizeChanged = fsHost.style.width !== newWidth;
            fsHost.style.left = newLeft;
            fsHost.style.width = newWidth;
            if (sizeChanged && _fullscreenMapInstance) _fullscreenMapInstance.relayout();
          }
        }
      }

      // Re-syncs the map position(s) on scroll (capture phase - .route-timeline-scroll below the
      // small map doesn't bubble a 'scroll' event to window) and on viewport resize (address
      // bar/keyboard show or hide on mobile, orientation change). rAF-throttled since scroll can fire
      // very frequently.
      let _routeMapSyncQueued = false;
      function queueRouteMapPositionSync() {
        if ((!state.ui.followRouteId && !state.ui.mapFullscreen) || _routeMapSyncQueued) return;
        _routeMapSyncQueued = true;
        requestAnimationFrame(() => { _routeMapSyncQueued = false; syncRouteMapPosition(); });
      }
      window.addEventListener('scroll', queueRouteMapPositionSync, true);
      window.addEventListener('resize', queueRouteMapPositionSync);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', queueRouteMapPositionSync);

      function ensureRouteMap() {
        const host = document.getElementById('route-map-host');
        if (!host) return;
        const slot = state.ui.followRouteId ? document.getElementById('route-map-slot') : null;

        if (!slot) {
          host.style.display = 'none';
          return;
        }

        const route = state.routes.find(r => r.id === state.ui.followRouteId);
        if (!route) { host.style.display = 'none'; return; }

        host.style.display = 'block';
        host.style.zIndex = 91; // .fullscreen-overlay(z-index:90) 바로 위 - 그 안에 있는 것처럼 보이게
        syncRouteMapPosition();

        const gpsSteps = route.steps.filter(s => s.gps && typeof s.gps.lat === 'number' && typeof s.gps.lng === 'number');
        if (gpsSteps.length === 0) {
          host.style.filter = '';
          host.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-sub); font-size:12px; text-align:center; padding:0 20px; line-height:1.5;">📍 경유지에 GPS 정보가 없어<br/>지도를 표시할 수 없어요</div>`;
          _routeMapInstance = null;
          _routeMapSignature = null;
          return;
        }

        const signature = JSON.stringify({
          id: route.id,
          pts: gpsSteps.map(s => [s.gps.lat, s.gps.lng]),
          skin: [route.skin.map_style, route.skin.route_line, route.skin.pin_start, route.skin.pin_via, route.skin.pin_end],
        });
        if (signature === _routeMapSignature && _routeMapInstance) return;
        _routeMapSignature = signature;

        loadKakaoMapsSdk().then(() => {
          // 로딩이 비동기라 기다리는 동안 사용자가 화면을 닫거나 다른 루트를 열었을 수 있다.
          if (state.ui.followRouteId !== route.id || _routeMapSignature !== signature) return;
          host.innerHTML = '';
          drawRouteMap(host, route, gpsSteps);
        }).catch(err => {
          console.warn('[route-map]', err);
          host.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-sub); font-size:12px;">지도를 불러오지 못했어요</div>`;
        });
      }

      // Draws the path/pins/map-style skin onto an already-created kakao.maps.Map - shared by the
      // small inline map and the "지도 크게 보기" fullscreen map (openFullscreenRouteMap) so a
      // route's skin looks identical in both. Returns the overlays it created.
      function paintRouteMap(kakao, map, host, route, gpsSteps) {
        const overlays = [];

        // map_style: 카카오맵은 벡터 타일 자체를 커스터마이징하는 무료 API가 없어 지도 컨테이너에
        // CSS filter를 입혀 스킨을 근사한다 - deco 시스템이 별도 이미지 에셋 없이 이모지만으로
        // 렌더링하는 것과 같은 절충이다.
        const mapStyleIdx = routeSkinItemIndex(findRouteSkinItem(route.skin.map_style));
        host.style.filter = mapStyleIdx >= 0 ? MAP_STYLE_PALETTE[mapStyleIdx] : '';

        const path = gpsSteps.map(s => new kakao.maps.LatLng(s.gps.lat, s.gps.lng));
        if (path.length > 1) {
          const lineIdx = routeSkinItemIndex(findRouteSkinItem(route.skin.route_line));
          const lineStyle = ROUTE_LINE_PALETTE[lineIdx >= 0 ? lineIdx : 0];
          overlays.push(new kakao.maps.Polyline({
            map, path,
            strokeWeight: 4,
            strokeColor: lineStyle.color,
            strokeOpacity: 0.9,
            strokeStyle: lineStyle.dash.length ? 'shortdash' : 'solid',
          }));
        }

        const pinEmoji = (partKey, fallback) => (findRouteSkinItem(route.skin[partKey]) || {}).emoji || fallback;
        gpsSteps.forEach((s, i) => {
          const isStart = i === 0;
          const isEnd = i === gpsSteps.length - 1 && gpsSteps.length > 1;
          const emoji = isStart ? pinEmoji('pin_start', '🚩') : isEnd ? pinEmoji('pin_end', '🏁') : pinEmoji('pin_via', '📍');
          overlays.push(new kakao.maps.CustomOverlay({
            map,
            position: new kakao.maps.LatLng(s.gps.lat, s.gps.lng),
            content: `<div style="font-size:24px; transform:translateY(-70%);">${emoji}</div>`,
          }));
        });

        if (path.length > 1) {
          const bounds = new kakao.maps.LatLngBounds();
          path.forEach(p => bounds.extend(p));
          map.setBounds(bounds);
        }
        return overlays;
      }

      // 지도 우상단에 '크게 보기' 버튼을 얹는다 - host.innerHTML='' 로 다시 그려질 때마다(ensureRouteMap
      // 의 시그니처 변경 분기) 같이 지워지므로 drawRouteMap()이 매번 다시 붙인다. #route-map-host
      // 자체(position:fixed, z-index:91)의 자식이라 지도 캔버스와 같은 쌓임 맥락 위에서 항상 보인다.
      function appendMapExpandButton(host, routeId) {
        const btn = document.createElement('button');
        btn.className = 'icon-btn';
        btn.title = '지도 크게 보기';
        btn.style.cssText = 'position:absolute; top:8px; right:8px; z-index:5; width:30px; height:30px; font-size:14px; background:rgba(255,255,255,0.92);';
        btn.textContent = '⤢';
        btn.onclick = (e) => { e.stopPropagation(); openFullscreenRouteMap(routeId); };
        host.appendChild(btn);
      }

      function drawRouteMap(host, route, gpsSteps) {
        const kakao = window.kakao;
        const center = new kakao.maps.LatLng(gpsSteps[0].gps.lat, gpsSteps[0].gps.lng);
        const map = new kakao.maps.Map(host, { center, level: 6 });
        _routeMapInstance = map;
        _routeMapOverlays = paintRouteMap(kakao, map, host, route, gpsSteps);
        appendMapExpandButton(host, route.id);
      }

      // ==========================================
      // 지도 크게 보기 (Fullscreen Route Map)
      // ==========================================
      // 작은 인라인 지도와 같은 이유로 별도의 영구 호스트(#route-map-fullscreen-host, #root 밖)를
      // 쓴다 - 다만 슬롯을 추적할 필요 없이 항상 헤더 바로 아래~화면 끝을 채우면 되므로 위치 동기화는
      // 가로(app-frame 폭) 쪽만 필요하다 (syncRouteMapPosition() 참고). 작은 지도와 완전히 분리된
      // 별도의 kakao.maps.Map 인스턴스를 쓴다 - 닫았다 열어도 서로의 pan/zoom 상태에 영향을 주지 않고,
      // 신호(_routeMapSignature) 캐싱 로직도 서로 얽히지 않는다.
      window.openFullscreenRouteMap = function(routeId) {
        state.ui.mapFullscreen = { routeId };
        render();
      };

      window.closeFullscreenRouteMap = function() {
        state.ui.mapFullscreen = null;
        const host = document.getElementById('route-map-fullscreen-host');
        if (host) { host.style.display = 'none'; host.innerHTML = ''; }
        _fullscreenMapInstance = null;
        _fullscreenMapRouteId = null;
        render();
      };

      function ensureFullscreenRouteMap() {
        const host = document.getElementById('route-map-fullscreen-host');
        if (!host) return;
        if (!state.ui.mapFullscreen) { host.style.display = 'none'; return; }

        const route = state.routes.find(r => r.id === state.ui.mapFullscreen.routeId);
        if (!route) { host.style.display = 'none'; return; }

        host.style.display = 'block';
        syncRouteMapPosition();

        const gpsSteps = route.steps.filter(s => s.gps && typeof s.gps.lat === 'number' && typeof s.gps.lng === 'number');
        if (gpsSteps.length === 0) {
          host.style.filter = '';
          host.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-sub); font-size:13px; text-align:center; padding:0 20px; line-height:1.5;">📍 경유지에 GPS 정보가 없어<br/>지도를 표시할 수 없어요</div>`;
          _fullscreenMapInstance = null;
          _fullscreenMapRouteId = null;
          return;
        }

        if (_fullscreenMapInstance && _fullscreenMapRouteId === route.id) return; // 이미 이 루트로 그려져 있음
        _fullscreenMapRouteId = route.id;

        loadKakaoMapsSdk().then(() => {
          if (!state.ui.mapFullscreen || state.ui.mapFullscreen.routeId !== route.id) return;
          host.innerHTML = '';
          const kakao = window.kakao;
          const center = new kakao.maps.LatLng(gpsSteps[0].gps.lat, gpsSteps[0].gps.lng);
          const map = new kakao.maps.Map(host, { center, level: 6 });
          _fullscreenMapInstance = map;
          paintRouteMap(kakao, map, host, route, gpsSteps);
        }).catch(err => {
          console.warn('[route-map-fullscreen]', err);
          host.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-sub); font-size:13px;">지도를 불러오지 못했어요</div>`;
        });
      }

      window.openStepPhotoLightbox = function(routeId, stepIdx, photoIdx) {
        state.ui.photoLightbox = { routeId, stepIdx, photoIdx: photoIdx || 0 };
        resetLightboxZoom();
        render();
      };

      window.closePhotoLightbox = function() {
        state.ui.photoLightbox = null;
        resetLightboxZoom();
        render();
      };

      window.lightboxPhotoNav = function(dir) {
        const lb = state.ui.photoLightbox;
        if (!lb) return;
        const route = state.routes.find(r => r.id === lb.routeId);
        const step = route && route.steps[lb.stepIdx];
        if (!step || !step.images || step.images.length < 2) return;
        lb.photoIdx = (lb.photoIdx + dir + step.images.length) % step.images.length;
        resetLightboxZoom();
        render();
      };

      // 사진 확대: 핀치(두 손가락)로 확대/축소, 이미지 더블탭으로 확대 토글, 확대된 상태에서는
      // 한 손가락 드래그가 스와이프(사진 넘기기) 대신 팬(이동)이 된다. 드래그/핀치 중 render()를
      // 부르면(전체 innerHTML 재생성) 끊기므로 제스처 도중에는 <img> DOM만 직접 갱신하고 render()는
      // 사진 전환/열기/닫기 때만 부른다.
      let _lightboxZoom = { scale: 1, panX: 0, panY: 0 };
      let _lightboxPointers = new Map();
      let _lightboxPinch = null; // { startDist, startScale }
      let _lightboxLastTap = 0;

      function resetLightboxZoom() {
        _lightboxZoom = { scale: 1, panX: 0, panY: 0 };
        _lightboxPointers.clear();
        _lightboxPinch = null;
      }

      function applyLightboxImageTransform() {
        const img = document.getElementById('lightbox-img');
        if (!img) return;
        img.style.transform = `translate(${_lightboxZoom.panX}px, ${_lightboxZoom.panY}px) scale(${_lightboxZoom.scale})`;
      }

      window.toggleLightboxZoom = function() {
        _lightboxZoom = _lightboxZoom.scale > 1 ? { scale: 1, panX: 0, panY: 0 } : { scale: 2.5, panX: 0, panY: 0 };
        const img = document.getElementById('lightbox-img');
        if (!img) return;
        img.style.transition = 'transform 0.2s ease-out';
        applyLightboxImageTransform();
        setTimeout(() => { img.style.transition = ''; }, 200);
      };

      // Finger-drag swipe to change photos, plus tap-to-close on the backdrop - both handled
      // through one pointerdown/pointerup pair (pointer events cover touch and mouse alike) rather
      // than a plain onclick, since a swipe's pointerup would otherwise also register as a click
      // and immediately close the lightbox right after navigating.
      let _lightboxPointerStart = null;

      window.lightboxPointerDown = function(e) {
        _lightboxPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (_lightboxPointers.size === 2) {
          const pts = [..._lightboxPointers.values()];
          _lightboxPinch = { startDist: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1, startScale: _lightboxZoom.scale };
          _lightboxPointerStart = null; // second finger landed - this is a pinch, not a swipe
        } else if (_lightboxPointers.size === 1) {
          _lightboxPointerStart = { x: e.clientX, y: e.clientY };
        }
      };

      window.lightboxPointerUp = function(e) {
        _lightboxPointers.delete(e.pointerId);
        if (_lightboxPointers.size < 2) _lightboxPinch = null;
        if (_lightboxPointers.size === 1 && _lightboxZoom.scale > 1) {
          // One finger lifted after a pinch while still zoomed in - re-arm panning with the
          // remaining finger instead of requiring a fresh tap to resume moving the photo.
          const remaining = [..._lightboxPointers.values()][0];
          _lightboxPointerStart = { x: remaining.x, y: remaining.y };
          return;
        }
        if (!_lightboxPointerStart) return;
        const dx = e.clientX - _lightboxPointerStart.x;
        const dy = e.clientY - _lightboxPointerStart.y;
        _lightboxPointerStart = null;
        const TAP_THRESHOLD = 10;
        const SWIPE_THRESHOLD = 50;
        // A near-zero-distance pointerup is a tap (or the second tap of a double-tap), whether or
        // not the photo happens to be zoomed in right now - checking this before the zoomed-pan
        // guard below is what lets a double-tap zoom back OUT again (previously the guard returned
        // early for every pointerup while zoomed, so it never even reached the double-tap check).
        if (Math.abs(dx) < TAP_THRESHOLD && Math.abs(dy) < TAP_THRESHOLD) {
          if (e.target.id === 'lightbox-img') {
            const now = Date.now();
            if (now - _lightboxLastTap < 300) { _lightboxLastTap = 0; toggleLightboxZoom(); }
            else _lightboxLastTap = now;
          } else if (e.target.classList.contains('photo-lightbox')) {
            closePhotoLightbox();
          }
          return;
        }
        // Beyond this point it moved like a real drag, not a tap. While zoomed in that was a pan
        // (already applied live in pointermove above), not a request to swipe to another photo.
        if (_lightboxZoom.scale > 1) return;
        if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
          lightboxPhotoNav(dx < 0 ? 1 : -1); // swiped left -> next, right -> prev
        }
      };

      document.addEventListener('pointermove', e => {
        if (!state.ui.photoLightbox || !_lightboxPointers.has(e.pointerId)) return;
        _lightboxPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        if (_lightboxPointers.size === 2 && _lightboxPinch) {
          const pts = [..._lightboxPointers.values()];
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) || 1;
          _lightboxZoom.scale = Math.min(4, Math.max(1, _lightboxPinch.startScale * (dist / _lightboxPinch.startDist)));
          applyLightboxImageTransform();
        } else if (_lightboxPointers.size === 1 && _lightboxZoom.scale > 1 && _lightboxPointerStart) {
          _lightboxZoom.panX += e.movementX || 0;
          _lightboxZoom.panY += e.movementY || 0;
          applyLightboxImageTransform();
        }
      });
      document.addEventListener('pointercancel', e => {
        _lightboxPointers.delete(e.pointerId);
        if (_lightboxPointers.size < 2) _lightboxPinch = null;
      });

      // 따라가기: 루트 전체가 공유하는 단일 채팅창 (경유지별이 아니라 루트 단위 - chats 테이블의
      // step_index는 항상 0으로 보냄). 실시간 브로드캐스트가 없어서(5️⃣ Durable Objects 미착수)
      // 열려있는 동안 주기적으로 다시 불러오는 걸로 대신한다.
      let _chatPollTimer = null;

      // Tracked across render() calls (not part of `state` - these are rendering/navigation
      // bookkeeping, not app data): which sheet-like UI last got the slideUp entrance animation,
      // and whether we've pushed a history entry for "some overlay is open" (mobile back-button).
      let _lastOpenSheetKey = null;
      let _overlayHistoryPushed = false;

      window.openRouteChat = function(routeId) {
        state.ui.chatSheet = { routeId };
        state.ui.chatMessages = [];
        state.ui.chatDraft = '';
        state.ui.chatLoading = true;
        render();
        loadRouteChatMessages(routeId);
        if (_chatPollTimer) clearInterval(_chatPollTimer);
        _chatPollTimer = setInterval(() => loadRouteChatMessages(routeId, true), 4000);
      };

      window.closeRouteChat = function() {
        if (_chatPollTimer) { clearInterval(_chatPollTimer); _chatPollTimer = null; }
        state.ui.chatSheet = null;
        state.ui.chatMessages = [];
        render();
      };

      async function loadRouteChatMessages(routeId, silent) {
        if (!silent) state.ui.chatLoading = true;
        try {
          const res = await fetch(`${API_BASE}/api/chat?route_id=${encodeURIComponent(routeId)}`);
          if (res.ok) {
            const data = await res.json();
            state.ui.chatMessages = data.messages || [];
          }
        } catch (err) {
          console.warn('[chat load failed]', err);
        }
        state.ui.chatLoading = false;
        // The sheet may have been closed (or switched to a different route) while this was in flight.
        if (state.ui.chatSheet && state.ui.chatSheet.routeId === routeId) {
          render();
          // Jump to the newest message on the initial load only - a silent poll refresh shouldn't
          // yank the view down while someone's scrolled up reading history.
          if (!silent) scrollChatToBottom();
        }
      }

      function scrollChatToBottom() {
        const el = document.querySelector('.chat-message-list');
        if (el) el.scrollTop = el.scrollHeight;
      }

      window.sendRouteChatMessage = function() {
        const sheet = state.ui.chatSheet;
        const text = state.ui.chatDraft.trim();
        if (!sheet || !text) return;
        if (containsBannedWord(text)) {
          showToast('부적절한 단어는 보낼 수 없어요.');
          return;
        }
        const avatar = getAvatarDisplay(state.user.name);
        state.ui.chatMessages.push({
          id: 'local_' + Date.now(),
          user_id: state.user.id,
          user_name: state.user.name,
          avatar,
          text,
          created_at: new Date().toISOString(),
        });
        state.ui.chatDraft = '';
        render();
        scrollChatToBottom();
        apiJson('/api/chat', 'POST', {
          route_id: sheet.routeId,
          step_index: 0,
          user_id: state.user.id,
          user_name: state.user.name,
          avatar,
          text,
        }).then(() => loadRouteChatMessages(sheet.routeId, true));
      };

      window.handleChatInputKey = function(e) {
        // isComposing guards against IME (한글 등) composition: browsers fire a keydown for the
        // Enter that confirms a composing syllable too, and without this check that same Enter
        // would also send the message mid-composition.
        if (e.key === 'Enter' && !e.isComposing) {
          e.preventDefault();
          sendRouteChatMessage();
        }
      };

      // Follow overlay shows every step at once (scrollable timeline), so GPS check-in
      // targets an explicit step index rather than an implicit "current step".
      const CHECKIN_MAX_DISTANCE_M = 500; // "나 인증"은 경유지 GPS 좌표에서 이 거리(m) 이내일 때만 허용

      function finalizeGpsCheckIn(route, stepIdx, key) {
        state.user.followCheckins[key] = true;
        state.user.points += 5;
        // Add comment
        if (!route.comments) route.comments = [];
        route.comments.unshift({
          user: state.user.name,
          text: `📍 [${state.user.name}] 스텝 ${stepIdx + 1} GPS 인증 완료! 발도장 꾹 ✨`
        });
        saveState();
        showToast('스텝 GPS 인증 성공! ⭐+5 별사탕 적립');
        render();
        apiJson(`/api/routes/${encodeURIComponent(route.id)}/checkin`, 'POST', { user_id: state.user.id, user_name: state.user.name, step_index: stepIdx });
      }

      window.gpsCheckInStep = function(routeId, stepIdx) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        const key = route.id + '_' + stepIdx + '_' + state.user.name;
        if (state.user.followCheckins[key]) {
          // Tapping an already-checked-in step cancels it (undo a mistaken tap).
          // Claw back the reward so check-in/cancel can't be farmed for free 별사탕.
          delete state.user.followCheckins[key];
          state.user.points = Math.max(0, state.user.points - 5);
          saveState();
          showToast('GPS 인증을 취소했어요.');
          render();
          apiJson(`/api/routes/${encodeURIComponent(routeId)}/checkin`, 'POST', { user_id: state.user.id, user_name: state.user.name, step_index: stepIdx });
          return;
        }

        if (state.ui.checkinGpsLoading) return; // 위치 확인 중 중복 탭 방지

        const step = route.steps[stepIdx];
        const stepGps = step && step.gps && typeof step.gps.lat === 'number' && typeof step.gps.lng === 'number' ? step.gps : null;
        // 경유지에 GPS 좌표가 아예 없으면 거리 비교 자체가 불가능하니 예전처럼 탭만으로 인증 처리.
        if (!stepGps) { finalizeGpsCheckIn(route, stepIdx, key); return; }

        if (!navigator.geolocation) {
          showToast('이 브라우저는 위치 정보를 지원하지 않아 거리 확인 없이 인증할게요.');
          finalizeGpsCheckIn(route, stepIdx, key);
          return;
        }

        state.ui.checkinGpsLoading = key;
        render();
        navigator.geolocation.getCurrentPosition(
          pos => {
            state.ui.checkinGpsLoading = null;
            const distM = Math.round(haversineDistanceKm(pos.coords.latitude, pos.coords.longitude, stepGps.lat, stepGps.lng) * 1000);
            if (distM > CHECKIN_MAX_DISTANCE_M) {
              showToast(`경유지와 너무 멀어요! (약 ${distM}m 떨어짐 · ${CHECKIN_MAX_DISTANCE_M}m 이내에서만 인증 가능해요) 📍`);
              render();
              return;
            }
            finalizeGpsCheckIn(route, stepIdx, key);
          },
          err => {
            state.ui.checkinGpsLoading = null;
            showToast(err.code === err.PERMISSION_DENIED
              ? '위치 접근 권한이 거부되어 거리를 확인할 수 없어요. 브라우저 설정에서 위치 권한을 허용해주세요.'
              : '현재 위치를 가져올 수 없어요. 잠시 후 다시 시도해주세요.');
            render();
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
      };

      // Demo-only: simulate a fellow participant checking in at a given step.
      window.verifyParticipantGPS = function(routeId, step, name) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        const key = routeId + '_' + step + '_' + name;
        if (state.user.followCheckins[key]) return;
        state.user.followCheckins[key] = true;
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: name, avatar: getAvatarDisplay(name), action: `스텝 ${step + 1} GPS 인증했어요`, time: '방금' });
        saveState();
        showToast(`${name}님이 GPS 인증을 완료했어요! 📍`);
        render();
      };

      window.openFinishModal = function() {
        const route = state.routes.find(r => r.id === state.ui.followRouteId);
        if (!route) return;
        const totalSteps = route.steps.length;
        const myCheckedCount = route.steps.filter((_, i) => state.user.followCheckins[route.id + '_' + i + '_' + state.user.name]).length;
        if (myCheckedCount < totalSteps) {
          showToast(`모든 경유지 GPS 인증을 마쳐야 완주할 수 있어요 (${myCheckedCount}/${totalSteps}) 📍`);
          return;
        }
        state.ui.bottomSheet = 'finishCertification';
        state.ui.review = { stars: 5, text: '', images: [] };
        render();
      };

      window.setReviewStars = function(stars) {
        state.ui.review.stars = stars;
        render();
      };

      window.addReviewPhoto = function() {
        const input = document.getElementById('global-file-input');
        input.onchange = function(e) {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;
          Promise.all(files.map(resizeImageFile)).then(dataUrls => {
            dataUrls.filter(Boolean).forEach(url => state.ui.review.images.push(url));
            showToast(`인증샷 ${files.length}장이 첨부되었습니다! 📷`);
            render();
          });
        };
        input.click();
      };

      window.completeRouteCertification = function(skipExtra = false) {
        const route = state.routes.find(r => r.id === state.ui.followRouteId);
        let earned = 15; // 기본 15
        if (!skipExtra) {
          if (state.ui.review.images && state.ui.review.images.length > 0) earned += 10;
          if (state.ui.review.text && state.ui.review.text.trim().length > 0) earned += 5;
        }
        state.user.points += earned;
        if (route && !state.user.completedRoutes.includes(route.id)) {
          state.user.completedRoutes.push(route.id);
        }
        state.challenge.progress = Math.min(3, state.challenge.progress + 1);
        state.ui.lastCompletion = { distance: route ? route.distance : '-', time: route ? route.time : '-', earned };
        state.ui.bottomSheet = 'finishSummary';
        saveState();
        render();
        syncProfileToServer();
        syncPointsDelta(earned, '루트 완주 인증');
      };

      // ==========================================
      // 4. Shop, Customization & Economy
      // ==========================================
      window.openCustomShop = function() {
        state.ui.bottomSheet = 'customShop';
        render();
      };

      window.openChargeModal = function() {
        state.ui.bottomSheet = 'charge';
        state.ui.charge = { pack: null, method: null };
        state.ui.profileSheet = false;
        render();
      };

      window.equipItem = function(category, key) {
        state.custom.equipped[category] = key;
        if (category === 'theme') {
          const color = THEME_MAP[key] || '#8B6CFF';
          document.documentElement.style.setProperty('--primary', color);
          // Visual flash
          const flash = document.createElement('div');
          flash.className = 'theme-flash';
          document.body.appendChild(flash);
          setTimeout(() => flash.remove(), 400);
        }
        showToast(`${category === 'theme' ? '테마' : category === 'avatar' ? '아바타' : '스티커'}가 적용되었습니다! ✨`);
        saveState();
        render();
        syncProfileToServer();
      };

      window.buyItem = function(category, key, cost) {
        if (state.user.points < cost) {
          showToast(`별사탕이 부족해요! (보유: ${state.user.points}개 / 필요: ${cost}개)`);
          return;
        }
        state.user.points -= cost;
        state.custom.owned[category].push(key);
        state.custom.equipped[category] = key;
        showToast(`구매 완료 및 장착되었습니다! ⭐-${cost}`);
        saveState();
        render();
        syncProfileToServer();
        syncPointsDelta(-cost, `상점 구매: ${category}/${key}`);
      };

      window.giftItem = function(category, key, cost) {
        if (state.user.points < cost) {
          showToast(`선물하기 위한 별사탕이 부족해요! ⭐ 충전소를 이용해주세요.`);
          return;
        }
        state.user.points -= cost;
        saveState();
        const link = `${SITE_BASE}?gift=${category}_${key}&from=${encodeURIComponent(state.user.name)}`;
        copyText(link, '선물 링크가 복사됐어요! 친구에게 전달해보세요 🎁', 0);
        syncPointsDelta(-cost, `선물하기: ${category}/${key}`);
      };

      // 충전소: 팩 + 결제수단 선택 후 "결제하기"로 확정하는 2단계 플로우
      window.selectChargePack = function(amount, won) {
        state.ui.charge.pack = { amount, won };
        render();
      };

      window.selectChargeMethod = function(method) {
        state.ui.charge.method = method;
        render();
      };

      // PortOne 결제수단 코드 매핑 - 카카오페이는 별도 easyPayProvider가 필요.
      const PORTONE_PAY_METHODS = {
        '카드': { payMethod: 'CARD' },
        '카카오페이': { payMethod: 'EASY_PAY', easyPay: { easyPayProvider: 'KAKAOPAY' } },
        '휴대폰': { payMethod: 'MOBILE' },
      };

      // 결제창을 띄우고, 성공하면 반드시 서버(POST /api/points/verify)가 PortOne에 직접 물어
      // 결제 상태/금액을 확인한 뒤 돌려주는 잔액으로만 별사탕을 반영한다 - 이 앱의 다른 포인트
      // 지급(초대/체크인 등)과 달리 실제 결제가 걸려 있어 클라이언트가 보내는 값을 믿을 수 없다.
      //
      // PortOne 모바일 웹은 카카오페이를 REDIRECTION 창 방식으로만 지원한다 (PC의 IFRAME/POPUP과
      // 달리 브라우저가 실제로 카카오페이 페이지로 이동했다가 돌아옴). redirectUrl 없이는 결제가
      // 끝나도 돌아올 곳이 없어 그 화면에 갇히고 뒤로가기도 먹히지 않는다 - 신고된 "QR결제 화면에서
      // 뒤로가기 안 됨" 증상이 이것. 그래서 여기서 반드시 redirectUrl을 지정하고, 이 함수의
      // await 리턴(PC IFRAME/POPUP)과 페이지 재로딩 후 돌아오는 리다이렉트(모바일)를 모두 같은
      // finishCharge()로 합류시킨다. 재로딩 후에는 이 함수 스코프의 pack/method가 사라지므로
      // 결제 시작 직전에 localStorage에 최소 정보를 남겨두고, 돌아온 뒤 applyPaymentRedirectResult()
      // (DOMContentLoaded에서 호출)가 그걸 읽어 finishCharge()를 이어서 호출한다.
      window.confirmCharge = async function() {
        const { pack, method } = state.ui.charge;
        if (!pack || !method) {
          showToast('충전 금액과 결제수단을 모두 선택해주세요.');
          return;
        }
        if (!state.user.isLoggedIn) {
          state.ui.bottomSheet = null;
          showToast('로그인 후 별사탕을 충전할 수 있어요 🔐');
          openLoginSheet('initial');
          return;
        }
        if (typeof PortOne === 'undefined') {
          showToast('결제 모듈을 불러오지 못했어요. 잠시 후 다시 시도해주세요.');
          return;
        }

        const wonAmount = parseInt(pack.won.replace(/[^0-9]/g, ''), 10);
        const paymentId = `pay_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
        const redirectUrl = `${window.location.origin}${window.location.pathname}?charge_return=1`;
        try {
          localStorage.setItem('keongyu_pending_charge', JSON.stringify({ paymentId, amount: pack.amount, won: pack.won }));
        } catch (e) {}

        let payResponse;
        try {
          payResponse = await PortOne.requestPayment({
            storeId: PORTONE_STORE_ID,
            channelKey: PORTONE_CHANNEL_KEY,
            paymentId,
            orderName: `별사탕 ${pack.amount}개`,
            totalAmount: wonAmount,
            currency: 'CURRENCY_KRW',
            customer: { customerId: state.user.id, fullName: state.user.name },
            redirectUrl,
            ...PORTONE_PAY_METHODS[method],
          });
        } catch (err) {
          try { localStorage.removeItem('keongyu_pending_charge'); } catch (e) {}
          showToast('결제창을 여는 데 실패했어요. 잠시 후 다시 시도해주세요.');
          return;
        }

        // 모바일 REDIRECTION 방식은 여기 도달하지 못하고 페이지가 통째로 이동한다 - payResponse가
        // 안 온 경우는 실패가 아니라 리다이렉트가 진행 중인 것뿐이므로 토스트 없이 조용히 반환.
        if (!payResponse) return;

        if (payResponse.code) {
          try { localStorage.removeItem('keongyu_pending_charge'); } catch (e) {}
          showToast(payResponse.message || '결제가 취소됐어요.');
          return;
        }

        await finishCharge(payResponse.paymentId);
      };

      // PC(IFRAME/POPUP)의 즉시 완료 경로와 모바일(REDIRECTION)의 재로딩 후 복귀 경로가 모두
      // 여기로 합류해 서버 검증 + 잔액 반영을 한 곳에서 처리한다. confirmCharge() 주석 참고.
      async function finishCharge(paymentId) {
        try {
          const result = await apiJsonAwait('/api/points/verify', 'POST', {
            payment_id: paymentId,
            user_id: state.user.id,
          });
          state.user.points = result.points;
          showToast(`결제가 완료됐어요! 별사탕 ${result.points}개 보유 중이에요. ⭐`);
        } catch (err) {
          showToast('결제 확인에 실패했어요. 문제가 계속되면 문의해주세요.');
          return;
        } finally {
          try { localStorage.removeItem('keongyu_pending_charge'); } catch (e) {}
        }

        state.ui.charge = { pack: null, method: null };
        state.ui.bottomSheet = null;
        saveState();
        render();
      };

      // confirmCharge()가 남긴 ?charge_return=1 + localStorage의 pending 결제 정보를 읽어,
      // 모바일에서 카카오페이 REDIRECTION 결제가 끝나고 이 페이지로 돌아왔을 때를 감지한다.
      // 정확한 실패 시 쿼리 파라미터명은 PortOne 문서에 명시돼 있지 않아 code 유무로만
      // 성공/실패를 가른다 - 실제 기기 테스트 후 다르면 이 부분만 조정하면 된다.
      function applyPaymentRedirectResult() {
        const params = new URLSearchParams(window.location.search);
        if (!params.has('charge_return')) return false;
        history.replaceState(null, '', window.location.pathname + window.location.hash);

        let pending = null;
        try { pending = JSON.parse(localStorage.getItem('keongyu_pending_charge') || 'null'); } catch (e) {}
        if (!pending) return false;

        const code = params.get('code');
        if (code) {
          try { localStorage.removeItem('keongyu_pending_charge'); } catch (e) {}
          showToast(params.get('message') || '결제가 취소됐어요.');
          return false;
        }

        finishCharge(params.get('paymentId') || pending.paymentId);
        return false;
      }

      // 미션 기반 무료 언락: 특정 조건 달성 시 지정된 아이템을 무료로 지급
      const MISSION_DEFS = [
        { id: 'invite15', category: 'theme', key: 'peach', label: '친구 15명 초대', current: () => state.user.invites, target: 15 },
        { id: 'complete3', category: 'avatar', key: 'fox', label: '루트 3회 완주', current: () => state.user.completedRoutes.length, target: 3 }
      ];

      function getMissionForItem(category, key) {
        return MISSION_DEFS.find(m => m.category === category && m.key === key) || null;
      }

      window.claimMissionItem = function(category, key) {
        const mission = getMissionForItem(category, key);
        if (!mission || mission.current() < mission.target) return;
        if (state.custom.owned[category].includes(key)) return;
        state.custom.owned[category].push(key);
        state.custom.equipped[category] = key;
        saveState();
        showToast(`🎁 미션 달성! ${mission.label} 보상을 받았어요.`);
        render();
        syncProfileToServer();
      };

      // 주간 챌린지: 오늘 인증 버튼 + 3/3 달성 시 랜덤 스티커 보상
      window.todayChallengeCheck = function() {
        const today = new Date().toDateString();
        if (state.challenge.todayCheck === today) {
          showToast('오늘은 이미 인증했어요! 내일 다시 와주세요.');
          return;
        }
        state.challenge.todayCheck = today;
        state.challenge.progress = Math.min(3, state.challenge.progress + 1);
        saveState();
        showToast('오늘 인증 완료! +1');
        render();
        syncProfileToServer();
      };

      window.claimChallengeReward = function() {
        if (state.challenge.progress < 3 || state.challenge.completed) return;
        const unowned = Object.keys(STICKER_MAP).filter(k => !state.custom.owned.sticker.includes(k));
        const pick = (unowned.length ? unowned : Object.keys(STICKER_MAP))[Math.floor(Math.random() * (unowned.length ? unowned.length : Object.keys(STICKER_MAP).length))];
        if (!state.custom.owned.sticker.includes(pick)) state.custom.owned.sticker.push(pick);
        state.challenge.completed = true;
        saveState();
        showToast(`🎁 랜덤 스티커 ${STICKER_MAP[pick]} 획득!`);
        render();
        syncProfileToServer();
      };

      // ==========================================
      // 4b. Collaborative Planning (함께가기)
      // ==========================================
      window.openCollabSheet = function(routeId) {
        state.ui.collabSheet = { routeId };
        render();
      };

      // Participant shape: {id, name, avatar, role: 'editor'|'viewer', isMe, isOnline, joinedAt}
      function makeParticipant(name, isMe) {
        return {
          id: isMe ? 'p_me' : 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name,
          avatar: getAvatarDisplay(name),
          role: 'editor',
          isMe: !!isMe,
          isOnline: true,
          joinedAt: Date.now()
        };
      }

      // A viewer can follow along and GPS check-in but cannot edit/add/delete steps.
      function canEdit(routeId) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route || !route.isCollaborative) return true;
        const me = (route.participants || []).find(p => p.name === state.user.name);
        return !me || me.role !== 'viewer';
      }

      window.addParticipant = function(routeId, name) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        if (!route.participants || route.participants.length === 0) {
          route.participants = [makeParticipant(state.user.name, true)];
        }
        if (route.participants.some(p => p.name === name)) return;
        route.participants.push(makeParticipant(name, false));
        route.isCollaborative = true;
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: name, avatar: getAvatarDisplay(name), action: '참여했어요', time: '방금' });
        saveState();
        render();
      };

      window.removeParticipant = function(routeId, name) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route || !route.participants) return;
        route.participants = route.participants.filter(p => p.name !== name);
        saveState();
        showToast(`${name}님을 내보냈습니다.`);
        render();
      };

      window.toggleParticipantRole = function(routeId, name) {
        const route = state.routes.find(r => r.id === routeId);
        const p = route && (route.participants || []).find(p => p.name === name);
        if (!p) return;
        p.role = p.role === 'viewer' ? 'editor' : 'viewer';
        saveState();
        showToast(`${name}님을 ${p.role === 'viewer' ? '뷰어' : '편집자'}로 변경했어요`);
        render();
      };

      window.generateCollabInvite = function(routeId) {
        const input = document.getElementById('collab-invite-name');
        const name = (input && input.value.trim()) || '친구';
        if (containsBannedWord(name)) {
          showToast('부적절한 단어는 사용할 수 없어요.');
          return;
        }
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        const code = Math.random().toString(36).slice(2, 6);
        if (!route.pendingInvites) route.pendingInvites = [];
        route.pendingInvites.push({ code, name, createdAt: Date.now() });
        const link = `${SITE_BASE}?join=${routeId}&code=${code}`;
        copyText(link, '초대 링크 복사됨! 👥', 8);
        if (input) input.value = '';
        // Demo simulation: friend "joins" a couple seconds after the invite link is copied.
        setTimeout(() => addParticipant(routeId, name), 2000);
      };

      // 카카오톡 친구 선택 → 선택된 친구를 함께가기 참여자로 바로 추가.
      // Kakao.Picker.selectFriends()는 이 페이지의 Kakao SDK 인스턴스가 access token을 직접 갖고
      // 있어야 동작한다 - applyKakaoAccessToken()/restoreKakaoAccessTokenIfValid()가 로그인 시점과
      // 페이지 로드 시점에 그걸 채워준다(둘 다 실패했던 게 "이용 중인 서비스로 돌아가서 재인증 후
      // 시도해주세요" 버그의 원인이었다). 여기서는 그 토큰이 실제로 세팅됐는지 먼저 확인해서, SDK가
      // 던지는 뜻 모를 에러 대신 뭘 해야 하는지 바로 알려준다.
      window.inviteFriendsWithKakao = function(routeId) {
        if (!window.Kakao || !Kakao.isInitialized()) {
          showToast('카카오 SDK가 초기화되지 않았어요.');
          return;
        }
        if (!Kakao.Picker || typeof Kakao.Picker.selectFriends !== 'function') {
          showToast('이 환경에서는 카카오톡 친구 선택을 사용할 수 없어요.');
          return;
        }
        const hasToken = Kakao.Auth && typeof Kakao.Auth.getAccessToken === 'function' && !!Kakao.Auth.getAccessToken();
        if (!hasToken) {
          showToast(
            state.user.provider === 'kakao'
              ? '카카오 로그인이 만료됐어요. 다시 로그인할게요...'
              : '카카오톡 친구 초대는 카카오 로그인이 필요해요. 로그인 화면으로 이동할게요...'
          );
          setTimeout(loginWithKakao, 1200);
          return;
        }
        Kakao.Picker.selectFriends({ title: '함께 갈 친구 선택', maxPickableCount: 5 })
          .then(res => {
            const friends = (res && res.users) || [];
            if (!friends.length) return;
            friends.forEach(f => addParticipant(routeId, f.displayName || f.nickname || '카카오친구'));
            showToast(`${friends.length}명을 초대했어요! 👥`);
          })
          .catch(() => {
            // 토큰은 있는데도 Picker가 "이용 중인 서비스로 돌아가서 재인증 후 시도해주세요"류 오류를
            // 던지는 가장 흔한 원인은 로그인 당시 "카카오톡 친구 목록" 동의항목(선택 동의)에 실제로는
            // 동의하지 않은 케이스 - 토큰 자체는 유효해도 friends 스코프가 빠져 있어 Picker 내부 인증이
            // 실패한다. 저장해둔 토큰을 지우고 authorize()를 다시 태우면 카카오가 이미 발급된 항목은
            // 건너뛰고 friends처럼 아직 동의 안 한 항목만 다시 동의창에 띄워준다("추가 동의").
            state.user.kakaoAccessToken = null;
            state.user.kakaoAccessTokenExpiresAt = null;
            saveState();
            showToast('카카오톡 친구 목록 접근 동의가 필요해요. 동의 화면으로 이동할게요...');
            setTimeout(loginWithKakao, 1200);
          });
      };

      window.startCollab = function(routeId) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        if (!route.participants || route.participants.length === 0) {
          route.participants = [makeParticipant(state.user.name, true)];
        }
        route.isCollaborative = true;
        state.ui.tab = 'myRoutes';
        state.ui.collabSheet = null;
        saveState();
        showToast('함께가기 계획이 시작됐어요!');
        render();
      };

      window.updateStep = function(routeId, stepIdx, newData) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        route.steps[stepIdx] = { ...route.steps[stepIdx], ...newData };
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: state.user.name, avatar: getAvatarDisplay(state.user.name), action: `수정: ${newData.name}`, time: '방금' });
        saveState();
        render();
        showToast('수정됐어요 ✏️');
        syncStepsToServer(route, `수정: ${newData.name}`);
      };

      window.deleteStep = function(routeId, stepIdx) {
        if (!canEdit(routeId)) {
          showToast('뷰어는 수정할 수 없어요 👀');
          return;
        }
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        if (route.steps.length <= 1) {
          showToast('최소 한 개의 스텝은 남아있어야 해요.');
          return;
        }
        if (!confirm('이 스텝을 삭제할까요?')) return;
        const removed = route.steps.splice(stepIdx, 1)[0];
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: state.user.name, avatar: getAvatarDisplay(state.user.name), action: `삭제: ${removed.name}`, time: '방금' });
        saveState();
        render();
        showToast('스텝이 삭제됐어요 🗑️');
        syncStepsToServer(route, `삭제: ${removed.name}`);
      };

      window.addStep = function(routeId, afterIdx, newStep) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        route.steps.splice(afterIdx + 1, 0, newStep);
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: state.user.name, avatar: getAvatarDisplay(state.user.name), action: `추가: ${newStep.name}`, time: '방금' });
        saveState();
        render();
        syncStepsToServer(route, `추가: ${newStep.name}`);
      };

      window.openCollabEditSheet = function(routeId, stepIndex) {
        if (!canEdit(routeId)) {
          showToast('뷰어는 수정할 수 없어요 👀');
          return;
        }
        state.ui.collabEditSheet = { routeId, stepIndex, mode: 'edit' };
        render();
      };

      window.openAddStepSheet = function(routeId, afterIdx) {
        if (!canEdit(routeId)) {
          showToast('뷰어는 수정할 수 없어요 👀');
          return;
        }
        state.ui.collabEditSheet = { routeId, stepIndex: null, mode: 'add', afterIdx };
        render();
      };

      window.saveStepForm = function() {
        const sheet = state.ui.collabEditSheet;
        if (!sheet) return;
        if (!canEdit(sheet.routeId)) {
          showToast('뷰어는 수정할 수 없어요 👀');
          state.ui.collabEditSheet = null;
          render();
          return;
        }
        const name = document.getElementById('step-form-name')?.value.trim();
        const address = document.getElementById('step-form-address')?.value.trim();
        const memo = document.getElementById('step-form-memo')?.value.trim();
        if (!name) {
          showToast('장소명을 입력해주세요.');
          return;
        }
        if (containsBannedWord(name) || containsBannedWord(address) || containsBannedWord(memo)) {
          showToast('부적절한 단어는 사용할 수 없어요.');
          return;
        }
        if (sheet.mode === 'add') {
          addStep(sheet.routeId, sheet.afterIdx, { type: '경유', name, address: address || '', cost: '0원', memo: memo || '' });
        } else {
          updateStep(sheet.routeId, sheet.stepIndex, { name, address: address || '', memo: memo || '' });
        }
        state.ui.collabEditSheet = null;
        saveState();
        render();
      };

      window.shareCollabLink = function(routeId) {
        const link = `${SITE_BASE}?join=${routeId}`;
        copyText(link, '함께가기 참여 링크가 복사되었습니다! 👥', 8);
      };

      // ==========================================
      // 5. Render Engine (Preserving Input UX)
      // ==========================================
      function render() {
        // 0. IME(한글 등) 조합 중에는 절대 DOM을 재구성하지 않습니다. search-input 자신의
        // oninput 핸들러(onSearchInput)에는 이미 이 가드가 있었지만, 그건 "검색창 스스로가
        // render()를 유발하는 경우"만 막습니다 — 5초 후 알림 시뮬레이션, 함께가기 참여자
        // 시뮬레이션(setTimeout) 등 검색창과 무관한 다른 코드가 조합 도중 render()를 호출하면
        // #root 전체가 다시 그려지며 조합 세션이 끊깁니다(개별 자모가 합성되지 않고 그대로
        // 찍히는 증상). 그래서 트리거 지점이 아니라 render() 자체에 전역 가드를 둡니다.
        // 조합이 끝나면 onSearchCompositionEnd가 다시 render()를 호출해 최신 상태를 반영합니다.
        const composingEl = document.activeElement;
        if (composingEl && composingEl.dataset && composingEl.dataset.composing === 'true') return;

        // 1. Preserve active input focus & selection
        const activeEl = document.activeElement;
        const activeId = activeEl ? activeEl.id : null;
        const selStart = activeEl && ('selectionStart' in activeEl) ? activeEl.selectionStart : null;
        const selEnd = activeEl && ('selectionEnd' in activeEl) ? activeEl.selectionEnd : null;

        // 1b. Preserve scroll position of the open sheet/overlay's scrollable regions.
        // root.innerHTML replacement below always recreates the DOM, which silently resets
        // scrollTop (and, for horizontally-scrolling rows like .skin-part-tabs, scrollLeft) to 0 on
        // every one of them - felt as the screen "jumping" back up/left on every icon tap/toggle
        // inside a sheet, or (the "꾸미기" 프레임/스티커 tabs bug) the part-tab row snapping back to
        // its start every time a tab off to the right was tapped. Captured/restored in DOM order,
        // which stays stable across a render() since the same state produces the same conditional
        // structure.
        const SCROLL_PRESERVE_SELECTOR = '.bottom-sheet, .route-timeline-scroll, .notif-list-scroll, .chat-message-list, .skin-part-tabs, .filter-scroll';
        const savedScrollPositions = Array.from(document.querySelectorAll(SCROLL_PRESERVE_SELECTOR)).map(el => ({ top: el.scrollTop, left: el.scrollLeft }));

        // 2. Set theme color
        const themeColor = THEME_MAP[state.custom.equipped.theme] || '#8B6CFF';
        document.documentElement.style.setProperty('--primary', themeColor);

        // 2b. Lock background scroll while a sheet/overlay covers the screen
        // (prevents the page behind a bottom sheet from rubber-banding on mobile).
        const anyOverlayOpen = !!(state.ui.bottomSheet || state.ui.collabSheet || state.ui.collabEditSheet || state.ui.stopEditor || state.ui.followRouteId || state.ui.loginSheet || state.ui.profileSheet || state.ui.helpSheet || state.ui.photoLightbox || state.ui.chatSheet || state.ui.giftSheet);
        // overflow:hidden on body alone doesn't stop <html> from scrolling - lock both.
        document.body.style.overflow = anyOverlayOpen ? 'hidden' : '';
        document.documentElement.style.overflow = anyOverlayOpen ? 'hidden' : '';

        // 2c. Only replay .bottom-sheet's slideUp entrance animation when a *different* sheet just
        // opened. Every click inside an already-open sheet also calls render(), which tears down
        // and recreates the same .bottom-sheet element (full innerHTML replace) - without this,
        // that replays the entrance animation every time, looking like the whole sheet drops and
        // slides back up on every tap (reported for the 충전소 sheet, but it's every sheet).
        const currentSheetKey = state.ui.stopEditor ? 'stopEditor' : state.ui.profileSheet ? 'profileSheet' : state.ui.helpSheet ? 'helpSheet' : state.ui.bottomSheet || null;
        const sheetJustOpened = currentSheetKey !== _lastOpenSheetKey;
        _lastOpenSheetKey = currentSheetKey;
        const bottomSheetClass = sheetJustOpened ? 'bottom-sheet' : 'bottom-sheet no-anim';

        // 2d. Mobile back-button: fake one layer of history for "something is open" so the
        // hardware/gesture back button closes the topmost sheet/overlay instead of leaving the
        // app. No real router here, so this pushes one history entry the first time an overlay
        // opens and consumes it (history.back()) if the app itself closes the overlay without the
        // back button being pressed - keeps our flag and the actual history stack in sync either
        // way. The corresponding popstate handler is registered once, below.
        // The pushed URL must actually change (the '#o' suffix) rather than repeating the current
        // URL - some in-app/WebView back stacks (Kakao's in-app browser included) only recognize a
        // pushState entry as real, back-button-interceptable history when the URL differs from the
        // previous entry. With an unchanged URL the entry can be silently skipped by the hardware
        // back button, which fell straight through to exiting the app from a page like the route
        // detail overlay instead of firing our popstate handler below.
        if (anyOverlayOpen && !_overlayHistoryPushed) {
          history.pushState({ keongyuOverlay: true }, '', '#o');
          _overlayHistoryPushed = true;
        } else if (!anyOverlayOpen && _overlayHistoryPushed) {
          _overlayHistoryPushed = false;
          history.back();
        }

        // 3. Count unread notifications
        const unreadCount = state.notifications.filter(n => !n.read).length;

        // User Tier
        const myTier = getCreatorTier(state.user.name);

        const root = document.getElementById('root');
        if (!root) return;

        let html = '';

        // Header
        html += `
          <header>
            <div class="logo-box" onclick="handleLogoTap()">
              <span>KEONGYU</span>
              <span style="font-size:12px; color:var(--text-sub); font-weight:700;">경유</span>
            </div>
            <div class="header-right">
              ${state.user.isLoggedIn ? `
                <div class="point-chip" onclick="openProfileSheet()">
                  <span>⭐</span>
                  <span>${state.user.points}</span>
                </div>
                <div class="icon-btn" onclick="openNotifInbox()">
                  <span>🔔</span>
                  ${unreadCount > 0 ? `<div class="badge-dot">${unreadCount}</div>` : ''}
                </div>
                <div class="avatar-wrapper" onclick="openProfileSheet()" style="border:${myTier.border}; cursor:pointer; width:34px; height:34px;">
                  <span>${AVATAR_MAP[state.custom.equipped.avatar] || '🐻'}</span>
                  <span class="sticker-badge">${STICKER_MAP[state.custom.equipped.sticker] || '❤️'}</span>
                </div>
              ` : `
                <div class="icon-btn" onclick="openNotifInbox()">
                  <span>🔔</span>
                  ${unreadCount > 0 ? `<div class="badge-dot">${unreadCount}</div>` : ''}
                </div>
                <button class="cta-btn" style="padding:6px 12px; font-size:12px;" onclick="openLoginSheet('initial')">로그인</button>
              `}
              <button class="upload-btn" onclick="openUploadSheet()">
                <span>+</span><span>업로드</span>
              </button>
            </div>
          </header>
        `;

        // Main Body by Tab
        html += `<main class="content-area">`;

        if (state.ui.tab === 'explore') {
          // 1. Growth Banner
          html += `
            <div class="banner" onclick="setTab('growth')">
              <div>
                <div style="font-size:14px; font-weight:800;">친구 초대하면 스티커 3종 🎁</div>
                <div style="font-size:11px; opacity:0.9; margin-top:2px;">링크 공유하고 별사탕과 한정 스티커 받기</div>
              </div>
              <div style="font-size:18px;">➔</div>
            </div>
          `;

          // 2. Search Box
          const hasActiveFilter = !!state.filter.query || state.filter.purpose !== '전체' || state.filter.nearby;
          html += `
            <div class="search-box">
              <span class="icon">🔍</span>
              <input type="text" id="search-input" placeholder="스팟, 카페, 목적, 태그 검색..." value="${esc(state.filter.query)}" oninput="onSearchInput(event)" />
              ${state.filter.query ? `<span class="clear-btn" onclick="clearSearchQuery()">✕</span>` : ''}
            </div>
          `;

          // 3. Filter Scroll
          const purposes = ['⭐ 구독', '전체', '감성카페', '힐링·산책', '데이트', '작업·몰입', '야경·드라이브', '가성비'];
          html += `<div class="filter-scroll">`;
          if (hasActiveFilter) {
            html += `<div class="filter-reset-chip" onclick="resetFilters()">↺ 초기화</div>`;
          }
          purposes.forEach(p => {
            const isSub = p === '⭐ 구독';
            const isActive = state.filter.purpose === p;
            html += `
              <div class="filter-chip ${isSub ? 'sub-chip' : ''} ${isActive ? 'active' : ''}" onclick="setPurposeFilter('${p}')">
                ${p}
              </div>
            `;
            if (p === '전체') {
              html += `
                <div class="filter-chip sub-chip ${state.filter.nearby ? 'active' : ''}" onclick="toggleNearbyFilter()">
                  ${state.ui.nearbyLoading ? '⏳ 위치 확인 중' : '📍 근처'}
                </div>
                <div class="filter-chip sub-chip ${state.filter.purpose === '헤어샵' ? 'active' : ''}" onclick="setPurposeFilter('헤어샵')">
                  💇 헤어샵
                </div>
              `;
            }
          });
          html += `</div>`;

          // 4. Routes List Filtering
          let filtered = state.routes.filter(r => {
            if (state.filter.purpose === '⭐ 구독') {
              if (!state.subscriptions[r.creator]?.subscribed) return false;
            } else if (state.filter.purpose !== '전체') {
              if (r.purpose !== state.filter.purpose) return false;
            }
            if (state.filter.query) {
              const q = state.filter.query.toLowerCase();
              const matchTitle = r.title.toLowerCase().includes(q);
              const matchCreator = r.creator.toLowerCase().includes(q);
              const matchTags = (r.tags || []).some(t => t.toLowerCase().includes(q));
              const matchSteps = (r.steps || []).some(s => s.name.toLowerCase().includes(q) || s.memo.toLowerCase().includes(q));
              if (!matchTitle && !matchCreator && !matchTags && !matchSteps) return false;
            }
            return true;
          });

          // "근처": sort by distance from the user's current GPS to each route's nearest
          // GPS-tagged step, closest first. Routes with no GPS-tagged steps sort to the end
          // rather than being filtered out entirely.
          if (state.filter.nearby && state.filter.nearbyGps) {
            filtered = filtered
              .map(r => ({ r, d: routeNearestDistanceKm(r, state.filter.nearbyGps) }))
              .sort((a, b) => a.d - b.d)
              .map(x => x.r);
          }

          if (filtered.length === 0) {
            html += `
              <div style="text-align:center; padding:50px 20px; color:var(--text-sub); background:#FFF; border-radius:18px; border:1px solid var(--border);">
                <div style="font-size:36px; margin-bottom:10px;">🍃</div>
                <div style="font-weight:800; font-size:15px; margin-bottom:6px;">조건에 맞는 루트가 없어요</div>
                <div style="font-size:12px; margin-bottom:14px;">${state.filter.purpose === '⭐ 구독' ? '크리에이터를 구독하면 새 루트가 피드에 나타나요!' : '검색어를 변경하거나 필터를 초기화해보세요.'}</div>
                <button class="cta-btn" onclick="resetFilters()">전체 루트 보기</button>
              </div>
            `;
          } else {
            filtered.forEach(r => {
              const tier = getCreatorTier(r.creator);
              const isSub = !!state.subscriptions[r.creator]?.subscribed;
              const notifType = state.subscriptions[r.creator]?.notif || 'all';

          html += `

                          <!-- GPS Check-in for this step -->
                          <div style="margin-top:8px; display:flex; flex-direction:column; gap:6px;">
                            ${participants.map(p => {
                              const pKey = route.id + '_' + idx + '_' + p.name;
                              const pChecked = !!state.user.followCheckins[pKey];
                              const isMe = p.name === state.user.name;
                              if (!route.isCollaborative && !isMe) return '';
                              const isCheckingLocation = isMe && state.ui.checkinGpsLoading === pKey;
                              return `
                                <button class="cta-btn" style="padding:9px; font-size:12px; background:${pChecked ? '#2DD4A0' : (isMe ? 'var(--primary)' : '#EEE')}; color:${pChecked ? '#FFF' : (isMe ? '#FFF' : 'var(--text)')}; opacity:${isCheckingLocation ? '0.6' : '1'};" ${isCheckingLocation ? 'disabled' : ''} data-route-id="${esc(route.id)}" data-step="${idx}" data-name="${esc(p.name)}" onclick="${isMe ? 'gpsCheckInStep(this.dataset.routeId, Number(this.dataset.step))' : 'verifyParticipantGPS(this.dataset.routeId, Number(this.dataset.step), this.dataset.name)'}">
                                  ${isCheckingLocation ? '📍 위치 확인 중...' : `${getAvatarDisplay(p.name)} ${isMe ? '나' : esc(p.name)} 인증 ${pChecked ? (isMe ? '✅ 완료 (탭하여 취소)' : '✅') : (isMe ? '📍 (+5⭐)' : '⏳')}`}

                              `;
                            }).join('')}
                          </div>
                        </div>
                      </div>

                  </button>
                </div>
              </div>
            </div>

                  <button class="icon-btn" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); background:rgba(255,255,255,0.15); border:none; color:#FFF;" onclick="event.stopPropagation(); lightboxPhotoNav(-1)">‹</button>

                ${lbPhotos.length > 1 ? `

                    ${lbPhotos.map((_, i) => `<div style="width:${i === lbIdx ? '18px' : '6px'}; height:6px; border-radius:3px; background:${i === lbIdx ? '#FFF' : 'rgba(255,255,255,0.4)'}; transition:width 0.2s;"></div>`).join('')}

                ` : ''}
              </div>

        // A2b. 별사탕 선물하기 모달 (giftSheet)
        if (state.ui.giftSheet) {

        if (state.ui.bottomSheet === 'notifInbox') {
