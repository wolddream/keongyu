    <style>
      :root {
        --primary: #8B6CFF;
        --mint: #2DD4A0;
        --lavender: #8B6CFF;
        --peach: #FF8C4B;
        --pink: #FF6B8A;
        --yellow: #FFC61C;
        --blue: #5BA9FF;
        --bg: #F5F5F0;
        --card: #FFFFFF;
        --text: #191F28;
        --text-sub: #6B7684;
        --border: #E5E8EB;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      body {
        background-color: #E8E8E2;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        color: var(--text);
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      #app-frame {
        width: 100%;
        max-width: 440px;
        min-height: 100dvh;
        background: var(--bg);
        box-shadow: 0 0 30px rgba(0,0,0,0.08);
        position: relative;
        display: flex;
        flex-direction: column;
        padding-bottom: 74px;
      }
      header {
        position: sticky; top: 0; z-index: 40;
        background: rgba(245, 245, 240, 0.95);
        backdrop-filter: blur(8px);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(0,0,0,0.05);
      }
      .logo-box { font-weight: 900; font-size: 19px; letter-spacing: -0.5px; color: var(--primary); display: flex; align-items: center; gap: 4px; cursor: pointer; }
      .header-right { display: flex; align-items: center; gap: 8px; }
      .point-chip {
        background: #FFF; border: 1px solid var(--border); border-radius: 16px;
        padding: 4px 10px; font-size: 13px; font-weight: 700; color: #E68A00;
        display: flex; align-items: center; gap: 4px; cursor: pointer;
      }
      .icon-btn {
        background: #FFF; border: 1px solid var(--border); width: 34px; height: 34px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        position: relative; cursor: pointer; font-size: 16px;
      }
      .badge-dot {
        position: absolute; top: -2px; right: -2px; background: #FF4242; color: white;
        font-size: 10px; font-weight: 800; min-width: 16px; height: 16px;
        border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px;
      }
      .upload-btn {
        background: var(--primary); color: white; border: none; border-radius: 18px;
        padding: 6px 12px; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 3px; cursor: pointer;
      }
      nav.bottom-nav {
        position: fixed; bottom: 0; width: 100%; max-width: 440px; height: 64px;
        background: rgba(255,255,255,0.98); backdrop-filter: blur(10px);
        border-top: 1px solid var(--border); display: flex; z-index: 50;
      }
      .nav-item {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text-sub);
      }
      .nav-item.active { color: var(--primary); }
      .nav-item .icon { font-size: 18px; }

      /* Sub btn */
      .sub-btn {
        background: #111; color: white; border-radius: 20px; padding: 6px 14px;
        font-size: 12px; font-weight: bold; border: none; cursor: pointer;
      }
      .sub-btn.subscribed { background: #EEE; color: #666; }

      /* Cards & Lists */
      .content-area { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
      .banner {
        background: linear-gradient(135deg, #FF6B8A, #FF8C4B);
        border-radius: 16px; padding: 14px 16px; color: white; cursor: pointer;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 4px 12px rgba(255,107,138,0.25);
      }
      .search-box {
        position: relative; width: 100%;
      }
      .search-box input {
        width: 100%; background: #FFF; border: 1.5px solid var(--border); border-radius: 14px;
        padding: 12px 34px 12px 38px; font-size: 14px; font-weight: 500; outline: none; transition: border-color 0.2s;
      }
      .search-box input:focus { border-color: var(--primary); }
      .search-box .icon { position: absolute; left: 12px; top: 12px; font-size: 16px; color: #999; }
      .search-box .clear-btn {
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        width: 22px; height: 22px; border-radius: 50%; background: #EEE; color: #777;
        display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer;
      }
      .filter-reset-chip {
        display: flex; align-items: center; gap: 3px; flex-shrink: 0; white-space: nowrap;
        padding: 6px 12px; border-radius: 14px; font-size: 12px; font-weight: 700;
        background: #FFF0F3; color: var(--primary); border: 1px solid var(--primary); cursor: pointer;
      }

      .filter-scroll {
        display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
      }
      .filter-scroll::-webkit-scrollbar { display: none; }
      .filter-chip {
        white-space: nowrap; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
        background: #FFF; border: 1px solid var(--border); cursor: pointer; color: var(--text-sub);
      }
      .filter-chip.active { background: var(--text); color: #FFF; border-color: var(--text); }
      .filter-chip.sub-chip.active { background: var(--primary); color: #FFF; border-color: var(--primary); }

      .route-card {
        background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--border);
        box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 10px;
      }
      /* 루트카드 스킨(별사탕 꾸미기) - card_bg/frame/filter_aura는 인라인 style로 바로 얹고,
         sticker/weather_effect만 이 두 클래스로 카드 안에 절대배치된다. */
      .route-skin-badge { font-size: 13px; line-height: 1; }
      .route-skin-sticker { position: absolute; top: 8px; right: 8px; font-size: 22px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15)); pointer-events: none; }
      .route-skin-weather { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
      .route-skin-weather span { position: absolute; top: -10%; font-size: 16px; animation: route-skin-fall linear infinite; opacity: 0.85; }
      @keyframes route-skin-fall { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(340px) rotate(25deg); } }
      .route-skin-holo-filter { animation: route-skin-holo 4s linear infinite; }
      @keyframes route-skin-holo { 0% { filter: saturate(1.6) hue-rotate(0deg); } 100% { filter: saturate(1.6) hue-rotate(360deg); } }

      /* 별사탕 선물하기 - 금색 별이 반짝이며 날아가는 1회성 연출 (playGiftFlyAnimation) */
      .gift-star-fly {
        position: fixed; left: 50%; bottom: 110px; font-size: 32px; z-index: 250;
        transform: translateX(-50%); pointer-events: none;
        filter: drop-shadow(0 0 8px #FFD700);
        animation: gift-star-fly 1.2s ease-out forwards;
      }
      @keyframes gift-star-fly {
        0% { transform: translateX(-50%) translateY(0) scale(1) rotate(0deg); opacity: 1; }
        60% { transform: translateX(-50%) translateY(-260px) scale(1.3) rotate(200deg); opacity: 1; }
        100% { transform: translateX(-50%) translateY(-440px) scale(0.4) rotate(360deg); opacity: 0; }
      }
      .gift-amount-chip { padding: 8px 14px; border-radius: 14px; border: 2px solid #EEE; background: #FFF; font-weight: 800; font-size: 13px; cursor: pointer; }
      .gift-amount-chip.selected { border-color: #FFD700; background: linear-gradient(135deg,#FFF3C4,#FFE8A3); box-shadow: 0 0 10px rgba(255,215,0,0.5); }
      .gift-msg-chip { padding: 9px 10px; border-radius: 12px; border: 1px solid var(--border); background: #FFF; font-size: 12px; font-weight: 700; cursor: pointer; margin-bottom: 6px; }
      .gift-msg-chip.selected { border-color: #FFD700; background: rgba(255,215,0,0.12); }
      .card-top { display: flex; justify-content: space-between; align-items: center; }
      .purpose-pill {
        background: #F0F4FF; color: var(--primary); font-size: 11px; font-weight: 800;
        padding: 4px 8px; border-radius: 8px;
      }
      .like-btn {
        background: none; border: none; font-size: 13px; font-weight: 700; color: #FF4B6E;
        display: flex; align-items: center; gap: 4px; cursor: pointer;
      }
      .like-btn.liked { opacity: 0.55; cursor: default; }
      .card-title { font-size: 16px; font-weight: 800; line-height: 1.35; }
      .card-pills { display: flex; gap: 6px; flex-wrap: wrap; }
      .info-pill {
        background: #F5F5F0; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; color: var(--text-sub);
      }
      .card-img {
        width: 100%; height: 140px; border-radius: 12px; object-fit: cover; background: #EFEFEF;
      }
      .card-bottom {
        display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px solid #F0F0EE;
      }
      .creator-info { display: flex; align-items: center; gap: 6px; }
      .avatar-wrapper {
        position: relative; width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 18px; background: #FFF;
      }
      .sticker-badge {
        position: absolute; bottom: -3px; right: -3px; font-size: 11px;
      }
      .ribbon-tag { font-size: 10px; margin-left: 2px; }
      .card-actions { display: flex; align-items: center; gap: 6px; }
      .cta-btn {
        background: var(--primary); color: white; border: none; border-radius: 20px;
        padding: 7px 14px; font-size: 12px; font-weight: 800; cursor: pointer;
      }

      /* Sheets & Overlays */
      .sheet-backdrop {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
        z-index: 100; display: flex; justify-content: center; align-items: flex-end;
      }
      .bottom-sheet {
        width: 100%; max-width: 440px; background: #FFF; border-radius: 24px 24px 0 0;
        padding: 20px; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px;
        animation: slideUp 0.25s ease-out;
      }
      .bottom-sheet.no-anim { animation: none; }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .fullscreen-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg);
        z-index: 90; display: flex; justify-content: center;
      }
      .overlay-inner {
        width: 100%; max-width: 440px; height: 100dvh; display: flex; flex-direction: column; background: var(--bg);
      }
      .photo-lightbox {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.92);
        z-index: 300; display: flex; align-items: center; justify-content: center;
        touch-action: none; /* let our own pointer handlers own horizontal swipes, not the browser */
      }
      .chat-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg);
        z-index: 150; display: flex; justify-content: center;
      }
      .toast-box {
        position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
        background: rgba(25, 31, 40, 0.92); color: white; padding: 10px 18px;
        border-radius: 24px; font-size: 13px; font-weight: 700; z-index: 200;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2); pointer-events: none;
        transition: opacity 0.25s, transform 0.25s; opacity: 0;
      }
      .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
      .theme-flash {
        position: fixed; top:0; left:0; right:0; bottom:0; background: var(--primary);
        opacity: 0.15; z-index: 999; pointer-events: none; animation: flashOut 0.4s ease-out forwards;
      }
      @keyframes flashOut { from { opacity: 0.25; } to { opacity: 0; } }
      @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

      /* Radio item */
      .radio-item {
        display: flex; align-items: center; justify-content: space-between; padding: 12px;
        border: 1px solid var(--border); border-radius: 14px; cursor: pointer; margin-bottom: 8px;
      }
      .radio-item.selected { border-color: var(--primary); background: rgba(139, 108, 255, 0.05); }

      /* Grid 2x2 */
      .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .grid-card {
        background: #F8F8F6; border: 1px solid var(--border); border-radius: 16px;
        padding: 16px; display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: 6px; cursor: pointer; position: relative;
      }
      .grid-card:hover { border-color: var(--primary); background: #FFF; }
      .rec-badge {
        position: absolute; top: -6px; right: -6px; background: #FF4242; color: white;
        font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 8px;
      }

      /* Collaborative planning (함께가기) */
      .btn-secondary {
        background: #111; color: white; border: none; border-radius: 20px;
        padding: 8px 14px; font-size: 12px; font-weight: bold; cursor: pointer;
      }
      .collab-pill {
        background: var(--mint); color: white; font-size: 11px; padding: 4px 8px;
        border-radius: 12px; font-weight: bold; white-space: nowrap;
      }
      .participants-stack { display: flex; margin-left: 8px; }
      .participants-stack .avatar-wrapper { margin-left: -8px; border: 2px solid #FFF; }
      .edit-log-item {
        display: flex; align-items: center; gap: 8px; padding: 6px 0;
        font-size: 12px; border-bottom: 1px solid #F0F0F0;
      }
      .step-mini-actions { display: flex; gap: 6px; margin-top: 4px; }
      .step-mini-btn {
        background: #F5F5F0; color: var(--text-sub); border: none; border-radius: 10px;
        padding: 4px 8px; font-size: 11px; font-weight: 700; cursor: pointer;
      }

      /* Login system (익명 / 카카오 / 이메일 코드) */
      .login-main-btn {
        background: #FEE500; color: #191919; border: none; border-radius: 14px;
        padding: 14px; font-weight: 900; width: 100%; font-size: 15px;
        display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
      }
      .login-sub-btn {
        background: #fff; color: var(--text); border: 1px solid var(--border);
      }
      .provider-badge {
        display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 10px;
      }
      .provider-badge.kakao { background: #FEE500; color: #191919; }
      .provider-badge.email { background: #E6F0FF; color: #5BA9FF; }
      .provider-badge.anon { background: #F0F0F0; color: #888; }
    </style>

    <!-- Cloudflare Web Analytics (8️⃣ 배포 & 모니터링) -->
    <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "bb05efd24a8447c8ad7e441b94963742"}'></script>
    <!-- Cloudflare Turnstile 봇 방지(8️⃣ 배포 & 모니터링)는 사용자 요청으로 비활성화됨.
         재활성화 방법은 git log(showTurnstile/hideTurnstile 커밋) 참고. -->

  <body>
    <div id="app-frame">
      <!-- Dynamic render root -->
      <div id="root" style="display:contents;"></div>
    </div>

    <!-- Hidden global inputs required by spec -->
    <input type="file" id="global-file-input" style="display:none;" multiple accept="image/*" />

    <!-- Bottom Toast -->
    <div id="toast" class="toast-box"></div>

    <!-- 루트 따라가기 화면의 카카오맵 - #root 밖에 영구적으로 살아있다가 render()가 매번 새로
         그리는 #route-map-slot 안으로 옮겨져 들어간다 (ensureRouteMap() 참고). #root처럼 매
         상호작용마다 통째로 새로 만들어지는 요소 위에 지도를 직접 그리면 지도 인스턴스가 계속
         파괴/재생성돼야 하기 때문. -->
    <div id="route-map-host" style="display:none; width:100%; height:100%;"></div>

    <!-- 지도 크게 보기 - 슬롯을 추적하는 위 호스트와 달리 항상 헤더(54px) 아래~화면 끝을 채우는
         고정 위치라 세로 동기화가 필요 없다 (syncRouteMapPosition() 참고). -->
    <div id="route-map-fullscreen-host" style="display:none; position:fixed; top:54px; left:0; right:0; bottom:0; z-index:150; background:#EEE;"></div>

    <script>
      // ==========================================
      // -1. Kakao SDK Init (6️⃣ 인증 & 카카오)
      // ==========================================
      const KAKAO_JS_KEY = 'c9b3225b112c58a9bba266cfe150b50a';
      if (window.Kakao && !Kakao.isInitialized()) {
        Kakao.init(KAKAO_JS_KEY);
      }
      // 사용 예시 (친구 선택 → 함께가기 참여자로 추가):
      // Kakao.Picker.selectFriends({ title: '함께 갈 친구 선택', maxPickableCount: 5 })
      //   .then(friends => friends.users.forEach(f => addParticipant(routeId, f.displayName)));

      // ==========================================
      // -0.8 로그인 시스템 (익명 / 카카오 / 이메일 코드)
      // ==========================================
      // safeSave(): 로그인 관련 코드에서 쓰는 별칭. saveState()의 quota 초과 시
      // 이미지 정리(pruneLargeImages) 폴백 로직을 그대로 재사용합니다.
      function safeSave() { saveState(); }

      // TODO(D1 연동): fetch('/api/auth/kakao', {method:'POST', body:JSON.stringify({kakao_token})})
      //   -> {user_id, session_token} 반환받아 D1 users 테이블에 upsert.
      // TODO(보안): 지금은 세션이 localStorage(state.user)에만 있음. 프로덕션 전환 시
      //   session_token은 httpOnly 쿠키로 옮기고 localStorage에는 저장하지 않도록 변경 예정.

      // 로그인 전/후로 표시 이름이 바뀌어도(익명 '나' -> 카카오 닉네임 등) 이미 만든 루트가
      // 계속 "내 루트"로 인식되도록 creator 필드를 함께 이관합니다.
      function migrateCreatorName(oldName, newName) {
        if (!oldName || !newName || oldName === newName) return;
        state.routes.forEach(r => { if (r.creator === oldName) r.creator = newName; });
        // KNOWN LIMITATION: state.user.followCheckins keys embed the display name
        // (routeId_step_name), so GPS 체크인 기록은 이름이 바뀌면 과거 기록과 끊길 수 있음.
        // 근본 해결은 user.id 기반 식별로 앱 전체를 리팩터링하는 것 (별도 작업 필요).
      }

      function resetUserToAnon() {
        const oldName = state.user.name;
        Object.assign(state.user, {
          id: 'anon_' + Date.now(),
          name: '나',
          avatar: '🐻',
          email: null,
          provider: 'anon',
          isLoggedIn: false,
          kakaoLoggedIn: false,
          kakaoProfileImage: null,
          kakaoAccessToken: null,
          kakaoAccessTokenExpiresAt: null
          // points/invites/stickersEarned/completedRoutes/followCheckins는 의도적으로 보존
        });
        migrateCreatorName(oldName, state.user.name);
      }

      window.openLoginSheet = function(mode) {
        state.ui.loginSheet = { mode: mode || 'initial', email: '', codeSent: false, sentAt: 0, sending: false, verifying: false };
        state.ui.profileSheet = false;
        render();
      };

      window.openProfileSheet = function() {
        state.ui.profileSheet = true;
        render();
      };

      window.openHelpSheet = function() {
        state.ui.profileSheet = false;
        state.ui.helpSheet = true;
        render();
      };

      // Kakao 로그인: 카카오 JS SDK v2는 팝업 기반 Kakao.Auth.login()을 지원하지 않습니다
      // (실기기 테스트로 확인: "Kakao.Auth.login is not a function"). 대신 공식 플로우인
      // Kakao.Auth.authorize()로 전체 페이지를 카카오 로그인 화면으로 리다이렉트하고,
      // 로그인 후 keongyu-api의 /oauth/kakao/callback이 인가 코드를 액세스 토큰으로
      // 교환(REST API 키는 서버에만 존재)한 뒤 프로필을 URL 해시에 담아 이 페이지로 돌려보냅니다.
      // 콜백 처리는 아래 applyKakaoLoginResult() 참고.
      const KAKAO_OAUTH_REDIRECT_URI = 'https://keongyu-api.wolddream.workers.dev/oauth/kakao/callback';

      window.loginWithKakao = function() {
        if (window.Kakao && Kakao.Auth && typeof Kakao.Auth.authorize === 'function') {
          Kakao.Auth.authorize({
            redirectUri: KAKAO_OAUTH_REDIRECT_URI,
            // account_email은 뺐습니다 - Kakao Developers에서 해당 동의항목을 활성화하지 않으면
            // KOE205(잘못된 요청) 오류가 남. 콘솔에서 "카카오계정(이메일)" 동의항목을 켜면
            // 다시 scope에 추가해도 됩니다 (email은 어차피 옵셔널로 처리되어 있음).
            scope: 'friends,profile_nickname,profile_image',
            // Fixed SITE_BASE, not window.location.origin - if this round-trips wrong (or the
            // OAuth flow's `state` param gets dropped somewhere), keongyu-api's callback falls
            // back to a hardcoded workers.dev URL, and every share link built from that page load
            // then inherits that wrong domain (see SITE_BASE's own comment).
            state: encodeURIComponent(SITE_BASE)
          });
          // authorize()는 즉시 페이지를 이탈시키므로 이 함수는 여기서 끝. 로그인 결과 반영은
          // 카카오 -> keongyu-api -> 이 페이지(#kakao_login=...)로 돌아온 뒤 DOMContentLoaded에서 처리.
        } else {
          // 카카오 SDK 로드 실패 등 폴백: 데모용 이름 입력 시뮬레이션
          const name = prompt('카카오 로그인 시뮬 - 이름 입력') || '카카오유저';
          const oldName = state.user.name;
          migrateCreatorName(oldName, name);
          Object.assign(state.user, {
            id: 'kakao_' + Date.now(),
            name,
            avatar: hashNameToAvatar(name),
            provider: 'kakao',
            isLoggedIn: true,
            kakaoLoggedIn: true
          });
          closeSheet();
          safeSave();
          render();
          showToast(`환영해요, ${esc(name)}님! 👋`);
        }
      };

      // Kakao.Auth.authorize() 리다이렉트가 keongyu-api를 거쳐 이 페이지로 돌아올 때
      // URL 해시에 실려오는 #kakao_login=<base64> 결과를 파싱해 state.user에 반영합니다.
      // DOMContentLoaded에서 (로그인 시트 강제 노출 여부를 결정하기 전에) 호출됩니다.
      function applyKakaoLoginResult() {
        const m = /kakao_login=([^&]+)/.exec(window.location.hash);
        if (!m) return false;
        history.replaceState(null, '', window.location.pathname + window.location.search);
        try {
          const binary = atob(decodeURIComponent(m[1]));
          const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
          const payload = JSON.parse(new TextDecoder().decode(bytes));
          if (payload.error) {
            window.__lastKakaoError = payload; // 디버깅용: 브라우저 콘솔/자동화에서 window.__lastKakaoError로 조회
            console.error('[카카오 로그인 실패]', JSON.stringify(payload));
            showToast('카카오 로그인에 실패했어요. (' + payload.error + ')');
            return false;
          }
          const oldName = state.user.name;
          migrateCreatorName(oldName, payload.nickname);
          Object.assign(state.user, {
            id: 'kakao_' + payload.id,
            name: payload.nickname,
            avatar: hashNameToAvatar(payload.nickname),
            email: payload.email || null,
            provider: 'kakao',
            isLoggedIn: true,
            kakaoLoggedIn: true,
            kakaoProfileImage: payload.profileImage || null
          });
          applyKakaoAccessToken(payload.accessToken, payload.expiresIn);
          safeSave();
          showToast(`환영해요, ${esc(payload.nickname)}님! 👋`);
          return true;
        } catch (e) {
          showToast('카카오 로그인 처리 중 오류가 발생했어요.');
          return false;
        }
      }

      // Kakao.Picker.selectFriends() 같은 클라이언트 전용 API는 이 페이지의 Kakao SDK 인스턴스가
      // 직접 access token을 갖고 있어야 동작한다 - keongyu-api가 인가 코드를 토큰으로 교환하는
      // 서버-사이드 플로우에서는 그 토큰이 원래 서버에만 있어서, SDK가 세션이 없다고 보고
      // "이용 중인 서비스로 돌아가서 재인증 후 시도해주세요" 에러를 띄웠다(카카오 친구 초대 버그).
      // 로그인 콜백(#kakao_login=...)이 이제 access_token을 함께 실어 보내므로, 여기서 그걸 SDK에
      // 주입하고 만료 시각과 함께 저장해서 다음 방문 때도(만료 전이라면) 다시 로그인하지 않고 재사용한다.
      function applyKakaoAccessToken(token, expiresIn) {
        if (!token) return;
        state.user.kakaoAccessToken = token;
        state.user.kakaoAccessTokenExpiresAt = expiresIn ? Date.now() + expiresIn * 1000 : null;
        if (window.Kakao && Kakao.Auth && typeof Kakao.Auth.setAccessToken === 'function') {
          Kakao.Auth.setAccessToken(token);
        }
      }

      // DOMContentLoaded에서 매번 호출 - 이전 로그인에서 저장해둔 토큰이 아직 안 만료됐으면 SDK에
      // 다시 심어서, 방금 카카오 리다이렉트로 돌아온 게 아닌 평범한 재방문에서도 카카오톡 친구
      // 초대가 바로 동작하게 한다.
      function restoreKakaoAccessTokenIfValid() {
        const token = state.user.kakaoAccessToken;
        const expiresAt = state.user.kakaoAccessTokenExpiresAt;
        if (!token || !expiresAt || Date.now() >= expiresAt) return;
        if (window.Kakao && Kakao.Auth && typeof Kakao.Auth.setAccessToken === 'function') {
          Kakao.Auth.setAccessToken(token);
        }
      }

      window.setLoginEmail = function(e) {
        if (state.ui.loginSheet) state.ui.loginSheet.email = e.target.value;
      };

      // 실제 이메일 발송: keongyu-api가 6자리 코드를 생성해 D1에 저장하고 SMTP로 보낸다
      // (POST /api/auth/email/send). 코드 자체는 서버에만 있고 클라이언트로 내려오지 않는다.
      window.sendLoginCode = async function() {
        const sheet = state.ui.loginSheet;
        if (!sheet || sheet.sending) return;
        if (!sheet.email || !sheet.email.includes('@')) {
          showToast('올바른 이메일을 입력해주세요.');
          return;
        }
        if (sheet.sentAt && Date.now() - sheet.sentAt < 30000) {
          showToast('잠시 후 다시 시도해주세요. (30초 제한)');
          return;
        }
        sheet.sending = true;
        render();
        try {
          const res = await fetch(`${API_BASE}/api/auth/email/send`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: sheet.email }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            showToast(data.error || '이메일 발송에 실패했어요.');
            return;
          }
          sheet.codeSent = true;
          sheet.sentAt = Date.now();
          showToast(`${sheet.email}로 인증코드를 보냈어요! 📧`);
        } catch (err) {
          showToast('이메일 발송에 실패했어요. 네트워크를 확인해주세요.');
        } finally {
          sheet.sending = false;
          render();
        }
      };

      window.verifyLoginCode = async function() {
        const sheet = state.ui.loginSheet;
        if (!sheet || sheet.verifying) return;
        if (!sheet.codeSent) {
          showToast('먼저 인증코드를 발송해주세요.');
          return;
        }
        const inputCode = (document.getElementById('login-email-code') || {}).value || '';
        if (!inputCode.trim()) {
          showToast('인증코드를 입력해주세요.');
          return;
        }
        sheet.verifying = true;
        render();
        try {
          const res = await fetch(`${API_BASE}/api/auth/email/verify`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ email: sheet.email, code: inputCode.trim() }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            showToast(data.error || '인증코드가 일치하지 않아요.');
            return;
          }
          const email = sheet.email;
          const namePart = email.split('@')[0];
          const oldName = state.user.name;
          migrateCreatorName(oldName, namePart);
          Object.assign(state.user, {
            id: 'email_' + email,
            name: namePart,
            avatar: hashNameToAvatar(email),
            email,
            provider: 'email',
            isLoggedIn: true
          });
          closeSheet();
          safeSave();
          showToast(`환영해요, ${esc(namePart)}님! 👋`);
        } catch (err) {
          showToast('로그인 처리에 실패했어요. 네트워크를 확인해주세요.');
        } finally {
          sheet.verifying = false;
          render();
        }
      };

      window.continueAsAnon = function() {
        Object.assign(state.user, {
          id: 'anon_' + Date.now(),
          provider: 'anon',
          isLoggedIn: false
        });
        try { localStorage.setItem('keongyu_skip_login', '1'); } catch (e) {}
        closeSheet();
        safeSave();
        render();
        showToast('익명으로 둘러보는 중 👀');
      };

      window.logoutUser = function() {
        resetUserToAnon();
        state.ui.profileSheet = false;
        safeSave();
        render();
        showToast('로그아웃했어요.');
      };

      // Turnstile 봇 방지(8️⃣ 배포 & 모니터링)는 사용자 요청으로 중단했습니다.
      // 재활성화 시 필요한 것: <head>의 Turnstile <script> 주석 해제, showTurnstile()/
      // hideTurnstile() 구현 복원(git log에서 확인 가능), render()의 표시 로직 복원.

      // ==========================================
      // 0. Constants & Utilities
      // ==========================================
      const API_BASE = 'https://keongyu-api.wolddream.workers.dev';
      // Fixed, known-correct frontend origin for share/invite links. Deliberately NOT derived from
      // window.location - a user can end up on the wrong origin (e.g. workers.dev if the Kakao
      // OAuth redirect's `state` round-trip ever falls back to its default, or just from testing a
      // preview/deploy URL directly), and location-derived share links silently bake that wrong
      // domain into every link generated from that page load. Same reasoning as API_BASE being a
      // fixed constant rather than inferred.
      const SITE_BASE = 'https://keongyu.pages.dev';

      // PortOne V2 - Store ID/Channel Key는 결제창을 여는 데만 쓰이는 공개 식별자라 클라이언트에
      // 노출돼도 안전함 (실제 결제 검증은 Worker가 API Secret으로 서버 사이드에서 수행, keongyu-api/src/points.ts).
      const PORTONE_STORE_ID = 'store-7baaa782-32ab-4a91-8d98-37229cf118a5';
      const PORTONE_CHANNEL_KEY = 'channel-key-87f6d415-63de-43ba-b842-a5c04a2638ac';

      // Resolves a step/route photo to a displayable <img src>: server-stored photos come back as
      // bare R2 keys (e.g. "routes/r_x/step0/img_y"), locally-created-but-not-yet-synced ones are
      // still data: URLs. Both need to render the same way in the UI.
      function resolveImageUrl(value) {
        if (!value) return null;
        if (value.startsWith('data:') || value.startsWith('http')) return value;
        return `${API_BASE}/api/images/${value}`;
      }

      // Fire-and-forget sync to the Worker API: local state is already updated and rendered by the
      // time this is called (optimistic-update pattern used throughout this app), so a failure here
      // only means the change didn't reach the server yet - it stays visible locally either way.
      function apiSync(path, options) {
        return fetch(`${API_BASE}${path}`, options).catch((err) => {
          console.warn('[API sync failed]', path, err);
        });
      }

      function apiJson(path, method, body) {
        return apiSync(path, {
          method,
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
      }

      // Unlike apiJson/apiSync above (fire-and-forget optimistic updates), payment verification
      // needs the server's answer before crediting anything in the UI - the points figure has to
      // come back from the Worker (which checked the payment with PortOne), never be assumed locally.
      async function apiJsonAwait(path, method, body) {
        const res = await fetch(`${API_BASE}${path}`, {
          method,
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `요청 실패 (${res.status})`);
        return data;
      }

      // Maps a GET /api/routes row (see keongyu-api/src/routes.ts routeRowToClient) onto this
      // app's route shape. Deliberately not run through withCollabDefaults() - that helper always
      // forces isCollaborative back to false, which is right for a brand-new local route but wrong
      // for an existing server route that may already be collaborative.
      function mapServerRouteToClient(sr) {
        return {
          id: sr.id,
          title: sr.title,
          purpose: sr.purpose,
          tags: sr.tags || [],
          distance: sr.distance,
          time: sr.time,
          budget: sr.budget,
          likes: sr.likes,
          creator: sr.creator,
          creatorId: sr.creator_id,
          isPublic: sr.isPublic,
          isMine: sr.creator_id === state.user.id,
          image: sr.image,
          steps: sr.steps || [],
          skin: sr.skin || {},
          comments: [],
          isCollaborative: !!sr.isCollaborative,
          participants: [],
          pendingInvites: [],
          editLog: [],
          fromServer: true,
        };
      }

      // Pulls the shared server route list and merges it in front of whatever isn't server-backed
      // yet (the DEFAULT_ROUTES demo seed, plus any route created locally whose sync hasn't
      // succeeded). Re-running this replaces the previous server batch instead of accumulating
      // duplicates, so it's safe to call on every load.
      async function syncRoutesFromServer() {
        try {
          const res = await fetch(`${API_BASE}/api/routes`);
          if (!res.ok) return;
          const data = await res.json();
          const serverRoutes = (data.routes || []).map(mapServerRouteToClient);
          const localOnly = state.routes.filter((r) => !r.fromServer);
          state.routes = [...serverRoutes, ...localOnly];
          saveState();
          render();
        } catch (err) {
          console.warn('[routes sync failed]', err);
        }
      }

      async function syncNotificationsFromServer() {
        if (!state.user.isLoggedIn) return;
        try {
          const res = await fetch(`${API_BASE}/api/notifications?user_id=${encodeURIComponent(state.user.id)}`);
          if (!res.ok) return;
          const data = await res.json();
          state.notifications = (data.notifications || []).map((n) => ({
            id: n.id,
            creator: n.creator,
            title: n.title,
            body: n.body || null,
            routeId: n.route_id,
            time: n.created_at,
            read: !!n.read,
            type: n.type || 'new_route',
          }));
          saveState();
          render();
        } catch (err) {
          console.warn('[notifications sync failed]', err);
        }
      }

      async function syncSubscriptionsFromServer() {
        if (!state.user.isLoggedIn) return;
        try {
          const res = await fetch(`${API_BASE}/api/subscriptions?user_id=${encodeURIComponent(state.user.id)}`);
          if (!res.ok) return;
          const data = await res.json();
          state.subscriptions = data.subscriptions || {};
          saveState();
          render();
        } catch (err) {
          console.warn('[subscriptions sync failed]', err);
        }
      }

      async function syncProfileFromServer() {
        if (!state.user.isLoggedIn) return;
        try {
          const res = await fetch(`${API_BASE}/api/users/${encodeURIComponent(state.user.id)}`);
          if (!res.ok) return;
          const data = await res.json();
          const p = data.profile || {};
          if (typeof data.points === 'number') state.user.points = data.points;
          if (p.custom) state.custom = p.custom;
          if (p.challenge) state.challenge = p.challenge;
          if (typeof p.invites === 'number') state.user.invites = p.invites;
          if (typeof p.stickersEarned === 'number') state.user.stickersEarned = p.stickersEarned;
          if (Array.isArray(p.completedRoutes)) state.user.completedRoutes = p.completedRoutes;
          if (Array.isArray(p.routeSkinPresets)) state.routeSkinPresets = p.routeSkinPresets;
          saveState();
          render();
        } catch (err) {
          console.warn('[profile sync failed]', err);
        }
      }

      function syncPointsDelta(delta, reason) {
        if (!state.user.isLoggedIn || !delta) return;
        apiJson(`/api/users/${encodeURIComponent(state.user.id)}`, 'PATCH', { points_delta: delta, points_reason: reason });
      }

      // Pushes the whole cosmetics/challenge/invites bundle as one JSON blob (see
      // keongyu-api/src/profile.ts) - simpler than tracking which slice changed, and nothing
      // server-side needs to read into this blob's structure.
      function syncProfileToServer() {
        if (!state.user.isLoggedIn) return;
        apiJson(`/api/users/${encodeURIComponent(state.user.id)}`, 'PATCH', {
          name: state.user.name,
          avatar: state.user.avatar,
          profile: {
            custom: state.custom,
            challenge: state.challenge,
            invites: state.user.invites,
            stickersEarned: state.user.stickersEarned,
            completedRoutes: state.user.completedRoutes,
            routeSkinPresets: state.routeSkinPresets,
          },
        });
      }

      // Replaces the whole steps list server-side after any local add/update/delete-step mutation -
      // see keongyu-api's PUT /api/routes/:id/steps for why (a full-array replace instead of trying
      // to keep server-side step_order in sync with individual inserts/deletes).
      function syncStepsToServer(route, action) {
        apiJson(`/api/routes/${encodeURIComponent(route.id)}/steps`, 'PUT', {
          steps: route.steps,
          user_id: state.user.id,
          user_name: state.user.name,
          avatar: getAvatarDisplay(state.user.name),
          action,
        });
      }

      function syncRoutePatchToServer(route) {
        apiJson(`/api/routes/${encodeURIComponent(route.id)}`, 'PATCH', {
          title: route.title,
          purpose: route.purpose,
          distance: route.distance,
          time: route.time,
          budget: route.budget,
          tags: route.tags,
          is_public: !!route.isPublic,
          skin: route.skin || {},
        });
      }

      async function dataUrlToBlob(dataUrl) {
        const res = await fetch(dataUrl);
        return res.blob();
      }

      // POSTs a just-created local route to the server (photos included) and, on success, swaps
      // the optimistic local entry for the server-confirmed one - mainly so its photos become R2
      // keys like every other route instead of staying as inline base64.
      async function syncNewRouteToServer(localRoute, orderedSteps) {
        try {
          const form = new FormData();
          form.set('title', localRoute.title);
          form.set('purpose', localRoute.purpose || '');
          form.set('distance', localRoute.distance || '');
          form.set('time', localRoute.time || '');

          ],

          ui: {
            tab: 'explore',
            bottomSheet: null, // 'upload', 'notifSetting', 'notifInbox', 'share', 'customShop', 'charge'
            followRouteId: null,
            notifSheetCreator: null,
            showNotifInbox: false,
            review: { stars: 5, text: '', images: [] },

            cameraActive: false,
            cameraFacing: 'environment',
            collabSheet: null, // { routeId }
            collabEditSheet: null, // { routeId, stepIndex, mode: 'edit'|'add', afterIdx }
            charge: { pack: null, method: null },
            loginSheet: null, // { mode:'initial'|'email', email, codeSent, sentAt, sending, verifying } or null
            profileSheet: false,
            helpSheet: false,
            routeBuilder: null, // { title, purpose, distance, time, budget, steps: [] } - 새 루트 만들기 진행 중 상태
            stopEditor: null, // { editingIndex, category, name, ... } - 경유지 추가/수정 폼 상태
            photoLightbox: null, // { routeId, stepIdx, photoIdx } - 따라가기에서 경유지 사진 확대보기
            chatSheet: null, // { routeId } - 따라가기: 루트 전체 채팅창
            chatMessages: [], // 현재 열린 chatSheet의 메시지 목록
            chatLoading: false,
            chatDraft: '', // 입력 중인 메시지 - state에 없으면 폴링으로 인한 재렌더에 입력 중이던 글자가 날아감
            nearbyLoading: false // "근처" 필터: GPS 위치 조회 중
          },
          tempImages: []
        });
      }

      const state = loadSavedState();
      normalizeState();

      function normalizeState() {
        // Backfill fields introduced after this state may have been saved to localStorage.
        if (state.user.kakaoLoggedIn === undefined) state.user.kakaoLoggedIn = false;
        if (state.user.kakaoProfileImage === undefined) state.user.kakaoProfileImage = null;
        if (state.user.kakaoAccessToken === undefined) state.user.kakaoAccessToken = null;
        if (state.user.kakaoAccessTokenExpiresAt === undefined) state.user.kakaoAccessTokenExpiresAt = null;
        if (state.user.id === undefined) state.user.id = 'anon_' + Date.now();
        if (state.user.avatar === undefined) state.user.avatar = hashNameToAvatar(state.user.name);
        if (state.user.email === undefined) state.user.email = null;
        if (state.user.provider === undefined) state.user.provider = 'anon';
        if (state.user.isLoggedIn === undefined) state.user.isLoggedIn = false;
        if (!Array.isArray(state.user.likedRoutes)) state.user.likedRoutes = [];
        if (state.ui.loginSheet === undefined) state.ui.loginSheet = null;
        if (state.ui.profileSheet === undefined) state.ui.profileSheet = false;
        if (state.ui.helpSheet === undefined) state.ui.helpSheet = false;
        if (!state.ui.collabSheet) state.ui.collabSheet = null;
        if (state.ui.collabEditSheet === undefined) state.ui.collabEditSheet = null;
        if (state.ui.charge === undefined) state.ui.charge = { pack: null, method: null };
        if (state.ui.routeBuilder === undefined) state.ui.routeBuilder = null;
        if (state.ui.stopEditor === undefined) state.ui.stopEditor = null;
        if (state.ui.stopEditor && !Array.isArray(state.ui.stopEditor.photos)) {
          state.ui.stopEditor.photos = state.ui.stopEditor.photoUrl ? [state.ui.stopEditor.photoUrl] : [];
        }
        if (state.ui.photoLightbox === undefined) state.ui.photoLightbox = null;
        if (state.ui.giftSheet === undefined) state.ui.giftSheet = null; // { toUserId, toUserName, routeId, amount, message } - 별사탕 선물하기
        if (state.giftbox === undefined) state.giftbox = { gifts: [], loaded: false }; // 받은 선물함 (candy_gifts 조회 결과)
        if (state.ui.chatSheet === undefined) state.ui.chatSheet = null;
        if (!Array.isArray(state.ui.chatMessages)) state.ui.chatMessages = [];
        if (state.ui.chatLoading === undefined) state.ui.chatLoading = false;
        if (state.ui.chatDraft === undefined) state.ui.chatDraft = '';
        if (state.filter.nearby === undefined) state.filter.nearby = false;
        if (state.filter.nearbyGps === undefined) state.filter.nearbyGps = null;
        if (state.ui.nearbyLoading === undefined) state.ui.nearbyLoading = false;
        if (state.ui.mapFullscreen === undefined) state.ui.mapFullscreen = null;
        if (state.ui.checkinGpsLoading === undefined) state.ui.checkinGpsLoading = null;
        if (state.routeSkinShop === undefined) state.routeSkinShop = { items: [], ownedIds: [], loaded: false };
        if (state.routeSkinPresets === undefined) state.routeSkinPresets = [];
        // skinTab 기본값은 리터럴로 직접 씀 - normalizeState()는 ROUTE_SKIN_PARTS가 선언되기
        // 전(스크립트 앞쪽)에 실행되므로 여기서 ROUTE_SKIN_PARTS[0].key를 참조하면 TDZ 에러가 난다.
        if (state.skinStudioDraft === undefined) state.skinStudioDraft = { skin: {}, skinTab: 'card_bg' };
        if (state.ui.skinPresetNameDraft === undefined) state.ui.skinPresetNameDraft = null;
        if (state.challenge.todayCheck === undefined) state.challenge.todayCheck = null;
        if (state.challenge.completed === undefined) state.challenge.completed = false;
        state.routes.forEach(r => {
          if (r.isCollaborative === undefined) r.isCollaborative = false;
          if (!r.participants) r.participants = [];
          if (!r.pendingInvites) r.pendingInvites = [];
          if (!r.editLog) r.editLog = [];
          // Migrate single step.image (pre multi-photo support) -> step.images array.
          (r.steps || []).forEach(s => {
            if (!Array.isArray(s.images)) s.images = s.image ? [s.image] : [];
          });
        });
        // Migrate followCheckins from "routeId_step" (shared) to "routeId_step_user" (per-participant).
        const oldCheckins = state.user.followCheckins || {};
        const migrated = {};
        Object.keys(oldCheckins).forEach(key => {
          if (oldCheckins[key] !== true) return;
          const migratedKey = key.endsWith('_' + state.user.name) ? key : key + '_' + state.user.name;
          migrated[migratedKey] = true;
        });
        state.user.followCheckins = migrated;
      }

      function isQuotaError(e) {
        return !!e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014 || e.name === 'NS_ERROR_DOM_QUOTA_REACHED');
      }

      // Frees up room by dropping the heaviest base64 image data first (in-flight uploads,
      // then the oldest of my own route thumbnails), keeping the state itself intact.
      function pruneLargeImages() {
        let pruned = false;
        if (state.tempImages && state.tempImages.length) {
          state.tempImages = [];
          pruned = true;
        }
        if (state.ui.review && state.ui.review.images && state.ui.review.images.length) {
          state.ui.review.images = [];
          pruned = true;
        }
        const myImageRoutes = state.routes.filter(r => r.isMine && r.image && r.image.startsWith('data:'));
        if (myImageRoutes.length > 1) {
          myImageRoutes.slice(1).forEach(r => { r.image = null; });
          pruned = true;
        }
        return pruned;
      }

      // Small, independent snapshot of just the login-critical user fields, saved on its own key.
      // The full state blob keeps growing with route/deco photo data across a session and can hit
      // localStorage's quota - when that happens saveState() below can silently fail to persist a
      // fresh login (the in-memory session still looks logged in, but nothing was actually written),
      // so a refresh lands back on the logged-out onboarding sheet. This snapshot is tiny enough to
      // essentially always succeed, and loadSavedState()/reconcileAuthSnapshot() prefers it over a
      // stale/failed big blob on the next load.
      function saveAuthSnapshot() {
        try {
          localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({
            id: state.user.id, name: state.user.name, avatar: state.user.avatar, email: state.user.email,
            provider: state.user.provider, isLoggedIn: state.user.isLoggedIn,
            kakaoLoggedIn: state.user.kakaoLoggedIn, kakaoProfileImage: state.user.kakaoProfileImage,
          }));
        } catch (e) {}
      }

      function saveState() {
        saveAuthSnapshot();
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          if (!isQuotaError(e)) return;
          if (pruneLargeImages()) {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
              showToast('저장 공간이 부족해서 큰 이미지를 압축했어요 📦');
              return;
            } catch (e2) {
              // fall through to the toast below
            }
          }
          showToast('저장 공간이 가득 찼어요. 사진을 좀 정리해주세요.');
        }
      }

      // Calculate creator grade dynamically
      function getCreatorTier(creatorName) {
        let totalLikes = 0;
        for (const r of state.routes) {
          if (r.creator === creatorName) totalLikes += (r.likes || 0);
        }
        if (totalLikes >= 800) return { name: '다이아', icon: '💎', color: '#5BA9FF', border: '2px solid #5BA9FF', glow: '0 0 10px rgba(91,169,255,0.6)', ribbon: true, likes: totalLikes, next: null };
        if (totalLikes >= 400) return { name: '골드', icon: '🥇', color: '#FFC61C', border: '2px solid #FFC61C', glow: 'none', ribbon: true, likes: totalLikes, next: 800 };
        if (totalLikes >= 150) return { name: '실버', icon: '🥈', color: '#94A3B8', border: '2px solid #94A3B8', glow: 'none', ribbon: false, likes: totalLikes, next: 400 };
        return { name: '브론즈', icon: '🥉', color: '#CD7F32', border: '2px solid #CD7F32', glow: 'none', ribbon: false, likes: totalLikes, next: 150 };
      }

      function getAvatarDisplay(creatorName) {
        if (creatorName === state.user.name) {
          return AVATAR_MAP[state.custom.equipped.avatar] || '🐻';
        }
        return hashNameToAvatar(creatorName);
      }

      function getStickerDisplay(creatorName) {
        if (creatorName === state.user.name) {
          return STICKER_MAP[state.custom.equipped.sticker] || '❤️';
        }
        return '⭐';
      }

      // Routes without a real uploaded photo (dummy data, or map/GPX/GPS-only imports)
      // fall back to a purpose-themed gradient card instead of hotlinking stock photos.
      const PURPOSE_VISUAL = {
        '감성카페': { emoji: '☕', gradient: 'linear-gradient(135deg, #FFE8D6, #FFC9A0)' },
        '힐링·산책': { emoji: '🌿', gradient: 'linear-gradient(135deg, #D9F5EA, #A8E6CB)' },
        '데이트': { emoji: '💐', gradient: 'linear-gradient(135deg, #FFE1EA, #FFB8C9)' },
        '작업·몰입': { emoji: '📖', gradient: 'linear-gradient(135deg, #E9E4FF, #C9BBFF)' },
        '야경·드라이브': { emoji: '🌃', gradient: 'linear-gradient(135deg, #DCE9FF, #A9C4FF)' },
        '가성비': { emoji: '🧾', gradient: 'linear-gradient(135deg, #FFF6D9, #FFE79C)' }
      };

      function renderRouteThumb(route, heightPx) {
        const openAttr = `onclick="startFollowRoute('${route.id}')"`;
        if (route.image) {
          return `<img class="card-img" style="height:${heightPx}px; cursor:pointer;" src="${esc(resolveImageUrl(route.image))}" alt="${esc(route.title)}" ${openAttr} />`;
        }
        const v = PURPOSE_VISUAL[route.purpose] || { emoji: '📍', gradient: 'linear-gradient(135deg, #F0F0EE, #E0E0DC)' };
        return `<div class="card-img" style="height:${heightPx}px; cursor:pointer; background:${v.gradient}; display:flex; align-items:center; justify-content:center; font-size:${Math.round(heightPx * 0.4)}px;" ${openAttr}>${v.emoji}</div>`;
      }

      // ==========================================
      // 2. Global Actions & Event Handlers
      // ==========================================
      window.setTab = function(tab) {
        state.ui.tab = tab;
        saveState();
        render();
      };

      // Hidden admin entry point: 5 taps on the logo within 3s opens admin.html in a new tab
      // (admin.html is PC-only and gates itself server-side via /api/admin/verify, so this
      // is just a discreet way in - not a security boundary).
      window.handleLogoTap = function() {
        const now = Date.now();
        window._logoTapTimes = (window._logoTapTimes || []).filter(t => now - t < 3000);
        window._logoTapTimes.push(now);
        if (window._logoTapTimes.length >= 5) {
          window._logoTapTimes = [];
          window.open('admin.html', '_blank');
          return;
        }
        setTab('explore');
      };

      window.setPurposeFilter = function(purpose) {
        state.filter.purpose = purpose;
        saveState();
        render();
      };

      // Haversine great-circle distance in km between two lat/lng points.
      function haversineDistanceKm(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      // A route's distance is however close its nearest GPS-tagged step is - routes with no
      // GPS-tagged steps at all (most of the DEFAULT_ROUTES demo seed, and any step added without
      // using the GPS button) sort to the end rather than being hidden.
      function routeNearestDistanceKm(route, gps) {
        const dists = (route.steps || [])
          .filter(s => s.gps && typeof s.gps.lat === 'number' && typeof s.gps.lng === 'number')
          .map(s => haversineDistanceKm(gps.lat, gps.lng, s.gps.lat, s.gps.lng));
        return dists.length ? Math.min(...dists) : Infinity;
      }

      window.toggleNearbyFilter = function() {
        if (state.filter.nearby) {
          state.filter.nearby = false;
          saveState();
          render();
          return;
        }
        if (!navigator.geolocation) {
          showToast('이 브라우저는 위치 정보를 지원하지 않아요.');
          return;
        }
        state.ui.nearbyLoading = true;
        render();
        navigator.geolocation.getCurrentPosition(
          pos => {
            state.filter.nearby = true;
            state.filter.nearbyGps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            state.ui.nearbyLoading = false;
            saveState();
            render();
            showToast('내 위치에서 가까운 순으로 정렬했어요 📍');
          },
          err => {
            state.ui.nearbyLoading = false;
            showToast('위치 정보를 가져올 수 없어요. 위치 권한을 확인해주세요.');
            render();
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      };

      window.resetFilters = function() {
        state.filter.purpose = '전체';
        state.filter.query = '';
        state.filter.nearby = false;
        saveState();
        render();
      };

      window.clearSearchQuery = function() {
        state.filter.query = '';
        saveState();
        render();
      };

      window.onSearchInput = function(e) {
        state.filter.query = e.target.value;
        saveState();
        // Rebuilding the DOM mid-composition (render() replaces the whole innerHTML,
        // recreating this very <input>) breaks the IME session and corrupts Hangul/CJK input.
        // Skip re-rendering until the composition is committed.
        if (e.target.dataset.composing === 'true') return;
        render();
      };

      window.onSearchCompositionStart = function(e) {
        e.target.dataset.composing = 'true';
      };

      window.onSearchCompositionEnd = function(e) {
        e.target.dataset.composing = 'false';
        state.filter.query = e.target.value;
        saveState();
        render();
      };

      window.toggleLike = function(routeId) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        if (state.user.likedRoutes.includes(routeId)) {
          showToast('이미 하트를 눌렀어요 ❤️');
          return; // 접속(브라우저)당 루트별로 한 번만 가능
        }
        route.likes = (route.likes || 0) + 1;
        state.user.likedRoutes.push(routeId);
        saveState();
        render();
        apiJson(`/api/routes/${encodeURIComponent(routeId)}/like`, 'POST', { user_id: state.user.id });
      };

      // 마이루트: 내 루트 공개/비공개 전환
      window.togglePublic = function(routeId) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        route.isPublic = !route.isPublic;
        saveState();
        showToast(route.isPublic ? '루트를 공개로 전환했어요 🟢' : '루트를 비공개로 전환했어요 🔒');
        render();
      };

      // 마이루트: 내 루트 삭제
      window.deleteMyRoute = function(routeId) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        if (!confirm(`"${route.title}" 루트를 삭제할까요? 되돌릴 수 없습니다.`)) return;
        state.routes = state.routes.filter(r => r.id !== routeId);

      window.toggleSubscribe = function(creator) {
        if (creator === state.user.name) {
          showToast('자신은 구독할 수 없어요!');
          return;

          delete state.subscriptions[creator];

        } else {
          state.subscriptions[creator] = {

          };

        saveState();
        render();
      };

      window.openNotifSetting = function(creator) {

        state.ui.bottomSheet = 'notifSetting';

      window.setNotifOption = function(notifType) {

          delete state.subscriptions[creator];
          showToast(`${creator}님의 구독을 취소했습니다.`);
          apiSync(`/api/subscriptions?user_id=${encodeURIComponent(state.user.id)}&creator=${encodeURIComponent(creator)}`, { method: 'DELETE' });

      window.simulateNewRouteNotif = function() {

        const creator = subscribedCreators[0] || '성수러버민지';
        const notifLevel = state.subscriptions[creator]?.notif || 'all';

        if (notifLevel === 'none') {

        const newNotif = {

      window.shareChannel = function(channel) {
        const route = state.routes.find(r => r.id === state.ui.shareRouteId) || state.routes[0];
        // origin+pathname, not location.href.split('?')[0] - deterministic regardless of what
        // extra query string/hash happens to be on the current URL when this fires (e.g. a
        // leftover #kakao_login=... hash from the OAuth redirect flow). Matches the pattern the

        const shareUrl = `${SITE_BASE}?route=${route ? route.id : ''}`;

      // Downscales a picked file to at most IMAGE_MAX_DIM per side and re-encodes as JPEG
      // so localStorage doesn't fill up with full-resolution phone photos.
      function resizeImageFile(file) {
        return new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = evt => {
            const img = new Image();
            img.onload = () => {
              let { width, height } = img;
              if (width > IMAGE_MAX_DIM || height > IMAGE_MAX_DIM) {
                if (width > height) {
                  height = Math.round(height * (IMAGE_MAX_DIM / width));
                  width = IMAGE_MAX_DIM;
                } else {
                  width = Math.round(width * (IMAGE_MAX_DIM / height));
                  height = IMAGE_MAX_DIM;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              canvas.getContext('2d').drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', IMAGE_QUALITY));
            };
            img.onerror = () => resolve(evt.target.result);
            img.src = evt.target.result;
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });
      }

        for (let i = 0; i < count; i++) {
          const left = Math.max(2, Math.min(96, Math.round((i / count) * 100 + (i % 2 ? 3 : -3))));
          html += `<span style="left:${left}%; animation-delay:${(i * 0.35).toFixed(2)}s; animation-duration:${(3 + (i % 3)).toFixed(1)}s;">${emoji}</span>`;

      // "기타" 칩 - 미리 정해진 테마가 아니라 직접 입력하는 모드로 전환한다. rb.purpose를 빈 문자열로
      // 바꿔서 render()가 커스텀 입력창을 보여주게 한다(ROUTE_PURPOSES에 없는 값이면 커스텀 모드로
      // 판단 - 별도 플래그 없이도 "기타" 칩의 활성 여부를 알 수 있다).
      window.selectCustomRouteBuilderPurpose = function() {
        if (!state.ui.routeBuilder) return;
        if (ROUTE_PURPOSES.includes(state.ui.routeBuilder.purpose)) state.ui.routeBuilder.purpose = '';
        render();
      };

      // 커스텀 테마 입력 - 다른 텍스트 입력처럼 타이핑 중 render()를 부르지 않되, 욕설/19금 단어가
      // 걸리면 그 글자가 반영되지 않도록 입력창 자체를 되돌린다(state는 원래 값 그대로 유지).
      window.handleCustomPurposeInput = function(el) {
        if (!state.ui.routeBuilder) return;
        if (containsBannedWord(el.value)) {
          el.value = state.ui.routeBuilder.purpose;
          showToast('부적절한 단어는 테마 이름에 사용할 수 없어요.');
          return;
        }
        state.ui.routeBuilder.purpose = el.value;
      };

      window.cancelRouteBuilder = function() {
        const builder = state.ui.routeBuilder;
        if (builder && builder.steps.length > 0) {
          const msg = builder.editingRouteId
            ? '수정을 취소할까요? 변경한 내용이 저장되지 않아요.'
            : '작성 중인 루트를 취소할까요? 추가한 경유지가 모두 사라져요.';
          if (!confirm(msg)) return;
        }
        closeSheet();
      };

      window.openStopEditor = function(index) {
        const builder = state.ui.routeBuilder;
        if (!builder) return;
        if (index === null || index === undefined) {
          state.ui.stopEditor = newStopDraft();
        } else {
          const step = builder.steps[index];
          if (!step) return;
          state.ui.stopEditor = {
            ...newStopDraft(),
            editingIndex: index,
            // 예전 카테고리 체계('cafe'/'bakery'/'restaurant'/'convenience'/'attraction')로 만들어진
            // 기존 경유지를 수정할 때, 그 영문 키가 새 프리셋 목록에 없어서 "기타" 커스텀 입력창에
            // 그대로 노출되는 걸 막기 위한 매핑 - LEGACY_STOP_CATEGORY_MAP 참고.
            category: LEGACY_STOP_CATEGORY_MAP[step.category] || step.category || 'food',
            emoji: step.emoji || '🍽️',
            name: step.name || '',
            subtitle: step.subtitle || '',
            arrivalTime: step.arrivalTime || '',
            stayDuration: step.stayDuration || '',
            transitType: step.transitType || 'walk',
            distanceFromPrev: step.distanceFromPrev || '',
            address: step.address || '',
            description: step.memo || '',
            cost: step.cost && step.cost !== '0원' ? step.cost.replace(/[^0-9]/g, '') : '',
            photos: step.images ? step.images.slice() : [],
            photoCaption: step.photoCaption || '',
            gps: step.gps || null
          };
        }
        render();
      };

      window.closeStopEditor = function() {
        stopStepCameraStream();
        state.ui.stopEditor = null;
        render();
      };

      window.selectStopCategory = function(type) {
        const preset = STOP_CATEGORY_PRESETS.find(p => p.type === type);
        if (!preset || !state.ui.stopEditor) return;
        state.ui.stopEditor.category = type;
        state.ui.stopEditor.emoji = preset.emoji;
        render();
      };

      // "기타" 칩 - 테마의 selectCustomRouteBuilderPurpose()와 같은 패턴: 정해진 카테고리가 아니면
      // (STOP_CATEGORY_PRESETS에 없는 값이면) 커스텀 모드로 간주해 입력창을 보여준다.
      window.selectCustomStopCategory = function() {
        const editor = state.ui.stopEditor;
        if (!editor) return;
        if (STOP_CATEGORY_PRESETS.some(p => p.type === editor.category)) {
          editor.category = '';
          editor.emoji = '📍';
        }
        render();
      };

      // 커스텀 카테고리 입력 - handleCustomPurposeInput()과 동일한 방식: 금칙어가 걸리면 입력창을
      // 이전 값으로 되돌리고 state에는 반영하지 않는다.
      window.handleCustomStopCategoryInput = function(el) {
        const editor = state.ui.stopEditor;
        if (!editor) return;
        if (containsBannedWord(el.value)) {
          el.value = editor.category;
          showToast('부적절한 단어는 카테고리 이름에 사용할 수 없어요.');
          return;
        }
        editor.category = el.value;
      };

      window.selectStopTransit = function(type) {
        const preset = TRANSIT_PRESETS.find(p => p.type === type);
        if (!preset || !state.ui.stopEditor) return;
        state.ui.stopEditor.transitType = type;
        state.ui.stopEditor.distanceFromPrev = preset.defaultText;
        render();
      };

      window.getStopEditorGps = function() {
        const editor = state.ui.stopEditor;
        if (!editor) return;
        if (!navigator.geolocation) {
          editor.gpsError = '이 브라우저에서는 GPS 위치 기능을 지원하지 않습니다.';
          render();
          return;
        }
        editor.gpsLoading = true;
        editor.gpsError = null;
        render();
        navigator.geolocation.getCurrentPosition(
          pos => {
            const { latitude, longitude, accuracy } = pos.coords;
            const formattedText = `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
            editor.gps = { lat: latitude, lng: longitude, accuracy: Math.round(accuracy || 0), formattedText };
            editor.gpsLoading = false;
            const addrInput = document.getElementById('stop-form-address');
            if (addrInput && !addrInput.value.trim()) {
              addrInput.value = `GPS 좌표 (${formattedText})`;
              editor.address = addrInput.value;
            }
            render();
          },
          err => {
            editor.gpsLoading = false;
            editor.gpsError = err.code === err.PERMISSION_DENIED
              ? '위치 접근 권한이 거부되었습니다. 브라우저 설정에서 위치 권한을 허용해주세요.'
              : '현재 GPS 신호를 가져올 수 없습니다. 잠시 후 다시 시도해주세요.';
            render();
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
        );
      };

      window.clearStopEditorGps = function() {
        if (!state.ui.stopEditor) return;
        state.ui.stopEditor.gps = null;
        render();
      };

      window.handleStopFileInput = function(e) {
        const files = Array.from(e.target.files || []);
        e.target.value = '';
        if (!files.length || !state.ui.stopEditor) return;
        const remaining = MAX_STOP_PHOTOS - state.ui.stopEditor.photos.length;
        if (remaining <= 0) {
          showToast(`사진은 최대 ${MAX_STOP_PHOTOS}장까지 등록할 수 있어요.`);
          return;
        }
        const toAdd = files.slice(0, remaining);
        if (files.length > toAdd.length) {
          showToast(`사진은 최대 ${MAX_STOP_PHOTOS}장까지 등록할 수 있어요. (${toAdd.length}장만 추가됩니다)`);
        }
        Promise.all(toAdd.map(resizeImageFile)).then(urls => {
          if (!state.ui.stopEditor) return;
          urls.filter(Boolean).forEach(url => state.ui.stopEditor.photos.push(url));
          if (!state.ui.stopEditor.photoCaption && toAdd[0]) {
            state.ui.stopEditor.photoCaption = `${toAdd[0].name.replace(/\.[^/.]+$/, '')} 현장 사진`;
          }
          render();
        });
      };

      window.clearStopPhoto = function(index) {
        if (!state.ui.stopEditor) return;
        state.ui.stopEditor.photos.splice(index, 1);
        render();
      };

      function stopStepCameraStream() {
        if (window._stepMediaStream) {
          window._stepMediaStream.getTracks().forEach(t => t.stop());
          window._stepMediaStream = null;
        }
      }

      window.startStepCamera = async function() {
        const editor = state.ui.stopEditor;
        if (!editor) return;
        if (editor.photos.length >= MAX_STOP_PHOTOS) {
          showToast(`사진은 최대 ${MAX_STOP_PHOTOS}장까지 등록할 수 있어요.`);
          return;
        }
        editor.cameraOpen = true;
        editor.cameraError = null;
        render();
        stopStepCameraStream();
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error('이 브라우저는 카메라 스트림을 지원하지 않습니다.');
          }
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: editor.cameraFacing || 'environment' }
          });
          window._stepMediaStream = stream;
          const video = document.getElementById('step-camera-video');
          if (video) {
            video.srcObject = stream;
            video.play();
          }
        } catch (err) {
          editor.cameraError = '카메라를 열 수 없습니다. 카메라 권한을 확인하거나 파일 업로드를 이용하세요.';
          render();
        }
      };

      window.stopStepCamera = function() {
        stopStepCameraStream();
        if (state.ui.stopEditor) {
          state.ui.stopEditor.cameraOpen = false;
          state.ui.stopEditor.cameraError = null;
        }
        render();
      };

      window.switchStepCameraFacing = function() {
        if (!state.ui.stopEditor) return;
        state.ui.stopEditor.cameraFacing = state.ui.stopEditor.cameraFacing === 'environment' ? 'user' : 'environment';
        startStepCamera();
      };

      window.captureStepPhoto = function() {
        const video = document.getElementById('step-camera-video');
        const editor = state.ui.stopEditor;
        if (!video || !video.videoWidth || !editor) {
          showToast('카메라가 아직 준비되지 않았어요. 잠시 후 다시 시도해주세요.');
          return;
        }
        if (editor.photos.length >= MAX_STOP_PHOTOS) {
          showToast(`사진은 최대 ${MAX_STOP_PHOTOS}장까지 등록할 수 있어요.`);
          return;
        }
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
        editor.photos.push(canvas.toDataURL('image/jpeg', IMAGE_QUALITY));
        if (!editor.photoCaption) editor.photoCaption = '카메라로 현장 직접 촬영한 사진';
        stopStepCameraStream();
        editor.cameraOpen = false;
        const hadGps = !!editor.gps;
        render();
        if (!hadGps) window.getStopEditorGps();
      };

      window.saveStopEditor = function() {
        const editor = state.ui.stopEditor;
        const builder = state.ui.routeBuilder;
        if (!editor || !builder) return;

        const name = document.getElementById('stop-form-name')?.value.trim();
        const subtitle = document.getElementById('stop-form-subtitle')?.value.trim();
        const arrivalTime = document.getElementById('stop-form-time')?.value.trim();
        const stayDuration = document.getElementById('stop-form-duration')?.value.trim();
        const distanceFromPrev = document.getElementById('stop-form-transit-distance')?.value.trim();
        const address = document.getElementById('stop-form-address')?.value.trim();
        const description = document.getElementById('stop-form-desc')?.value.trim();
        const costRaw = document.getElementById('stop-form-cost')?.value.trim();
        const photoCaption = document.getElementById('stop-form-photo-caption')?.value.trim();

        if (!name) {
          showToast('장소명을 입력해주세요.');
          return;
        }
        // filteredInput()이 타이핑 중 이미 걸러내지만, 붙여넣기 등으로 oninput을 안 거쳤을 가능성에
        // 대비해 저장 직전에도 한 번 더 확인한다 (아래 "기타" 커스텀 카테고리 체크와 같은 이유).
        if ([name, subtitle, arrivalTime, stayDuration, distanceFromPrev, address, description, costRaw, photoCaption].some(containsBannedWord)) {
          showToast('부적절한 단어는 사용할 수 없어요.');
          return;
        }
        // "기타" 커스텀 카테고리 - handleCustomStopCategoryInput()이 타이핑 중 이미 걸러내지만, 붙여넣기
        // 등으로 oninput을 안 거쳤을 가능성에 대비해 저장 직전에도 한 번 더 확인한다.
        if (!STOP_CATEGORY_PRESETS.some(p => p.type === editor.category)) {
          if (!editor.category.trim()) {
            showToast('카테고리 이름을 입력해주세요.');
            return;
          }
          if (containsBannedWord(editor.category)) {
            showToast('카테고리 이름에 부적절한 단어가 포함되어 있어요.');
            return;
          }
        }

        const isFirst = editor.editingIndex === null ? builder.steps.length === 0 : editor.editingIndex === 0;
        const costNum = costRaw ? Number(costRaw.replace(/[^0-9]/g, '')) : 0;

        const step = {
          category: editor.category,
          emoji: editor.emoji,
          name,
          subtitle: subtitle || '',
          arrivalTime: arrivalTime || '',
          stayDuration: stayDuration || '',
          transitType: isFirst ? null : editor.transitType,
          distanceFromPrev: isFirst ? '' : (distanceFromPrev || ''),
          address: address || (editor.gps ? `GPS 좌표 (${editor.gps.formattedText})` : ''),
          memo: description || '',
          cost: costNum > 0 ? `${costNum.toLocaleString()}원` : '0원',
          images: editor.photos.slice(),
          photoCaption: photoCaption || '',
          gps: editor.gps || null
        };

        if (editor.editingIndex === null) {
          builder.steps.push(step);
        } else {
          builder.steps[editor.editingIndex] = { ...builder.steps[editor.editingIndex], ...step };
        }

        const wasAdd = editor.editingIndex === null;
        state.ui.stopEditor = null;
        render();
        showToast(wasAdd ? '경유지가 추가됐어요! 📍' : '경유지가 수정됐어요 ✏️');
      };

      window.removeBuilderStep = function(index) {
        if (!state.ui.routeBuilder) return;
        if (!confirm('이 경유지를 삭제할까요?')) return;
        state.ui.routeBuilder.steps.splice(index, 1);
        render();
      };

      window.finalizeRouteBuilder = function() {
        const builder = state.ui.routeBuilder;
        if (!builder) return;

        const title = document.getElementById('builder-title')?.value.trim();
        const distance = document.getElementById('builder-distance')?.value.trim();
        const time = document.getElementById('builder-time')?.value.trim();
        const budgetRaw = document.getElementById('builder-budget')?.value.trim();

        if (!title) {
          showToast('루트 제목을 입력해주세요.');
          return;
        }
        if ([title, distance, time, budgetRaw].some(containsBannedWord)) {
          showToast('부적절한 단어는 사용할 수 없어요.');
          return;
        }
        // "기타" 커스텀 테마 - handleCustomPurposeInput()이 타이핑 중 이미 걸러내지만, 붙여넣기 등으로
        // oninput을 안 거쳤을 가능성에 대비해 저장 직전에도 한 번 더 확인한다.
        if (!ROUTE_PURPOSES.includes(builder.purpose)) {
          if (!builder.purpose.trim()) {
            showToast('테마 이름을 입력해주세요.');
            return;
          }
          if (containsBannedWord(builder.purpose)) {
            showToast('테마 이름에 부적절한 단어가 포함되어 있어요.');
            return;
          }
        }
        if (builder.steps.length < 1) {
          showToast('경유지를 1개 이상 추가해주세요.');
          return;
        }

        const orderedSteps = builder.steps.map((s, i) => ({
          ...s,
          type: i === 0 ? 'START' : (i === builder.steps.length - 1 ? '도착' : '경유')
        }));
        const budgetNum = budgetRaw ? Number(budgetRaw.replace(/[^0-9]/g, '')) : 0;
        const coverImage = orderedSteps.find(s => s.images && s.images.length)?.images[0] || null;

        if (builder.editingRouteId) {
          const route = state.routes.find(r => r.id === builder.editingRouteId);
          if (!route) {
            showToast('수정할 루트를 찾을 수 없어요.');
            return;
          }
          route.title = title;
          route.purpose = builder.purpose;
          route.distance = distance || '정보 없음';
          route.time = time || '정보 없음';
          route.budget = budgetNum > 0 ? `${budgetNum.toLocaleString()}원` : '0원';
          route.steps = orderedSteps;
          route.skin = { ...builder.skin };
          if (coverImage) route.image = coverImage;
          if (!route.editLog) route.editLog = [];
          route.editLog.unshift({ user: state.user.name, avatar: getAvatarDisplay(state.user.name), action: '루트 정보 수정', time: '방금' });
          state.ui.routeBuilder = null;
          state.ui.stopEditor = null;
          state.ui.bottomSheet = null;
          saveState();
          showToast('루트가 수정되었습니다! ✏️');
          render();
          syncRoutePatchToServer(route);
          syncStepsToServer(route, '루트 정보 수정');
          return;
        }

        const newRoute = {
          id: 'r_' + Date.now(),
          title,
          purpose: builder.purpose,
          tags: [`#${builder.purpose}`, '#직접등록', `#경유지${orderedSteps.length}곳`],
          distance: distance || '정보 없음',
          time: time || '정보 없음',
          budget: budgetNum > 0 ? `${budgetNum.toLocaleString()}원` : '0원',
          likes: 0,
          creator: state.user.name,
          isPublic: true,
          isMine: true,
          image: coverImage,
          steps: orderedSteps,
          skin: { ...builder.skin },
          comments: []
        };

        state.routes.unshift(withCollabDefaults(newRoute));
        state.user.points += 15;
        state.ui.routeBuilder = null;
        state.ui.stopEditor = null;
        state.ui.bottomSheet = null;
        state.ui.tab = 'myRoutes';
        saveState();
        showToast('루트가 성공적으로 등록되었습니다! ⭐+15 적립');
        render();
        syncNewRouteToServer(newRoute, orderedSteps);
        syncPointsDelta(15, '루트 등록');
      };

      // ==========================================
      // 2b. 루트카드 스킨 - 별사탕 샵 ("업로드" → "새 루트 만들기" 화면에서 12파츠를 꾸민다)
      // ==========================================
      const RARITY_COLORS = { N: '#9CA3AF', R: '#3B82F6', SR: '#A855F7', SSR: '#F59E0B' };

      // 지연 로딩 패턴 (업로드 시트에서 스킨
      // 섹션을 처음 열 때 한 번만 호출).
      async function loadRouteSkinShopIfNeeded() {
        if (state.routeSkinShop.loaded) return;
        try {
          const res = await fetch(`${API_BASE}/api/route-skin/items`);
          const data = await res.json();
          state.routeSkinShop.items = data.items || [];
        } catch (e) { console.warn('[route-skin] items load failed', e); }
        await refreshRouteSkinInventory();
        state.routeSkinShop.loaded = true;
        render();
      }

      async function refreshRouteSkinInventory() {
        if (!state.user.isLoggedIn) return;
        try {
          const res = await fetch(`${API_BASE}/api/route-skin/inventory?user_id=${encodeURIComponent(state.user.id)}`);
          const data = await res.json();
          state.routeSkinShop.ownedIds = data.item_ids || [];
        } catch (e) { console.warn('[route-skin] inventory load failed', e); }
      }

      // 이 4개 함수는 "꾸미기" 탭(renderSkinStudio, state.skinStudioDraft)에서만 쓰인다 - 새 루트
      // 만들기 화면은 더 이상 직접 아이템을 고르지 않고, 여기서 이름 붙여 저장한 조합을 드롭다운으로
      // 골라 rb.skin에 통째로 적용만 한다 (applyRouteSkinPreset 참고).
      window.selectRouteSkinTab = function(part) {
        state.skinStudioDraft.skinTab = part;
        render();
      };

      window.equipRouteSkinItem = function(itemId) {
        const item = findRouteSkinItem(itemId);
        if (!item) return;
        state.skinStudioDraft.skin[item.part] = item.id;
        saveState();
        render();
      };

      // 장착 해제는 custom 상점과 동일하게 무료·즉시 - 한 번 산 아이템은 영구 소유이고,
      // 환불 없이 몇 번이든 다시 장착할 수 있다 (별도 결정: 대여 개념 도입 안 함).
      window.unequipRouteSkinPart = function(part) {
        if (!state.skinStudioDraft.skin[part]) return;
        delete state.skinStudioDraft.skin[part];
        saveState();
        render();
      };

      window.handleRouteSkinItemTap = function(itemId) {
        const item = findRouteSkinItem(itemId);
        if (!item) return;
        const equipped = state.skinStudioDraft.skin[item.part] === item.id;
        if (equipped) { unequipRouteSkinPart(item.part); return; }
        if (state.routeSkinShop.ownedIds.includes(item.id)) { equipRouteSkinItem(item.id); return; }
        buyRouteSkinItem(item.id);
      };

      window.buyRouteSkinItem = async function(itemId) {
        const item = findRouteSkinItem(itemId);
        if (!item) return;
        if (!state.user.isLoggedIn) { showToast('로그인 후 구매할 수 있어요 🔐'); openLoginSheet('initial'); return; }
        if (state.user.points < item.price) { showToast(`별사탕이 부족해요! (보유: ${state.user.points}개 / 필요: ${item.price}개)`); return; }
        try {
          const result = await apiJsonAwait('/api/route-skin/buy', 'POST', { user_id: state.user.id, item_id: item.id });
          if (!state.routeSkinShop.ownedIds.includes(item.id)) state.routeSkinShop.ownedIds.push(item.id);
          state.user.points = result.points;
          showToast(`구매 완료! ⭐-${item.price}`);
          equipRouteSkinItem(item.id);
        } catch (err) {
          showToast(err.message || '구매에 실패했어요.');
        }
      };

      function renderRouteSkinShopItem(item, rb) {
        const owned = state.routeSkinShop.ownedIds.includes(item.id);
        const equipped = rb.skin[item.part] === item.id;
        const rarityColor = RARITY_COLORS[item.rarity] || '#9CA3AF';
        // min-width:0 + overflow:hidden on the grid item itself (not just the inner name text) -
        // some item names are long unbroken strings (e.g. "kyungyu의 찢어진 편지지 프레임" under
        // frame), and a CSS grid item's automatic minimum width defaults to its content's min-content
        // size when the item's own overflow is visible. Without capping the card itself, that one long
        // name forced its whole grid row (and with it the page) wider than the app frame instead of
        // the name just ellipsis-truncating inside its 1fr column.
        return `
          <div style="min-width:0; overflow:hidden; border:2px solid ${equipped ? 'var(--primary)' : rarityColor}; border-radius:14px; padding:10px 4px; text-align:center; background:#FFF; cursor:pointer;" onclick="handleRouteSkinItemTap('${item.id}')">
            <div style="font-size:30px; margin-bottom:4px;">${item.emoji}</div>
            <div style="font-size:11px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${esc(item.name)}</div>
            <div style="font-size:10px; font-weight:700; color:${equipped ? 'var(--primary)' : 'var(--text-sub)'};">${equipped ? '✓ 적용됨' : (owned ? '보유중' : `⭐${item.price}`)}</div>
          </div>
        `;
      }

      // 업로드 시트 좌측의 실시간 미리보기 - 홈 피드/내 루트 카드와 완전히 같은
      // getRouteSkinVisuals()/routeCardSkinAttrs()를 거치므로 여기서 본 그대로 다른 사람 화면에도 보인다.
