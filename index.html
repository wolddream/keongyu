    <style>
      :root {
        --primary: #8B6CFF;
        --mint: #2DD4A0;
        --lavender: #8B6CFF;
        --peach: #FF8C4B;
        --pink: #FF6B8A;
        --yellow: #FFC61C;
        --blue: #5BA9FF;
        --bg: #F5F5F0;
        --card: #FFFFFF;
        --text: #191F28;
        --text-sub: #6B7684;
        --border: #E5E8EB;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
      body {
        background-color: #E8E8E2;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        color: var(--text);
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      #app-frame {
        width: 100%;
        max-width: 440px;
        min-height: 100dvh;
        background: var(--bg);
        box-shadow: 0 0 30px rgba(0,0,0,0.08);
        position: relative;
        display: flex;
        flex-direction: column;
        padding-bottom: 74px;
      }
      header {
        position: sticky; top: 0; z-index: 40;
        background: rgba(245, 245, 240, 0.95);
        backdrop-filter: blur(8px);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(0,0,0,0.05);
      }
      .logo-box { font-weight: 900; font-size: 19px; letter-spacing: -0.5px; color: var(--primary); display: flex; align-items: center; gap: 4px; cursor: pointer; }
      .header-right { display: flex; align-items: center; gap: 8px; }
      .point-chip {
        background: #FFF; border: 1px solid var(--border); border-radius: 16px;
        padding: 4px 10px; font-size: 13px; font-weight: 700; color: #E68A00;
        display: flex; align-items: center; gap: 4px; cursor: pointer;
      }
      .icon-btn {
        background: #FFF; border: 1px solid var(--border); width: 34px; height: 34px;
        border-radius: 50%; display: flex; align-items: center; justify-content: center;
        position: relative; cursor: pointer; font-size: 16px;
      }
      .badge-dot {
        position: absolute; top: -2px; right: -2px; background: #FF4242; color: white;
        font-size: 10px; font-weight: 800; min-width: 16px; height: 16px;
        border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 3px;
      }
      .upload-btn {
        background: var(--primary); color: white; border: none; border-radius: 18px;
        padding: 6px 12px; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 3px; cursor: pointer;
      }
      nav.bottom-nav {
        position: fixed; bottom: 0; width: 100%; max-width: 440px; height: 64px;
        background: rgba(255,255,255,0.98); backdrop-filter: blur(10px);
        border-top: 1px solid var(--border); display: flex; z-index: 50;
      }
      .nav-item {
        flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 3px; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--text-sub);
      }
      .nav-item.active { color: var(--primary); }
      .nav-item .icon { font-size: 18px; }

      /* Sub btn */
      .sub-btn {
        background: #111; color: white; border-radius: 20px; padding: 6px 14px;
        font-size: 12px; font-weight: bold; border: none; cursor: pointer;
      }
      .sub-btn.subscribed { background: #EEE; color: #666; }

      /* Cards & Lists */
      .content-area { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
      .banner {
        background: linear-gradient(135deg, #FF6B8A, #FF8C4B);
        border-radius: 16px; padding: 14px 16px; color: white; cursor: pointer;
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 4px 12px rgba(255,107,138,0.25);
      }
      .search-box {
        position: relative; width: 100%;
      }
      .search-box input {
        width: 100%; background: #FFF; border: 1.5px solid var(--border); border-radius: 14px;
        padding: 12px 14px 12px 38px; font-size: 14px; font-weight: 500; outline: none; transition: border-color 0.2s;
      }
      .search-box input:focus { border-color: var(--primary); }
      .search-box .icon { position: absolute; left: 12px; top: 12px; font-size: 16px; color: #999; }

      .filter-scroll {
        display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
      }
      .filter-scroll::-webkit-scrollbar { display: none; }
      .filter-chip {
        white-space: nowrap; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
        background: #FFF; border: 1px solid var(--border); cursor: pointer; color: var(--text-sub);
      }
      .filter-chip.active { background: var(--text); color: #FFF; border-color: var(--text); }
      .filter-chip.sub-chip.active { background: var(--primary); color: #FFF; border-color: var(--primary); }

      .route-card {
        background: var(--card); border-radius: 18px; padding: 16px; border: 1px solid var(--border);
        box-shadow: 0 2px 8px rgba(0,0,0,0.03); display: flex; flex-direction: column; gap: 10px;
      }
      .card-top { display: flex; justify-content: space-between; align-items: center; }
      .purpose-pill {
        background: #F0F4FF; color: var(--primary); font-size: 11px; font-weight: 800;
        padding: 4px 8px; border-radius: 8px;
      }
      .like-btn {
        background: none; border: none; font-size: 13px; font-weight: 700; color: #FF4B6E;
        display: flex; align-items: center; gap: 4px; cursor: pointer;
      }
      .card-title { font-size: 16px; font-weight: 800; line-height: 1.35; }
      .card-pills { display: flex; gap: 6px; flex-wrap: wrap; }
      .info-pill {
        background: #F5F5F0; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; color: var(--text-sub);
      }
      .card-img {
        width: 100%; height: 140px; border-radius: 12px; object-fit: cover; background: #EFEFEF;
      }
      .card-bottom {
        display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px solid #F0F0EE;
      }
      .creator-info { display: flex; align-items: center; gap: 6px; }
      .avatar-wrapper {
        position: relative; width: 32px; height: 32px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; font-size: 18px; background: #FFF;
      }
      .sticker-badge {
        position: absolute; bottom: -3px; right: -3px; font-size: 11px;
      }
      .ribbon-tag { font-size: 10px; margin-left: 2px; }
      .card-actions { display: flex; align-items: center; gap: 6px; }
      .cta-btn {
        background: var(--primary); color: white; border: none; border-radius: 20px;
        padding: 7px 14px; font-size: 12px; font-weight: 800; cursor: pointer;
      }

      /* Sheets & Overlays */
      .sheet-backdrop {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5);
        z-index: 100; display: flex; justify-content: center; align-items: flex-end;
      }
      .bottom-sheet {
        width: 100%; max-width: 440px; background: #FFF; border-radius: 24px 24px 0 0;
        padding: 20px; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 16px;
        animation: slideUp 0.25s ease-out;
      }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      .fullscreen-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg);
        z-index: 90; display: flex; justify-content: center;
      }
      .overlay-inner {
        width: 100%; max-width: 440px; height: 100dvh; display: flex; flex-direction: column; background: var(--bg);
      }
      .toast-box {
        position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
        background: rgba(25, 31, 40, 0.92); color: white; padding: 10px 18px;
        border-radius: 24px; font-size: 13px; font-weight: 700; z-index: 200;
        box-shadow: 0 4px 16px rgba(0,0,0,0.2); pointer-events: none;
        transition: opacity 0.25s, transform 0.25s; opacity: 0;
      }
      .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
      .theme-flash {
        position: fixed; top:0; left:0; right:0; bottom:0; background: var(--primary);
        opacity: 0.15; z-index: 999; pointer-events: none; animation: flashOut 0.4s ease-out forwards;
      }
      @keyframes flashOut { from { opacity: 0.25; } to { opacity: 0; } }
      @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-8px); } }

      /* Radio item */
      .radio-item {
        display: flex; align-items: center; justify-content: space-between; padding: 12px;
        border: 1px solid var(--border); border-radius: 14px; cursor: pointer; margin-bottom: 8px;
      }
      .radio-item.selected { border-color: var(--primary); background: rgba(139, 108, 255, 0.05); }

      /* Grid 2x2 */
      .grid-2x2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .grid-card {
        background: #F8F8F6; border: 1px solid var(--border); border-radius: 16px;
        padding: 16px; display: flex; flex-direction: column; align-items: center; text-align: center;
        gap: 6px; cursor: pointer; position: relative;
      }
      .grid-card:hover { border-color: var(--primary); background: #FFF; }
      .rec-badge {
        position: absolute; top: -6px; right: -6px; background: #FF4242; color: white;
        font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 8px;
      }

      /* Collaborative planning (함께가기) */
      .btn-secondary {
        background: #111; color: white; border: none; border-radius: 20px;
        padding: 8px 14px; font-size: 12px; font-weight: bold; cursor: pointer;
      }
      .collab-pill {
        background: var(--mint); color: white; font-size: 11px; padding: 4px 8px;
        border-radius: 12px; font-weight: bold; white-space: nowrap;
      }
      .participants-stack { display: flex; margin-left: 8px; }
      .participants-stack .avatar-wrapper { margin-left: -8px; border: 2px solid #FFF; }
      .edit-log-item {
        display: flex; align-items: center; gap: 8px; padding: 6px 0;
        font-size: 12px; border-bottom: 1px solid #F0F0F0;
      }
      .step-mini-actions { display: flex; gap: 6px; margin-top: 4px; }
      .step-mini-btn {
        background: #F5F5F0; color: var(--text-sub); border: none; border-radius: 10px;
        padding: 4px 8px; font-size: 11px; font-weight: 700; cursor: pointer;
      }
    </style>
    <!-- Kakao JavaScript SDK (6️⃣ 인증 & 카카오, KEONGYU-Cloudflare-Notion.md) -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
    <!-- Cloudflare Turnstile (8️⃣ 배포 & 모니터링: 봇 방지) -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
      .turnstile-overlay {
        position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
        z-index: 150; background: #FFF; border-radius: 16px; padding: 12px 14px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.18); border: 1px solid var(--border, #E5E8EB);
      }
    </style>
  </head>
  <body>
    <div id="app-frame">
      <!-- Dynamic render root -->
      <div id="root" style="display:contents;"></div>
    </div>

    <!-- Hidden global inputs required by spec -->
    <input type="file" id="global-file-input" style="display:none;" multiple accept="image/*" />
    <input type="file" id="fallback-camera-input" style="display:none;" capture="environment" accept="image/*" />

    <!-- Bottom Toast -->
    <div id="toast" class="toast-box"></div>

    <!-- Turnstile 봇 방지 위젯 (8️⃣ 배포 & 모니터링). #root 밖에 고정 배치해서
         전체 innerHTML 재렌더링에도 위젯이 초기화/파괴되지 않게 합니다. -->
    <div id="turnstile-widget" class="turnstile-overlay" style="display:none;">
      <div style="font-size:11px; font-weight:700; color:var(--text-sub); margin-bottom:6px;">사람인지 확인해주세요</div>
      <div id="turnstile-target"></div>
    </div>

    <script>
      // ==========================================
      // -1. Kakao SDK Init (6️⃣ 인증 & 카카오)
      // ==========================================
      const KAKAO_JS_KEY = 'c9b3225b112c58a9bba266cfe150b50a';
      if (window.Kakao && !Kakao.isInitialized()) {
        Kakao.init(KAKAO_JS_KEY);
      }
      // 사용 예시 (친구 선택 → 함께가기 참여자로 추가):
      // Kakao.Picker.selectFriends({ title: '함께 갈 친구 선택', maxPickableCount: 5 })
      //   .then(friends => friends.users.forEach(f => addParticipant(routeId, f.displayName)));

      // Kakao Login: 로그인 성공 시 카카오 프로필(닉네임/프로필사진)을 내 프로필에 반영.
      // 'friends' 동의항목을 포함해야 이후 Kakao.Picker.selectFriends()가 정상 동작합니다.
      window.kakaoLogin = function() {
        if (!window.Kakao || !Kakao.isInitialized()) {
          showToast('카카오 SDK가 초기화되지 않았어요.');
          return;
        }
        Kakao.Auth.login({ scope: 'friends,profile_nickname,profile_image' })
          .then(() => Kakao.API.request({ url: '/v2/user/me' }))
          .then(res => {
            const account = res.kakao_account || {};
            const profile = account.profile || res.properties || {};
            const nickname = profile.nickname || '카카오유저';
            const profileImage = profile.profile_image_url || profile.profile_image || null;
            state.user.name = nickname;
            state.user.kakaoLoggedIn = true;
            state.user.kakaoProfileImage = profileImage;
            saveState();
            showToast(`${nickname}님으로 로그인했어요! 👋`);
            render();
          })
          .catch(() => {
            showToast('카카오 로그인에 실패했어요.');
          });
      };

      window.kakaoLogout = function() {
        if (!window.Kakao || !Kakao.isInitialized() || !Kakao.Auth.getAccessToken()) {
          state.user.kakaoLoggedIn = false;
          saveState();
          render();
          return;
        }
        Kakao.Auth.logout(() => {
          state.user.kakaoLoggedIn = false;
          state.user.kakaoProfileImage = null;
          saveState();
          showToast('카카오 로그아웃했어요.');
          render();
        });
      };

      // ==========================================
      // -0.5 Turnstile 봇 방지 (8️⃣ 배포 & 모니터링)
      // ==========================================
      // #turnstile-widget/#turnstile-target live outside #root, so they survive render()'s
      // full innerHTML replacement — the widget is mounted once and only reset, never destroyed.
      const TURNSTILE_SITE_KEY = '0x4AAAAAAEsqlfcMjUooahhi';
      window._turnstileWidgetId = null;
      window._turnstileToken = null;

      window.showTurnstile = function() {
        const overlay = document.getElementById('turnstile-widget');
        const wasHidden = !overlay || overlay.style.display !== 'block';
        if (overlay) overlay.style.display = 'block';
        if (!window.turnstile) return; // async script may not have loaded yet
        if (window._turnstileWidgetId === null) {
          const target = document.getElementById('turnstile-target');
          if (!target) return;
          window._turnstileWidgetId = turnstile.render(target, {
            sitekey: TURNSTILE_SITE_KEY,
            callback: token => { window._turnstileToken = token; },
            'expired-callback': () => { window._turnstileToken = null; }
          });
        } else if (wasHidden) {
          // Only reset on the hidden -> shown transition, not on every re-render while
          // the sheet stays open (e.g. clicking a star rating shouldn't wipe the check).
          turnstile.reset(window._turnstileWidgetId);
          window._turnstileToken = null;
        }
      };

      window.hideTurnstile = function() {
        const overlay = document.getElementById('turnstile-widget');
        if (overlay) overlay.style.display = 'none';
      };

      // ==========================================
      // 0. Constants & Utilities
      // ==========================================
      const STORAGE_KEY = 'keongyu_v1';
      const AVATAR_MAP = { bear: '🐻', cat: '🐱', puppy: '🐶', rabbit: '🐰', fox: '🦊', panda: '🐼', tiger: '🐯', koala: '🐨', hamster: '🐹', lion: '🦁' };
      const STICKER_MAP = { heart: '❤️', star: '⭐', fire: '🔥', clover: '🍀', sparkle: '✨', crown: '👑' };
      const THEME_MAP = { default: '#8B6CFF', mint: '#2DD4A0', peach: '#FF8C4B', pink: '#FF6B8A', yellow: '#FFC61C', blue: '#5BA9FF' };
      const AVATAR_LIST = ['🐻','🐱','🐶','🐰','🦊','🐼','🐯','🐨','🐹','🦁'];

      const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"']/g, c => ESC_MAP[c]);
      }

      function hashNameToAvatar(name) {
        if (!name) return '🐻';
        let h = 0;
        for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
        return AVATAR_LIST[Math.abs(h) % AVATAR_LIST.length];
      }

      function showToast(msg) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(window._toastTimer);
        window._toastTimer = setTimeout(() => { toast.classList.remove('show'); }, 2000);
      }

      function copyText(text, successMsg, pts = 0) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        if (pts > 0) {
          state.user.points += pts;
          saveState();
        }
        showToast(successMsg || '복사되었습니다!');
        render();
      }

      window.sendInvite = function(channel) {
        const link = `https://keongyu.app/invite?code=USER_${state.user.invites}`;
        if (channel === '링크' && navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(link).catch(() => {});
        }
        state.user.invites += 1;
        state.user.points += 25;
        saveState();
        showToast(`${channel}로 초대장을 보냈어요! ⭐+25 적립`);
        render();
      };

      // ==========================================
      // 1. Initial State Model
      // ==========================================
      const DEFAULT_ROUTES = [
        {
          id: 'r1',
          title: '성수 감성 붉은벽돌 카페 & 디저트 투어',
          purpose: '감성카페',
          tags: ['#성수', '#디저트', '#포토존'],
          distance: '1.4km',
          time: '45분',
          budget: '1.8만원',
          likes: 420,
          creator: '성수러버민지',
          isPublic: true,
          isMine: false,
          image: null,

          if (!r.participants) r.participants = [];

        const oldCheckins = state.user.followCheckins || {};

          const migratedKey = key.endsWith('_' + state.user.name) ? key : key + '_' + state.user.name;

      // Upload method A: Photos
      const IMAGE_MAX_DIM = 800;
      const IMAGE_QUALITY = 0.7;

      // Downscales a picked file to at most IMAGE_MAX_DIM per side and re-encodes as JPEG
      // so localStorage doesn't fill up with full-resolution phone photos.
      function resizeImageFile(file) {
        return new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = evt => {
            const img = new Image();
            img.onload = () => {
              let { width, height } = img;
              if (width > IMAGE_MAX_DIM || height > IMAGE_MAX_DIM) {
                if (width > height) {
                  height = Math.round(height * (IMAGE_MAX_DIM / width));
                  width = IMAGE_MAX_DIM;
                } else {
                  width = Math.round(width * (IMAGE_MAX_DIM / height));
                  height = IMAGE_MAX_DIM;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = width;
              canvas.height = height;
              canvas.getContext('2d').drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', IMAGE_QUALITY));
            };
            img.onerror = () => resolve(evt.target.result);
            img.src = evt.target.result;
          };
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });
      }

          showToast(`${files.length}장의 사진을 분석 중입니다... 🪄`);
          Promise.all(files.map(resizeImageFile)).then(dataUrls => {

      window.startLiveCamera = async function() {
        const video = document.getElementById('camera-video');
        if (!video || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          fallbackCamera();
          return;
        }
        try {
          if (window._mediaStream) {
            window._mediaStream.getTracks().forEach(t => t.stop());
          }
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: state.ui.cameraFacing || 'environment' }
          });
          window._mediaStream = stream;
          video.srcObject = stream;
          video.play();
        } catch (err) {

        }

      window.fallbackCamera = function() {
        showToast('카메라 스트림 권한 대신 파일 캡처 모드로 전환합니다.');

      window.captureFrame = function() {
        const video = document.getElementById('camera-video');
        if (!video || !video.videoWidth) {
          showToast('카메라가 아직 준비되지 않았어요. 잠시 후 다시 시도해주세요.');
          return;
        }
        const srcWidth = video.videoWidth || 640;
        const srcHeight = video.videoHeight || 480;
        let width = srcWidth;
        let height = srcHeight;
        if (width > IMAGE_MAX_DIM || height > IMAGE_MAX_DIM) {
          if (width > height) {
            height = Math.round(height * (IMAGE_MAX_DIM / width));
            width = IMAGE_MAX_DIM;
          } else {
            width = Math.round(width * (IMAGE_MAX_DIM / height));
            height = IMAGE_MAX_DIM;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', IMAGE_QUALITY);
        state.tempImages.push(dataUrl);
        showToast(`인증샷 ${state.tempImages.length}장이 캡처되었습니다! 📸`);

          showToast(`선물하기 위한 별사탕이 부족해요! ⭐ 충전소를 이용해주세요.`);
          return;
        }
        state.user.points -= cost;
        saveState();
        const link = `keongyu.app/gift/${category}_${key}?from=${encodeURIComponent(state.user.name)}`;
        copyText(link, '선물 링크가 복사됐어요! 친구에게 전달해보세요 🎁', 0);
      };

      window.chargePoints = function(amount, won) {
        state.user.points += amount;
        saveState();
        showToast(`${won} 결제 완료! 별사탕 ${amount}개가 충전되었습니다. ⭐`);
        render();
      };

      // 충전소: 팩 + 결제수단 선택 후 "결제하기"로 확정하는 2단계 플로우
      window.selectChargePack = function(amount, won) {
        state.ui.charge.pack = { amount, won };
        render();
      };

      window.selectChargeMethod = function(method) {
        state.ui.charge.method = method;
        render();
      };

      window.confirmCharge = function() {
        const { pack, method } = state.ui.charge;
        if (!pack || !method) {
          showToast('충전 금액과 결제수단을 모두 선택해주세요.');
          return;
        }
        chargePoints(pack.amount, pack.won);
        showToast(`${method}로 ${pack.won} 결제 완료! 별사탕 ${pack.amount}개가 충전되었습니다. ⭐`);
        state.ui.charge = { pack: null, method: null };
        state.ui.bottomSheet = null;
        saveState();
        render();
      };

      // 미션 기반 무료 언락: 특정 조건 달성 시 지정된 아이템을 무료로 지급
      const MISSION_DEFS = [
        { id: 'invite15', category: 'theme', key: 'peach', label: '친구 15명 초대', current: () => state.user.invites, target: 15 },
        { id: 'complete3', category: 'avatar', key: 'fox', label: '루트 3회 완주', current: () => state.user.completedRoutes.length, target: 3 }
      ];

      function getMissionForItem(category, key) {
        return MISSION_DEFS.find(m => m.category === category && m.key === key) || null;
      }

      window.claimMissionItem = function(category, key) {
        const mission = getMissionForItem(category, key);
        if (!mission || mission.current() < mission.target) return;
        if (state.custom.owned[category].includes(key)) return;
        state.custom.owned[category].push(key);
        state.custom.equipped[category] = key;
        saveState();
        showToast(`🎁 미션 달성! ${mission.label} 보상을 받았어요.`);
        render();
      };

      // 주간 챌린지: 오늘 인증 버튼 + 3/3 달성 시 랜덤 스티커 보상
      window.todayChallengeCheck = function() {
        const today = new Date().toDateString();
        if (state.challenge.todayCheck === today) {
          showToast('오늘은 이미 인증했어요! 내일 다시 와주세요.');
          return;
        }
        state.challenge.todayCheck = today;
        state.challenge.progress = Math.min(3, state.challenge.progress + 1);
        saveState();
        showToast('오늘 인증 완료! +1');
        render();
      };

      window.claimChallengeReward = function() {
        if (state.challenge.progress < 3 || state.challenge.completed) return;
        const unowned = Object.keys(STICKER_MAP).filter(k => !state.custom.owned.sticker.includes(k));
        const pick = (unowned.length ? unowned : Object.keys(STICKER_MAP))[Math.floor(Math.random() * (unowned.length ? unowned.length : Object.keys(STICKER_MAP).length))];
        if (!state.custom.owned.sticker.includes(pick)) state.custom.owned.sticker.push(pick);
        state.challenge.completed = true;
        saveState();
        showToast(`🎁 랜덤 스티커 ${STICKER_MAP[pick]} 획득!`);
        render();
      };

      // ==========================================
      // 4b. Collaborative Planning (함께가기)
      // ==========================================
      window.openCollabSheet = function(routeId) {
        state.ui.collabSheet = { routeId };
        render();
      };

      // Participant shape: {id, name, avatar, role: 'editor'|'viewer', isMe, isOnline, joinedAt}
      function makeParticipant(name, isMe) {
        return {
          id: isMe ? 'p_me' : 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name,
          avatar: getAvatarDisplay(name),
          role: 'editor',
          isMe: !!isMe,
          isOnline: true,
          joinedAt: Date.now()
        };
      }

      // A viewer can follow along and GPS check-in but cannot edit/add/delete steps.
      function canEdit(routeId) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route || !route.isCollaborative) return true;
        const me = (route.participants || []).find(p => p.name === state.user.name);
        return !me || me.role !== 'viewer';
      }

      window.addParticipant = function(routeId, name) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        if (!route.participants || route.participants.length === 0) {
          route.participants = [makeParticipant(state.user.name, true)];
        }
        if (route.participants.some(p => p.name === name)) return;
        route.participants.push(makeParticipant(name, false));
        route.isCollaborative = true;
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: name, avatar: getAvatarDisplay(name), action: '참여했어요', time: '방금' });
        saveState();
        render();
      };

      window.removeParticipant = function(routeId, name) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route || !route.participants) return;
        route.participants = route.participants.filter(p => p.name !== name);
        saveState();
        showToast(`${name}님을 내보냈습니다.`);
        render();
      };

      window.toggleParticipantRole = function(routeId, name) {
        const route = state.routes.find(r => r.id === routeId);
        const p = route && (route.participants || []).find(p => p.name === name);
        if (!p) return;
        p.role = p.role === 'viewer' ? 'editor' : 'viewer';
        saveState();
        showToast(`${name}님을 ${p.role === 'viewer' ? '뷰어' : '편집자'}로 변경했어요`);
        render();
      };

      window.generateCollabInvite = function(routeId) {
        const input = document.getElementById('collab-invite-name');
        const name = (input && input.value.trim()) || '친구';
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        const code = Math.random().toString(36).slice(2, 6);
        if (!route.pendingInvites) route.pendingInvites = [];
        route.pendingInvites.push({ code, name, createdAt: Date.now() });
        const link = `keongyu.app/join/${routeId}?code=${code}`;
        copyText(link, '초대 링크 복사됨! 👥', 8);
        if (input) input.value = '';
        // Demo simulation: friend "joins" a couple seconds after the invite link is copied.
        setTimeout(() => addParticipant(routeId, name), 2000);
      };

      // 카카오톡 친구 선택 → 선택된 친구를 함께가기 참여자로 바로 추가
      window.inviteFriendsWithKakao = function(routeId) {
        if (!window.Kakao || !Kakao.isInitialized()) {
          showToast('카카오 SDK가 초기화되지 않았어요.');
          return;
        }
        if (!Kakao.Picker || typeof Kakao.Picker.selectFriends !== 'function') {
          showToast('이 환경에서는 카카오톡 친구 선택을 사용할 수 없어요.');
          return;
        }
        Kakao.Picker.selectFriends({ title: '함께 갈 친구 선택', maxPickableCount: 5 })
          .then(res => {
            const friends = (res && res.users) || [];
            if (!friends.length) return;
            friends.forEach(f => addParticipant(routeId, f.displayName || f.nickname || '카카오친구'));
            showToast(`${friends.length}명을 초대했어요! 👥`);
          })
          .catch(() => {
            showToast('카카오 친구 선택에 실패했어요. 카카오 로그인이 필요할 수 있어요.');
          });
      };

      window.startCollab = function(routeId) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        if (!route.participants || route.participants.length === 0) {
          route.participants = [makeParticipant(state.user.name, true)];
        }
        route.isCollaborative = true;
        state.ui.tab = 'myRoutes';
        state.ui.collabSheet = null;
        saveState();
        showToast('함께가기 계획이 시작됐어요!');
        render();
      };

      window.updateStep = function(routeId, stepIdx, newData) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        route.steps[stepIdx] = { ...route.steps[stepIdx], ...newData };
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: state.user.name, avatar: getAvatarDisplay(state.user.name), action: `수정: ${newData.name}`, time: '방금' });
        saveState();
        render();
        showToast('수정됐어요 ✏️');
      };

      window.deleteStep = function(routeId, stepIdx) {
        if (!canEdit(routeId)) {
          showToast('뷰어는 수정할 수 없어요 👀');
          return;
        }
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        if (route.steps.length <= 1) {
          showToast('최소 한 개의 스텝은 남아있어야 해요.');
          return;
        }
        if (!confirm('이 스텝을 삭제할까요?')) return;
        const removed = route.steps.splice(stepIdx, 1)[0];
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: state.user.name, avatar: getAvatarDisplay(state.user.name), action: `삭제: ${removed.name}`, time: '방금' });
        if (state.ui.followStep >= route.steps.length) state.ui.followStep = route.steps.length - 1;
        saveState();
        render();
        showToast('스텝이 삭제됐어요 🗑️');
      };

      window.addStep = function(routeId, afterIdx, newStep) {
        const route = state.routes.find(r => r.id === routeId);
        if (!route) return;
        route.steps.splice(afterIdx + 1, 0, newStep);
        if (!route.editLog) route.editLog = [];
        route.editLog.unshift({ user: state.user.name, avatar: getAvatarDisplay(state.user.name), action: `추가: ${newStep.name}`, time: '방금' });
        saveState();
        render();
      };

      window.openCollabEditSheet = function(routeId, stepIndex) {
        if (!canEdit(routeId)) {
          showToast('뷰어는 수정할 수 없어요 👀');
          return;
        }
        state.ui.collabEditSheet = { routeId, stepIndex, mode: 'edit' };
        render();
      };

      window.openAddStepSheet = function(routeId, afterIdx) {
        if (!canEdit(routeId)) {
          showToast('뷰어는 수정할 수 없어요 👀');
          return;
        }
        state.ui.collabEditSheet = { routeId, stepIndex: null, mode: 'add', afterIdx };
        render();
      };

      window.saveStepForm = function() {
        const sheet = state.ui.collabEditSheet;
        if (!sheet) return;
        if (!canEdit(sheet.routeId)) {
          showToast('뷰어는 수정할 수 없어요 👀');
          state.ui.collabEditSheet = null;
          render();
          return;
        }
        const name = document.getElementById('step-form-name')?.value.trim();
        const address = document.getElementById('step-form-address')?.value.trim();
        const memo = document.getElementById('step-form-memo')?.value.trim();
        if (!name) {
          showToast('장소명을 입력해주세요.');
          return;
        }
        if (sheet.mode === 'add') {
          addStep(sheet.routeId, sheet.afterIdx, { type: '경유', name, address: address || '', cost: '0원', memo: memo || '' });
        } else {
          updateStep(sheet.routeId, sheet.stepIndex, { name, address: address || '', memo: memo || '' });
        }
        state.ui.collabEditSheet = null;
        saveState();
        render();
      };

      window.shareCollabLink = function(routeId) {
        const link = `keongyu.app/join/${routeId}`;
        copyText(link, '함께가기 참여 링크가 복사되었습니다! 👥', 8);
      };

      // ==========================================
      // 5. Render Engine (Preserving Input UX)
      // ==========================================
      function render() {
        // 1. Preserve active input focus & selection
        const activeEl = document.activeElement;
        const activeId = activeEl ? activeEl.id : null;
        const selStart = activeEl && ('selectionStart' in activeEl) ? activeEl.selectionStart : null;
        const selEnd = activeEl && ('selectionEnd' in activeEl) ? activeEl.selectionEnd : null;

        // 2. Set theme color
        const themeColor = THEME_MAP[state.custom.equipped.theme] || '#8B6CFF';
        document.documentElement.style.setProperty('--primary', themeColor);

        // 2b. Lock background scroll while a sheet/overlay covers the screen
        // (prevents the page behind a bottom sheet from rubber-banding on mobile).
        const anyOverlayOpen = !!(state.ui.bottomSheet || state.ui.collabSheet || state.ui.collabEditSheet || state.ui.cameraActive || state.ui.followRouteId);
        document.body.style.overflow = anyOverlayOpen ? 'hidden' : '';

        // 3. Count unread notifications
        const unreadCount = state.notifications.filter(n => !n.read).length;

        // User Tier
        const myTier = getCreatorTier(state.user.name);

        const root = document.getElementById('root');
        if (!root) return;

        let html = '';

        // Header
        html += `
          <header>
            <div class="logo-box" onclick="setTab('explore')">
              <span>KEONGYU</span>
              <span style="font-size:12px; color:var(--text-sub); font-weight:700;">경유</span>
            </div>
            <div class="header-right">
              <div class="point-chip" onclick="openChargeModal()">
                <span>⭐</span>
                <span>${state.user.points}</span>
              </div>
              <div class="icon-btn" onclick="openNotifInbox()">
                <span>🔔</span>
                ${unreadCount > 0 ? `<div class="badge-dot">${unreadCount}</div>` : ''}
              </div>
              <div class="avatar-wrapper" onclick="setTab('myRoutes')" style="border:${myTier.border}; cursor:pointer; width:34px; height:34px;">
                <span>${AVATAR_MAP[state.custom.equipped.avatar] || '🐻'}</span>
                <span class="sticker-badge">${STICKER_MAP[state.custom.equipped.sticker] || '❤️'}</span>
              </div>
              <button class="upload-btn" onclick="openUploadSheet()">
                <span>+</span><span>업로드</span>
              </button>
            </div>
          </header>
        `;

        // Main Body by Tab
        html += `<main class="content-area">`;

        if (state.ui.tab === 'explore') {
          // 1. Growth Banner
          html += `
            <div class="banner" onclick="setTab('growth')">
              <div>
                <div style="font-size:14px; font-weight:800;">친구 초대하면 스티커 3종 🎁</div>
                <div style="font-size:11px; opacity:0.9; margin-top:2px;">링크 공유하고 별사탕과 한정 스티커 받기</div>
              </div>
              <div style="font-size:18px;">➔</div>
            </div>
          `;

          // 2. Search Box
          html += `
            <div class="search-box">
              <span class="icon">🔍</span>
              <input type="text" id="search-input" placeholder="스팟, 카페, 목적, 태그 검색..." value="${esc(state.filter.query)}" oninput="onSearchInput(event)" oncompositionstart="onSearchCompositionStart(event)" oncompositionend="onSearchCompositionEnd(event)" />
            </div>
          `;

          // 3. Filter Scroll
          const purposes = ['⭐ 구독', '전체', '감성카페', '힐링·산책', '데이트', '작업·몰입', '야경·드라이브', '가성비'];
          html += `<div class="filter-scroll">`;
          purposes.forEach(p => {
            const isSub = p === '⭐ 구독';
            const isActive = state.filter.purpose === p;
            html += `
              <div class="filter-chip ${isSub ? 'sub-chip' : ''} ${isActive ? 'active' : ''}" onclick="setPurposeFilter('${p}')">
                ${p}
              </div>
            `;
          });
          html += `</div>`;

          // 4. Routes List Filtering
          let filtered = state.routes.filter(r => {
            if (state.filter.purpose === '⭐ 구독') {
              if (!state.subscriptions[r.creator]?.subscribed) return false;
            } else if (state.filter.purpose !== '전체') {
              if (r.purpose !== state.filter.purpose) return false;
            }
            if (state.filter.query) {
              const q = state.filter.query.toLowerCase();
              const matchTitle = r.title.toLowerCase().includes(q);
              const matchCreator = r.creator.toLowerCase().includes(q);
              const matchTags = (r.tags || []).some(t => t.toLowerCase().includes(q));
              const matchSteps = (r.steps || []).some(s => s.name.toLowerCase().includes(q) || s.memo.toLowerCase().includes(q));
              if (!matchTitle && !matchCreator && !matchTags && !matchSteps) return false;
            }
            return true;
          });

          if (filtered.length === 0) {
            html += `
              <div style="text-align:center; padding:50px 20px; color:var(--text-sub); background:#FFF; border-radius:18px; border:1px solid var(--border);">
                <div style="font-size:36px; margin-bottom:10px;">🍃</div>
                <div style="font-weight:800; font-size:15px; margin-bottom:6px;">조건에 맞는 루트가 없어요</div>
                <div style="font-size:12px; margin-bottom:14px;">${state.filter.purpose === '⭐ 구독' ? '크리에이터를 구독하면 새 루트가 피드에 나타나요!' : '검색어를 변경하거나 필터를 초기화해보세요.'}</div>
                <button class="cta-btn" onclick="resetFilters()">전체 루트 보기</button>
              </div>
            `;
          } else {
            filtered.forEach(r => {
              const tier = getCreatorTier(r.creator);
              const isSub = !!state.subscriptions[r.creator]?.subscribed;
              const notifType = state.subscriptions[r.creator]?.notif || 'all';
              const bellIcon = notifType === 'none' ? '🔕' : notifType === 'personal' ? '🔔' : '🔔';
              const bellColor = notifType === 'none' ? '#999' : notifType === 'personal' ? '#FFC61C' : 'var(--primary)';

              html += `
                <div class="route-card">
                  <div class="card-top">
                    <div style="display:flex; align-items:center; gap:6px;">
                      <span class="purpose-pill">${r.purpose}</span>
                      ${r.isCollaborative ? `<span class="collab-pill">👥 함께가는 중 (${(r.participants || []).length}명)</span>` : ''}
                    </div>
                    <button class="like-btn" onclick="toggleLike('${r.id}')">
                      <span>❤️</span>
                      <span>${r.likes || 0}</span>
                    </button>
                  </div>
                  <div class="card-title">${esc(r.title)}</div>
                  <div class="card-pills">
                    <span class="info-pill">📍 ${r.distance}</span>
                    <span class="info-pill">⏱️ ${r.time}</span>
                    <span class="info-pill">💰 ${r.budget}</span>
                    ${(r.tags || []).map(t => `<span class="info-pill" style="color:var(--primary);">${t}</span>`).join('')}
                  </div>
                  ${renderRouteThumb(r, 140)}
                  <div class="card-bottom">
                    <div class="creator-info">
                      <div class="avatar-wrapper" style="border:${tier.border}; ${tier.glow !== 'none' ? `box-shadow:${tier.glow};` : ''}">
                        <span>${getAvatarDisplay(r.creator)}</span>
                        <span class="sticker-badge">${getStickerDisplay(r.creator)}</span>
                      </div>
                      <div>
                        <div style="font-size:13px; font-weight:800; display:flex; align-items:center; gap:2px;">
                          <span>${esc(r.creator)}</span>
                          <span style="font-size:11px;">${tier.icon}</span>
                          ${tier.ribbon ? `<span class="ribbon-tag" title="인증 크리에이터">🎗️</span>` : ''}
                        </div>
                      </div>
                    </div>
                    <div class="card-actions">
                      ${r.creator !== state.user.name ? `
                        <button class="sub-btn ${isSub ? 'subscribed' : ''}" data-creator="${esc(r.creator)}" onclick="toggleSubscribe(this.dataset.creator)">
                          ${isSub ? '구독중' : '구독'}
                        </button>
                        ${isSub ? `
                          <button class="icon-btn" style="width:30px; height:30px; font-size:13px; color:${bellColor};" data-creator="${esc(r.creator)}" onclick="openNotifSetting(this.dataset.creator)" title="알림 설정">
                            ${bellIcon}
                          </button>
                        ` : ''}
                      ` : `
                        <span style="font-size:11px; font-weight:700; color:var(--primary); background:#F0F0FF; padding:3px 8px; border-radius:12px;">내 루트</span>
                      `}
                      <button class="icon-btn" style="width:30px; height:30px; font-size:13px;" onclick="openShareSheet('${r.id}')" title="공유">
                        ↗
                      </button>
                      <button class="btn-secondary" onclick="openCollabSheet('${r.id}')">👥 함께가기</button>
                      <button class="cta-btn" onclick="startFollowRoute('${r.id}')">
                        따라가기
                      </button>
                    </div>
                  </div>
                </div>
              `;
            });
          }
        } else if (state.ui.tab === 'myRoutes') {
          // My Routes Tab
          const myRoutes = state.routes.filter(r => r.isMine);
          const collabRoutes = state.routes.filter(r => r.isCollaborative);
          const totalLikes = myTier.likes;
          const nextTarget = myTier.next ? myTier.next - totalLikes : 0;
          const subscribedList = Object.keys(state.subscriptions).filter(k => state.subscriptions[k].subscribed);

          html += `
            ${collabRoutes.length > 0 ? `

              <div class="bottom-sheet" onclick="event.stopPropagation()">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="font-size:16px; font-weight:900;">⭐ 별사탕 충전소</div>
                  <button class="icon-btn" onclick="closeSheet()">✕</button>
                </div>

                <div style="display:flex; flex-direction:column; gap:10px;">
                  ${[
                    { amount: 100, won: '1,000원', label: '⭐ 100개', tag: '기본 팩', tagColor: '#999' },
                    { amount: 360, won: '3,000원', label: '⭐ 330개 + 30개 보너스', tag: '인기 팩', tagColor: 'var(--primary)' },
                    { amount: 700, won: '5,000원', label: '⭐ 600개 + 100개 보너스', tag: '추천 팩', tagColor: '#E68A00' },
                    { amount: 1600, won: '10,000원', label: '⭐ 1,300개 + 300개 보너스', tag: '대용량 팩', tagColor: '#FF4242' }
                  ].map(p => {
                    const selected = state.ui.charge.pack && state.ui.charge.pack.amount === p.amount;
                    return `
                      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border:1.5px solid ${selected ? 'var(--primary)' : 'var(--border)'}; border-radius:14px; background:${selected ? 'rgba(139,108,255,0.05)' : '#FFF'}; cursor:pointer;" onclick="selectChargePack(${p.amount}, '${p.won}')">
                        <div>
                          <div style="font-weight:800; font-size:14px;">${p.label}</div>
                          <div style="font-size:11px; color:${p.tagColor}; font-weight:700;">${p.tag}</div>
                        </div>
                        <div style="font-size:13px; font-weight:800; color:${selected ? 'var(--primary)' : 'var(--text)'};">${selected ? '✓ 선택됨' : p.won}</div>
                      </div>
                    `;
                  }).join('')}
                </div>

                <div>
                  <div style="font-size:12px; font-weight:800; margin:4px 0 8px;">결제수단</div>
                  <div style="display:flex; gap:8px;">
                    ${['카드', '카카오페이', '휴대폰'].map(m => `
                      <div class="filter-chip ${state.ui.charge.method === m ? 'active' : ''}" style="flex:1; text-align:center;" onclick="selectChargeMethod('${m}')">${m}</div>
                    `).join('')}
                  </div>
                </div>

                <button class="cta-btn" style="padding:12px; font-size:14px; opacity:${(state.ui.charge.pack && state.ui.charge.method) ? '1' : '0.5'};" ${(state.ui.charge.pack && state.ui.charge.method) ? '' : 'disabled'} onclick="confirmCharge()">결제하기</button>
              </div>
            </div>
          `;
        }

        // J. Collaborative Planning Sheet (함께가기 설정)
        if (state.ui.collabSheet) {
          const cRoute = state.routes.find(r => r.id === state.ui.collabSheet.routeId);
          const cParticipants = (cRoute && cRoute.participants && cRoute.participants.length)
            ? cRoute.participants
            : [makeParticipant(state.user.name, true)];
          html += `
            <div class="sheet-backdrop" onclick="closeSheet()">
              <div class="bottom-sheet" onclick="event.stopPropagation()">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="font-size:16px; font-weight:900;">함께 계획하기</div>
                  <button class="icon-btn" onclick="closeSheet()">✕</button>
                </div>

                <div>
                  <div style="font-size:13px; font-weight:800; margin-bottom:8px;">참여자 (${cParticipants.length})</div>
                  <div style="display:flex; flex-direction:column; gap:8px;">
                    ${cParticipants.map(p => `
                      <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:#F9F9F8; border-radius:12px;">
                        <div style="display:flex; align-items:center; gap:8px;">
                          <div style="position:relative;">
                            <div class="avatar-wrapper" style="width:32px; height:32px; font-size:16px;">${p.avatar || hashNameToAvatar(p.name)}</div>
                            <div style="position:absolute; bottom:0; right:0; width:9px; height:9px; border-radius:50%; background:${p.isOnline ? 'var(--mint)' : '#CCC'}; border:2px solid #FFF;"></div>
                          </div>
                          <span style="font-size:13px; font-weight:700;">${esc(p.name)}${p.name === state.user.name ? ' (나)' : ''}</span>
                        </div>
                        ${p.name !== state.user.name ? `
                          <div style="display:flex; align-items:center; gap:6px;">
                            <span class="step-mini-btn" style="cursor:pointer;" data-route-id="${esc(cRoute.id)}" data-name="${esc(p.name)}" onclick="toggleParticipantRole(this.dataset.routeId, this.dataset.name)">${p.role === 'viewer' ? '👀 뷰어' : '✏️ 편집자'}</span>
                            <button class="icon-btn" style="width:26px; height:26px; font-size:11px;" data-route-id="${esc(cRoute.id)}" data-name="${esc(p.name)}" onclick="removeParticipant(this.dataset.routeId, this.dataset.name)">✕</button>
                          </div>
                        ` : ''}
                      </div>
                    `).join('')}
                  </div>
                </div>

                <div>
                  <div style="font-size:13px; font-weight:800; margin-bottom:8px;">친구 초대</div>
                  <button class="btn-secondary" style="width:100%; background:#FEE500; color:#3C1E1E; margin-bottom:8px;" onclick="inviteFriendsWithKakao('${cRoute.id}')">💬 카카오톡 친구 선택해서 초대</button>
                  <div style="display:flex; gap:8px;">
                    <input type="text" id="collab-invite-name" placeholder="친구 이름 입력 (또는 링크로 초대)" style="flex:1; border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:13px;" />
                    <button class="btn-secondary" onclick="generateCollabInvite('${cRoute.id}')">초대 링크 생성</button>
                  </div>
                </div>

                <button class="cta-btn" style="padding:12px; font-size:14px;" onclick="startCollab('${cRoute.id}')">함께가기 시작</button>

                <div style="font-size:11px; color:#999; text-align:center;">함께가기에서는 장소를 함께 추가/수정하고, 각자 GPS 인증을 할 수 있어요</div>
              </div>
            </div>
          `;
        }

        // K. Collaborative Step Edit/Add Sheet
        if (state.ui.collabEditSheet) {
          const eSheet = state.ui.collabEditSheet;
          const eRoute = state.routes.find(r => r.id === eSheet.routeId);
          const eStep = eSheet.mode === 'edit' && eRoute ? eRoute.steps[eSheet.stepIndex] : null;
          html += `
            <div class="sheet-backdrop" onclick="closeSheet()">
              <div class="bottom-sheet" onclick="event.stopPropagation()">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="font-size:16px; font-weight:900;">${eSheet.mode === 'add' ? '장소 추가' : '장소 수정'}</div>
                  <button class="icon-btn" onclick="closeSheet()">✕</button>
                </div>
                <input type="text" id="step-form-name" placeholder="장소명" value="${eStep ? esc(eStep.name) : ''}" style="border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:13px;" />
                <input type="text" id="step-form-address" placeholder="주소" value="${eStep ? esc(eStep.address) : ''}" style="border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-size:13px;" />
                <textarea id="step-form-memo" placeholder="메모" style="width:100%; height:60px; border-radius:12px; border:1px solid var(--border); padding:10px; font-size:13px; resize:none;">${eStep ? esc(eStep.memo) : ''}</textarea>
                <button class="cta-btn" style="padding:12px; font-size:14px;" onclick="saveStepForm()">저장</button>
              </div>
            </div>
          `;
        }

        root.innerHTML = html;

        // 4a. Turnstile 봇 방지 위젯: 업로드/후기 시트가 열려있을 때만 표시 (#turnstile-widget은
        // #root 밖에 있어 이 innerHTML 교체로 파괴되지 않으므로 매 render마다 안전하게 체크 가능).
        if (state.ui.bottomSheet === 'upload' || state.ui.bottomSheet === 'finishCertification') {
          showTurnstile();
        } else {
          hideTurnstile();
        }

        // 4b. Reattach live camera stream (innerHTML replacement drops the <video> element's srcObject)
        if (state.ui.cameraActive && window._mediaStream) {
          const cameraVideo = document.getElementById('camera-video');
          if (cameraVideo && cameraVideo.srcObject !== window._mediaStream) {
            cameraVideo.srcObject = window._mediaStream;
            cameraVideo.play().catch(() => {});
          }
        }

        // 4. Restore active input focus and cursor position smoothly
        if (activeId) {
          const restoredEl = document.getElementById(activeId);
          if (restoredEl) {
            restoredEl.focus();
            if (selStart !== null && selEnd !== null && typeof restoredEl.setSelectionRange === 'function') {
              try { restoredEl.setSelectionRange(selStart, selEnd); } catch (e) {}
            }
          }
        }
      }

      // Esc closes whatever sheet/overlay is currently on top.
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        if (state.ui.bottomSheet || state.ui.collabSheet || state.ui.collabEditSheet || state.ui.cameraActive) {
          closeSheet();
        } else if (state.ui.followRouteId) {
          closeFollowRoute();
        }
      });

      // Initial Render
      window.addEventListener('DOMContentLoaded', () => {
        render();
        // Optional demo notification after 5 seconds to showcase YouTube-style real-time simulation
        setTimeout(() => {
          if (state.notifications.length < 4) {
            simulateNewRouteNotif();
          }
        }, 5000);
      });
    </script>
  </body>
</html>
