                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:16px; font-weight:900;">이메일로 시작하기</div>
                    ${canClose ? `<button class="icon-btn" onclick="closeSheet()">✕</button>` : ''}
                  </div>
                  <input type="email" id="login-email-input" placeholder="you@example.com" value="${esc(ls.email)}" oninput="setLoginEmail(event)" style="border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px;" />
                  ${ls.codeSent ? `
                    <input type="text" id="login-email-code" placeholder="6자리 인증코드" maxlength="6" style="border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:14px; letter-spacing:4px;" />
                    <div style="display:flex; gap:8px;">
                      <button class="login-sub-btn" style="flex:1; border-radius:14px; padding:10px; font-weight:800; font-size:13px; opacity:${ls.sending ? '0.5' : '1'};" ${ls.sending ? 'disabled' : ''} onclick="sendLoginCode()">${ls.sending ? '발송 중...' : '코드 재발송'}</button>
                      <button class="cta-btn" style="flex:1; padding:10px; font-size:13px; opacity:${ls.verifying ? '0.5' : '1'};" ${ls.verifying ? 'disabled' : ''} onclick="verifyLoginCode()">${ls.verifying ? '확인 중...' : '로그인'}</button>
                    </div>
                  ` : `
                    <button class="cta-btn" style="padding:12px; font-size:14px; opacity:${ls.sending ? '0.5' : '1'};" ${ls.sending ? 'disabled' : ''} onclick="sendLoginCode()">${ls.sending ? '발송 중...' : '코드 발송'}</button>
                  `}
                  <button style="background:none; border:none; color:var(--text-sub); font-size:12px; cursor:pointer; padding:4px 0;" onclick="openLoginSheet('initial')">← 다른 방법으로 시작하기</button>
                </div>
              </div>
            `;
          } else {
            html += `
              <div class="sheet-backdrop" ${canClose ? `onclick="closeSheet()"` : ''}>
                <div class="${bottomSheetClass}" onclick="event.stopPropagation()" style="text-align:center; gap:16px;">
                  ${canClose ? `<div style="display:flex; justify-content:flex-end;"><button class="icon-btn" onclick="closeSheet()">✕</button></div>` : ''}
                  <div>
                    <div style="font-size:20px; font-weight:900;">경유 시작하기</div>
                    <div style="font-size:12px; color:var(--text-sub); margin-top:4px;">KEONGYU 🚶</div>
                  </div>
                  <button class="login-main-btn" onclick="loginWithKakao()">💬 카카오로 시작하기</button>
                  <button class="login-sub-btn" style="border-radius:14px; padding:14px; font-weight:800; font-size:14px; width:100%; cursor:pointer;" onclick="openLoginSheet('email')">📧 이메일로 시작하기</button>
                  <button style="background:none; border:none; color:var(--text-sub); font-size:13px; cursor:pointer; padding:4px 0;" onclick="continueAsAnon()">👤 익명으로 둘러보기</button>
                  <div style="font-size:11px; color:#999;">로그인하면 내 루트와 별사탕이 안전하게 보관돼요</div>
                </div>
              </div>
            `;
          }
        }

        // M. Profile Sheet (헤더 포인트칩/아바타 클릭)
        if (state.ui.profileSheet) {
          const myRouteCount = state.routes.filter(r => r.isMine).length;
          const mySubCount = Object.keys(state.subscriptions).filter(k => state.subscriptions[k].subscribed).length;
          const myCollabCount = state.routes.filter(r => r.isCollaborative).length;
          const providerLabel = { kakao: '카카오', email: '이메일', anon: '익명' }[state.user.provider] || '익명';
          html += `
            <div class="sheet-backdrop" onclick="closeSheet()">
              <div class="${bottomSheetClass}" onclick="event.stopPropagation()">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="font-size:16px; font-weight:900;">내 프로필</div>
                  <div style="display:flex; align-items:center; gap:8px;">
                    ${state.user.isLoggedIn ? `<button class="step-mini-btn" onclick="logoutUser()">로그아웃</button>` : ''}
                    <button class="icon-btn" onclick="closeSheet()">✕</button>
                  </div>
                </div>
                <div style="display:flex; flex-direction:column; align-items:center; gap:8px; padding:8px 0;">
                  <div class="avatar-wrapper" style="width:60px; height:60px; font-size:32px;">
                    <span>${esc(state.user.avatar || '🐻')}</span>
                  </div>
                  <div style="font-size:17px; font-weight:900;">${esc(state.user.name)}</div>
                  <span class="provider-badge ${state.user.provider || 'anon'}">${providerLabel}</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; background:#F8F8F6; border-radius:14px; padding:12px 14px;">
                  <span style="font-size:13px; font-weight:800; color:#E68A00;">⭐ 별사탕 ${state.user.points}개</span>
                  <button class="cta-btn" style="padding:6px 12px; font-size:12px;" onclick="openChargeModal()">충전소</button>
                </div>
                <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center;">
                  <div style="padding:10px; background:#F8F8F6; border-radius:12px;">
                    <div style="font-size:15px; font-weight:900;">${myRouteCount}</div>
                    <div style="font-size:11px; color:var(--text-sub);">작성 루트</div>
                  </div>
                  <div style="padding:10px; background:#F8F8F6; border-radius:12px;">
                    <div style="font-size:15px; font-weight:900;">${mySubCount}</div>
                    <div style="font-size:11px; color:var(--text-sub);">구독</div>
                  </div>
                  <div style="padding:10px; background:#F8F8F6; border-radius:12px;">
                    <div style="font-size:15px; font-weight:900;">${myCollabCount}</div>
                    <div style="font-size:11px; color:var(--text-sub);">함께가기</div>
                  </div>
                </div>
                <button class="step-mini-btn" style="width:100%; padding:11px; font-size:13px;" onclick="openHelpSheet()">❓ 도움말 &amp; 이용 팁</button>
                ${!state.user.isLoggedIn ? `
                  <button class="cta-btn" style="background:var(--mint); padding:12px; font-size:14px;" onclick="openLoginSheet('initial')">🔐 로그인하고 데이터 지키기</button>
                ` : ''}
              </div>
            </div>
          `;
        }

        if (state.ui.helpSheet) {
          const helpSections = [
            {
              icon: '🚩',
              title: '루트 만들기',
              tips: [
                '홈 화면 오른쪽 위 "+ 업로드" 버튼으로 새 루트를 시작해요.',
                '테마를 고르고, 목록에 없는 테마는 "기타"를 선택해 직접 입력할 수 있어요.',
                '경유지는 사진·GPS 위치·체류 시간·소개 글까지 함께 기록할 수 있어요.'
              ]
            },
            {
              icon: '🔍',
              title: '루트 탐색 & 검색',
              tips: [
                '검색창에 스팟, 카페, 태그를 입력하면 실시간으로 목록이 좁혀져요.',
                '"📍 근처" 필터를 켜면 내 위치에서 가까운 루트부터 정렬돼요.',
                '검색어나 테마 필터를 바꾼 뒤에는 "↺ 초기화" 칩으로 한 번에 되돌릴 수 있어요.'
              ]
            },
            {
              icon: '👥',
              title: '함께가기',
              tips: [
                '루트 상세에서 "함께 계획하기"로 친구를 초대해 같이 편집할 수 있어요.',
                '카카오톡 친구를 바로 초대하려면 카카오 로그인 + 친구 목록 접근 동의가 필요해요.',
                '초대 링크 복사로도 참여자를 추가할 수 있어요.'
              ]
            },
            {
              icon: '✅',
              title: '현장 인증 (나 인증)',
              tips: [
                `경유지에서 "나 인증"을 누르면 GPS로 실제 도착했는지 확인해요 (반경 ${CHECKIN_MAX_DISTANCE_M}m 이내).`,
                '위치 권한을 허용해야 인증이 가능해요.'
              ]
            },
            {
              icon: '🎨',
              title: '꾸미기',
              tips: [
                '별사탕으로 카드 배경·프레임·스티커 등을 구매해 내 루트 카드를 꾸밀 수 있어요.',
                '조합을 저장해두면 언제든 다시 불러와 적용할 수 있어요.'
              ]
            },
            {
              icon: '⭐',
              title: '별사탕 & 성장',
              tips: [
                '친구 초대, 루트 작성, 좋아요 등으로 별사탕과 등급 포인트를 모을 수 있어요.',
                '"충전소"에서 별사탕을 직접 충전할 수도 있어요.'
              ]
            }
          ];
          html += `
            <div class="sheet-backdrop" onclick="closeSheet()">
              <div class="${bottomSheetClass}" onclick="event.stopPropagation()">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                  <div style="font-size:16px; font-weight:900;">❓ 도움말 &amp; 이용 팁</div>
                  <button class="icon-btn" onclick="closeSheet()">✕</button>
                </div>
                <div style="display:flex; flex-direction:column; gap:14px; margin-top:4px;">
                  ${helpSections.map(sec => `
                    <div style="background:#F8F8F6; border-radius:14px; padding:14px;">
                      <div style="font-size:14px; font-weight:800; display:flex; align-items:center; gap:6px; margin-bottom:8px;">
                        <span>${sec.icon}</span><span>${esc(sec.title)}</span>
                      </div>
                      <ul style="margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px;">
                        ${sec.tips.map(t => `<li style="font-size:12px; color:var(--text-sub); line-height:1.5;">${esc(t)}</li>`).join('')}
                      </ul>
                    </div>
                  `).join('')}
                  <div style="text-align:center; font-size:11px; color:var(--text-sub); padding:4px 0 8px;">
                    더 궁금한 점은 언제든 프로필에서 문의해주세요 💌
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        root.innerHTML = html;

        // 3b. Restore the scroll positions captured above (1b).
        if (savedScrollPositions.some(p => p.top || p.left)) {
          document.querySelectorAll(SCROLL_PRESERVE_SELECTOR).forEach((el, i) => {
            const pos = savedScrollPositions[i];
            if (!pos) return;
            if (pos.top) el.scrollTop = pos.top;
            if (pos.left) el.scrollLeft = pos.left;
          });
        }

        // 4c. 루트 따라가기 화면의 카카오맵 - #route-map-slot이 방금 새로 그려졌으니, 영구 지도
        // 요소를 그 안으로 옮기고 필요할 때만(신호가 바뀌었을 때만) 다시 그린다.
        ensureRouteMap();
        ensureFullscreenRouteMap();

        // 4b. Reattach step-editor camera stream (innerHTML replacement drops the <video> element's srcObject)
        if (state.ui.stopEditor && state.ui.stopEditor.cameraOpen && window._stepMediaStream) {
          const stepCameraVideo = document.getElementById('step-camera-video');
          if (stepCameraVideo && stepCameraVideo.srcObject !== window._stepMediaStream) {
            stepCameraVideo.srcObject = window._stepMediaStream;
            stepCameraVideo.play().catch(() => {});
          }
        }

        // 4. Restore active input focus and cursor position smoothly
        if (activeId) {
          const restoredEl = document.getElementById(activeId);
          if (restoredEl) {
            restoredEl.focus();
            if (selStart !== null && selEnd !== null && typeof restoredEl.setSelectionRange === 'function') {
              try { restoredEl.setSelectionRange(selStart, selEnd); } catch (e) {}
            }
          }
        }
      }

      // 검색창 IME(한글 등) 조합 이벤트: oncompositionstart/oncompositionend는 oninput/onclick과
      // 달리 표준 GlobalEventHandlers 인라인 어트리뷰트가 아니라서(브라우저가 인식 안 함),
      // <input oncompositionstart="..."> 방식은 실제로는 리스너가 전혀 등록되지 않는 죽은
      // 코드였습니다. document에 위임해서 실제로 동작하게 합니다 - render()가 #root를 통째로
      // 교체해 매번 새 <input> 노드가 생겨도 document 리스너는 그대로 유효합니다.
      document.addEventListener('compositionstart', e => {
        if (e.target && e.target.id === 'search-input') onSearchCompositionStart(e);
        // chat-input's oninput never calls render() itself (see sendRouteChatMessage/chatDraft),
        // so it just needs dataset.composing set/cleared for render()'s generic top-of-function
        // guard to skip mid-composition rebuilds triggered by the chat poll timer.
        if (e.target && e.target.id === 'chat-input') e.target.dataset.composing = 'true';
      });
      document.addEventListener('compositionend', e => {
        if (e.target && e.target.id === 'search-input') onSearchCompositionEnd(e);
        if (e.target && e.target.id === 'chat-input') {
          e.target.dataset.composing = 'false';
          state.ui.chatDraft = e.target.value;
        }
      });

      // Closes whichever sheet/overlay is currently on top, same cascade Esc and the mobile
      // back-button both need. Returns true if something was actually closed.
      function closeTopmostOverlay() {
        if (state.ui.loginSheet && !state.user.isLoggedIn) return false; // 최초 로그인 유도는 닫지 않음
        if (state.ui.mapFullscreen) {
          closeFullscreenRouteMap();
        } else if (state.ui.giftSheet) {
          closeGiftSheet();
        } else if (state.ui.photoLightbox && _lightboxZoom.scale > 1) {
          // 확대된 상태에서 뒤로가기/Esc는 사진 보기 자체를 나가지 않고 원래 크기로 축소만 한다.
          // render()가 다시 history entry를 채워 넣으므로(2d), 다음 뒤로가기에서 진짜로 닫힌다.
          resetLightboxZoom();
          render();
        } else if (state.ui.photoLightbox) {
          closePhotoLightbox();
        } else if (state.ui.chatSheet) {
          closeRouteChat();
        } else if (state.ui.stopEditor) {
          closeStopEditor();
        } else if (state.ui.bottomSheet || state.ui.collabSheet || state.ui.collabEditSheet || state.ui.loginSheet || state.ui.profileSheet || state.ui.helpSheet) {
          closeSheet();
        } else if (state.ui.followRouteId) {
          closeFollowRoute();
        } else {
          return false;
        }
        return true;
      }

      // Esc closes whatever sheet/overlay is currently on top.
      document.addEventListener('keydown', e => {
        if (e.key !== 'Escape') return;
        closeTopmostOverlay();
      });

      // Mobile back-button: pressing the hardware/gesture back button while a sheet/overlay is
      // open should close it instead of leaving the app - see the history.pushState/back() pairing
      // in render() (2d) that keeps one fake history entry in sync with "something is open".
      window.addEventListener('popstate', () => {
        _overlayHistoryPushed = false;
        closeTopmostOverlay();
      });

      // Opens the route named by a shared ?route=<id> link (see shareChannel()). Called after
      // syncRoutesFromServer() so a route that only exists server-side (not in the DEFAULT_ROUTES
      // demo seed) is already merged into state.routes by the time this looks it up - without
      // this, following a shared link just silently landed on the plain homepage.
      function openSharedRouteFromUrl() {
        const routeId = new URLSearchParams(window.location.search).get('route');
        if (!routeId) return;
        history.replaceState(null, '', window.location.pathname + window.location.hash);
        if (state.routes.some(r => r.id === routeId)) {
          startFollowRoute(routeId);
        } else {
          showToast('공유된 루트를 찾을 수 없어요. 삭제되었거나 잘못된 링크예요.');
        }
      }

      // Initial Render
      window.addEventListener('DOMContentLoaded', () => {
        // 카카오 authorize() 리다이렉트로 방금 돌아온 경우, 로그인 시트 강제 노출 여부를
        // 판단하기 전에 먼저 로그인 결과를 반영합니다.
        const justLoggedInViaKakao = applyKakaoLoginResult();
        // 방금 로그인한 게 아니어도(평범한 재방문), 저장해둔 토큰이 아직 안 만료됐으면 SDK에
        // 다시 심어서 카카오톡 친구 초대가 바로 동작하게 합니다.
        if (!justLoggedInViaKakao) restoreKakaoAccessTokenIfValid();

        // 모바일에서 카카오페이 결제(REDIRECTION)를 마치고 돌아온 경우 서버 검증 + 잔액 반영.
        applyPaymentRedirectResult();

        // 첫 진입 + 아직 로그인 안 함 + 익명으로 건너뛴 적 없으면 로그인 시트를 띄움 (익명 모드는 여전히 허용).
        let skipLogin = false;
        try { skipLogin = !!localStorage.getItem('keongyu_skip_login'); } catch (e) {}
        if (!justLoggedInViaKakao && !state.user.isLoggedIn && !skipLogin) {
          state.ui.loginSheet = { mode: 'initial', email: '', codeSent: false, sentAt: 0, sending: false, verifying: false };
        }
        render();

        syncRoutesFromServer().then(openSharedRouteFromUrl);
        syncNotificationsFromServer();
        syncSubscriptionsFromServer();
        syncProfileFromServer();
        // Previously only loaded when opening the route-builder/edit sheet - meant the main feed's
        // and my-routes' route-skin decorations (card bg/frame/badges/sticker/weather) only rendered
        // for a session that happened to have visited that screen first (getRouteSkinVisuals() needs
        // state.routeSkinShop.items to resolve a route's skin ids to their rarity/price/emoji). Load
        // it up front so every route card can show its skin from the very first render.
        loadRouteSkinShopIfNeeded();
      });
    </script>
  </body>
</html>
