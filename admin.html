<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KEONGYU Admin</title>
    <style>
      :root {
        --primary: #8B6CFF;
        --mint: #2DD4A0;
        --danger: #FF4242;
        --peach: #FF8C4B;
        --bg: #F5F5F0;
        --card: #FFFFFF;
        --text: #191F28;
        --text-sub: #6B7684;
        --border: #E5E8EB;
        --sidebar: #111111;
        --sidebar-sub: #9A9A9A;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* PC 전용 (1024px 미만은 안내만 표시) */
      #mobile-block { display: none; }
      @media (max-width: 1023px) {
        #admin-shell { display: none; }
        #mobile-block {
          display: flex; min-height: 100vh; align-items: center; justify-content: center;
          flex-direction: column; gap: 10px; text-align: center; padding: 40px;
        }
      }

      #admin-shell { display: flex; min-height: 100vh; min-width: 1024px; }

      /* Sidebar */
      #sidebar {
        width: 220px; flex-shrink: 0; background: var(--sidebar); color: #FFF;
        display: flex; flex-direction: column; padding: 20px 0;
      }
      #sidebar .logo { padding: 0 20px 20px; font-size: 17px; font-weight: 900; }
      #sidebar .logo span { color: var(--primary); }
      #sidebar nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
      #sidebar .nav-item {
        display: flex; align-items: center; gap: 10px; padding: 12px 20px;
        background: none; border: none; color: #C4C4C4; font-size: 13px; font-weight: 700;
        text-align: left; cursor: pointer; width: 100%;
      }
      #sidebar .nav-item:hover { background: rgba(255,255,255,0.05); color: #FFF; }
      #sidebar .nav-item.active { background: rgba(139,108,255,0.18); color: #FFF; border-right: 3px solid var(--primary); }
      #sidebar .sidebar-footer { padding: 14px 20px; font-size: 10px; color: var(--sidebar-sub); border-top: 1px solid #262626; }

      /* Main */
      #main {
        flex: 1; max-width: 1200px; padding: 28px 36px; overflow-x: auto;
      }
      #main h1 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
      #main .subtitle { font-size: 12px; color: var(--text-sub); margin-bottom: 20px; }

      .notice-banner {
        background: #FFF6E5; border: 1px solid #FFE1A8; color: #8A6200; font-size: 12px;
        border-radius: 10px; padding: 10px 14px; margin-bottom: 16px;
      }

      .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
      .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
      .kpi-card .label { font-size: 12px; color: var(--text-sub); font-weight: 700; }
      .kpi-card .value { font-size: 24px; font-weight: 900; margin-top: 6px; }

      .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 20px; }
      .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
      .panel-header h2 { font-size: 15px; font-weight: 900; }

      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; color: var(--text-sub); font-weight: 700; font-size: 11px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
      td { padding: 10px; border-bottom: 1px solid #F2F2F0; vertical-align: middle; }
      tr:last-child td { border-bottom: none; }

      .chip { display: inline-block; background: #F5F5F0; color: var(--text-sub); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; }
      .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 10px; }
      .badge.public { background: rgba(45,212,160,0.15); color: #1D9C77; }
      .badge.private { background: rgba(255,66,66,0.12); color: var(--danger); }
      .badge.normal { background: #EEF; color: #556; }

      .btn { border: none; border-radius: 10px; padding: 6px 12px; font-size: 12px; font-weight: 800; cursor: pointer; }
      .btn-primary { background: var(--primary); color: #FFF; }
      .btn-mint { background: var(--mint); color: #FFF; }
      .btn-danger { background: var(--danger); color: #FFF; }
      .btn-ghost { background: #F0F0EE; color: var(--text); }
      .btn + .btn { margin-left: 6px; }

      .empty-row td { text-align: center; color: #AAA; padding: 30px; font-size: 13px; }

      .settings-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
      .settings-grid input[type="text"], .settings-grid input[type="password"], .settings-grid textarea {
        width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 8px 0;
      }
      .settings-grid textarea { height: 100px; resize: vertical; font-family: inherit; }
      .cf-link { display: block; font-size: 13px; color: var(--primary); font-weight: 700; padding: 6px 0; text-decoration: none; }
      .cf-link:hover { text-decoration: underline; }
      .hint { font-size: 11px; color: #999; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="admin-shell">
      <aside id="sidebar">
        <div class="logo">KEONGYU <span>Admin</span></div>
        <nav id="sidebar-nav">
          <button class="nav-item" data-tab="dashboard">📊 대시보드</button>
          <button class="nav-item" data-tab="routes">🗺️ 루트 관리</button>
          <button class="nav-item" data-tab="reports">🚨 신고 관리</button>
          <button class="nav-item" data-tab="users">👤 사용자 관리</button>
          <button class="nav-item" data-tab="payments">💰 결제/별사탕</button>
          <button class="nav-item" data-tab="collab">👥 함께가기</button>
          <button class="nav-item" data-tab="settings">⚙️ 설정</button>
        </nav>
        <div class="sidebar-footer">Cloudflare D1+R2 v5.1 admin</div>
      </aside>
      <main id="main"></main>
    </div>

    <div id="mobile-block">
      <div style="font-size:32px;">🖥️</div>
      <div style="font-size:16px; font-weight:800;">PC 화면(1024px 이상)에서 이용해주세요</div>
      <div style="font-size:12px; color:#888;">KEONGYU Admin은 관리자용 데스크톱 전용 페이지입니다.</div>
    </div>

    <script>
      // ==========================================
      // 0. Constants
      // ==========================================
      const STORAGE_KEY = 'keongyu_v1'; // 메인 앱(index.html)과 동일한 키
      // 관리자 인증: keongyu-api Worker의 GET /api/admin/verify가 X-ADMIN-TOKEN 헤더를 실제
      // 시크릿(env.ADMIN_TOKEN, wrangler secret put으로 등록됨)과 서버에서 비교합니다.
      // 이전에는 여기 클라이언트 JS에 토큰 값을 하드코딩해 페이지 소스만 봐도 뚫리는 가짜 보안이었는데,
      // 이제는 유효한 토큰 문자열 자체가 브라우저에 전혀 내려오지 않습니다 - 로컬에는 "검증에 성공했던
      // 값"만 재입력 생략용으로 캐시됩니다.
      const ADMIN_API_BASE = 'https://keongyu-api.wolddream.workers.dev';

      // 서버에 X-ADMIN-TOKEN으로 후보 토큰을 보내 실제로 유효한지 확인합니다.
      async function verifyAdminToken(candidate) {
        if (!candidate) return false;
        try {
          const res = await fetch(`${ADMIN_API_BASE}/api/admin/verify`, {
            headers: { 'X-ADMIN-TOKEN': candidate }
          });
          return res.ok;
        } catch (e) {
          return false; // 네트워크 오류 시 접근 거부 (fail-closed)
        }
      }

      // 각 관리 액션(TODO fetch)이 쓸 X-ADMIN-TOKEN 값. 검증 성공 시 checkAdminAuth()가 채웁니다.
      let adminToken = '';

      const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
      function esc(str) {
        if (str === null || str === undefined) return '';
        return String(str).replace(/[&<>"']/g, c => ESC_MAP[c]);
      }

      // ==========================================
      // 1. 데이터 로딩 (localStorage keongyu_v1)
      // ==========================================
      // TODO(D1 연동): 아래 loadAppState()는 "이 브라우저의" localStorage만 읽습니다 (routes/users/payments 탭).
      // 실제 다중 사용자 데이터를 보려면 D1 기반 API로 교체:
      //   const res = await fetch(`${ADMIN_API_BASE}/api/admin/routes`, { headers: { 'X-ADMIN-TOKEN': adminToken } });
      //   const { routes } = await res.json();
      // 신고 관리(reports) 탭은 이미 이렇게 D1로 전환되어 있습니다 - fetchReports()/handleGetReports 참고.
      //
      // reports/admin_logs 테이블 정의는 schema_admin.sql(레포 루트)에 있고, keongyu-db(원격 D1)에
      // wrangler d1 execute --file=./schema_admin.sql --remote 로 이미 적용되어 있습니다:
      //
      // CREATE TABLE reports (id TEXT PRIMARY KEY, route_id TEXT, reason TEXT, reporter_id TEXT, status TEXT DEFAULT 'open', created_at DATETIME DEFAULT CURRENT_TIMESTAMP);
      // CREATE TABLE admin_logs (id TEXT PRIMARY KEY, admin_id TEXT, action TEXT, target_id TEXT, created_at DATETIME DEFAULT CURRENT_TIMESTAMP);

      function loadAppState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) return JSON.parse(raw);
        } catch (e) {}
        return null;
      }

      function persistAppState() {
        if (!appState) return;
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        } catch (e) {
          alert('저장 공간이 부족합니다.');
        }
      }

      let appState = loadAppState();

      // reports는 D1 reports 테이블에서 실시간으로 읽어옵니다 (아래 3-1. 신고 관리 참고).
      // pointsHistory는 아직 D1에 집계 API가 없어 데모 더미로 남아있습니다.
      const DUMMY_USERS = [
        { id: 'demo_u1', name: '성수러버민지', points: 340 },
        { id: 'demo_u2', name: '힙스터준', points: 210 },
        { id: 'demo_u3', name: '댕댕산책러', points: 95 }
      ];
      const DUMMY_POINTS_HISTORY = [
        { user: '성수러버민지', amount: 700, reason: '충전 (5,000원)', time: '10분 전' },
        { user: '힙스터준', amount: -8, reason: '루트 공유 리워드 차감', time: '1시간 전' },
        { user: '나', amount: 360, reason: '충전 (3,000원)', time: '어제' }
      ];

      // 3-1. 신고 관리: D1 reports 테이블 (X-ADMIN-TOKEN 필요)
      let reports = [];
      let reportsLoading = false;
      let reportsError = null;

      async function fetchReports() {
        try {
          const res = await fetch(`${ADMIN_API_BASE}/api/admin/reports?status=open`, {
            headers: { 'X-ADMIN-TOKEN': adminToken }
          });
          if (!res.ok) throw new Error('request failed');
          const data = await res.json();
          reports = data.reports || [];
          reportsError = null;
        } catch (e) {
          reportsError = '신고 목록을 불러오지 못했습니다. 네트워크를 확인해주세요.';
        }
      }

      // 신고 탭 진입 시: 로딩 표시 -> fetch -> 재렌더. (대시보드 KPI용 카운트는 initAdmin()에서
      // 탭을 바꾸지 않고 fetchReports()만 미리 호출해둡니다.)
      async function loadReportsTab() {
        reportsLoading = true;
        renderTab('reports');
        await fetchReports();
        reportsLoading = false;
        renderTab('reports');
      }

      function formatDateTime(sqlDatetime) {
        if (!sqlDatetime) return '—';
        const d = new Date(sqlDatetime.replace(' ', 'T') + 'Z'); // D1 CURRENT_TIMESTAMP는 UTC
        if (isNaN(d.getTime())) return sqlDatetime;
        return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
      }

      const users = (appState && appState.user) ? [appState.user] : DUMMY_USERS;
      const pointsHistory = DUMMY_POINTS_HISTORY;

      function getRoutes() { return (appState && appState.routes) || []; }

      // r_<epoch ms> 형태 id(로컬 업로드로 생성된 루트)에서만 생성 시각을 복원할 수 있습니다.
      // 시드 데이터(r1~r9)나 API로 생성된 id(r_<base36>...)는 시각 정보가 없어 '—'로 표시됩니다.
      function extractCreatedAt(route) {
        const m = /^r_(\d{10,})$/.exec(route.id || '');
        if (!m) return null;
        const ts = parseInt(m[1], 10);
        return isNaN(ts) ? null : ts;
      }
      function formatDate(ts) {
        if (!ts) return '—';
        const d = new Date(ts);
        return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
      }

      // ==========================================
      // 2. 탭 렌더링
      // ==========================================
      let currentTab = 'dashboard';

      function renderTab(tab) {
        currentTab = tab;
        document.querySelectorAll('#sidebar-nav .nav-item').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        const main = document.getElementById('main');
        const renderers = {
          dashboard: renderDashboard,
          routes: renderRoutes,
          reports: renderReports,
          users: renderUsers,
          payments: renderPayments,
          collab: renderCollab,
          settings: renderSettings
        };
        main.innerHTML = (renderers[tab] || renderDashboard)();
      }

      function noDataBanner() {
        if (appState) return '';
        return `<div class="notice-banner">⚠️ 이 브라우저의 localStorage(keongyu_v1)에 메인 앱 데이터가 없습니다. 먼저 <a href="./index.html" style="color:#8A6200; font-weight:800;">메인 앱</a>을 열어 데이터를 만들어주세요.</div>`;
      }

      function renderDashboard() {
        const routes = getRoutes();
        const kpi = {
          total: routes.length,
          publicCount: routes.filter(r => r.isPublic).length,
          collab: routes.filter(r => r.isCollaborative).length,
          reports: reports.length
        };
        const latest = routes.slice(0, 20); // state.routes는 unshift로 신규 항목이 앞에 오므로 이미 최신순
        return `
          <h1>📊 대시보드</h1>
          <div class="subtitle">전체 현황 요약 (이 브라우저 기준 데모 데이터)</div>
          ${noDataBanner()}
          <div class="kpi-grid">
            <div class="kpi-card"><div class="label">전체 루트</div><div class="value">${kpi.total}</div></div>
            <div class="kpi-card"><div class="label">공개 루트</div><div class="value">${kpi.publicCount}</div></div>
            <div class="kpi-card"><div class="label">함께가기</div><div class="value">${kpi.collab}</div></div>
            <div class="kpi-card"><div class="label">신고 건수</div><div class="value" style="color:var(--danger);">${kpi.reports}</div></div>
          </div>
          <div class="panel">
            <div class="panel-header"><h2>최신 루트 (최대 20개)</h2></div>
            <table>
              <thead><tr><th>제목</th><th>작성자</th><th>상태</th><th>좋아요</th><th>액션</th></tr></thead>
              <tbody>
                ${latest.length === 0 ? `<tr class="empty-row"><td colspan="5">등록된 루트가 없습니다.</td></tr>` : latest.map(r => `
                  <tr>
                    <td><b>${esc(r.title)}</b></td>
                    <td>${esc(r.creator)}</td>
                    <td><span class="badge ${r.isPublic ? 'public' : 'private'}">${r.isPublic ? '공개' : '비공개'}</span></td>
                    <td>❤️ ${r.likes || 0}</td>
                    <td>
                      <button class="btn btn-ghost" onclick="togglePublic('${esc(r.id)}')">${r.isPublic ? '비공개로' : '공개로'}</button>
                      <button class="btn btn-danger" onclick="deleteRoute('${esc(r.id)}')">삭제</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderRoutes() {
        const routes = getRoutes();
        return `
          <h1>🗺️ 루트 관리</h1>
          <div class="subtitle">전체 루트 ${routes.length}개</div>
          ${noDataBanner()}
          <div class="panel">
            <div class="panel-header">
              <h2>루트 목록</h2>
              <button class="btn btn-primary" onclick="exportRoutesJSON()">JSON 내보내기</button>
            </div>
            <table>
              <thead><tr><th>ID</th><th>제목</th><th>목적</th><th>참여자</th><th>생성일</th><th>관리</th></tr></thead>
              <tbody>
                ${routes.length === 0 ? `<tr class="empty-row"><td colspan="6">등록된 루트가 없습니다.</td></tr>` : routes.map(r => `
                  <tr>
                    <td><span class="chip">${esc(r.id)}</span></td>
                    <td>${esc(r.title)}</td>
                    <td>${esc(r.purpose)}</td>
                    <td>${(r.participants || []).length} 👥</td>
                    <td>${formatDate(extractCreatedAt(r))}</td>
                    <td>
                      <button class="btn btn-ghost" onclick="editRouteDemo('${esc(r.id)}')">수정</button>
                      <button class="btn btn-danger" onclick="deleteRoute('${esc(r.id)}')">삭제</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderReports() {
        const routes = getRoutes();
        let body;
        if (reportsLoading) {
          body = `<tr class="empty-row"><td colspan="5">불러오는 중...</td></tr>`;
        } else if (reportsError) {
          body = `<tr class="empty-row"><td colspan="5">${esc(reportsError)}</td></tr>`;
        } else if (reports.length === 0) {
          body = `<tr class="empty-row"><td colspan="5">신고가 없습니다.</td></tr>`;
        } else {
          body = reports.map(rep => {
            const route = routes.find(r => r.id === rep.route_id);
            return `
              <tr>
                <td><span class="chip">${esc(rep.route_id)}</span>${route ? ` <span style="color:var(--text-sub); font-size:11px;">(${esc(route.title)})</span>` : ''}</td>
                <td>${esc(rep.reason)}</td>
                <td>${esc(rep.reporter_id || '익명')}</td>
                <td>${formatDateTime(rep.created_at)}</td>
                <td><button class="btn btn-mint" onclick="resolveReport('${esc(rep.id)}')">처리 완료</button></td>
              </tr>
            `;
          }).join('');
        }
        return `
          <h1>🚨 신고 관리</h1>
          <div class="subtitle">미처리 신고 ${reportsLoading ? '—' : reports.length}건 (D1 reports 테이블, keongyu-api 실시간 연동)</div>
          <div class="panel">
            <table>
              <thead><tr><th>루트 ID</th><th>사유</th><th>신고자</th><th>시간</th><th>처리</th></tr></thead>
              <tbody>${body}</tbody>
            </table>
            <!-- 참고: 신고 접수(POST) UI는 메인 앱(index.html)에 아직 없어 이 큐는 실제 운영에서
                 계속 비어있을 수 있습니다 - "신고하기" 버튼을 메인 앱에 추가하는 건 별도 작업입니다. -->
          </div>
        `;
      }

      function renderUsers() {
        const routes = getRoutes();
        return `
          <h1>👤 사용자 관리</h1>
          <div class="subtitle">사용자 ${users.length}명</div>
          <div class="notice-banner">⚠️ 이 페이지는 지금 이 브라우저의 localStorage 사용자 1명만 실제 데이터입니다. 나머지는 데모용 예시 사용자이며, 실제 다중 사용자 조회는 D1 users 테이블 연동이 필요합니다.</div>
          <div class="panel">
            <table>
              <thead><tr><th>이름</th><th>포인트</th><th>작성 루트</th><th>상태</th><th>액션</th></tr></thead>
              <tbody>
                ${users.map(u => `
                  <tr>
                    <td>${esc(u.name)}</td>
                    <td>⭐ ${u.points || 0}</td>
                    <td>${routes.filter(r => r.creator === u.name).length}개</td>
                    <td><span class="badge normal">정상</span></td>
                    <td>
                      <button class="btn btn-ghost" onclick="grantPoints('${esc(u.id || u.name)}')">포인트 지급</button>
                      <button class="btn btn-danger" onclick="suspendUser('${esc(u.id || u.name)}')">정지</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderPayments() {
        const todayRevenue = pointsHistory.filter(p => p.amount > 0).reduce((sum, p) => sum + p.amount, 0) * 100;
        const chargeCount = pointsHistory.filter(p => p.amount > 0).length;
        return `
          <h1>💰 결제 / 별사탕</h1>
          <div class="subtitle">포인트 적립·차감 내역 (데모 데이터 — 실제 매출은 D1 points_history 집계 필요)</div>
          <div class="kpi-grid" style="grid-template-columns:repeat(2,1fr);">
            <div class="kpi-card"><div class="label">오늘 매출 (추정, ⭐1개=100원)</div><div class="value">${todayRevenue.toLocaleString()}원</div></div>
            <div class="kpi-card"><div class="label">충전 건수</div><div class="value">${chargeCount}건</div></div>
          </div>
          <div class="panel">
            <div class="panel-header">
              <h2>포인트 내역</h2>
              <button class="btn btn-primary" onclick="openPortOne()">PortOne 열기</button>
            </div>
            <table>
              <thead><tr><th>유저</th><th>금액</th><th>사유</th><th>시간</th></tr></thead>
              <tbody>
                ${pointsHistory.map(p => `
                  <tr>
                    <td>${esc(p.user)}</td>
                    <td style="color:${p.amount > 0 ? 'var(--mint)' : 'var(--danger)'}; font-weight:800;">${p.amount > 0 ? '+' : ''}${p.amount}⭐</td>
                    <td>${esc(p.reason)}</td>
                    <td>${esc(p.time)}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderCollab() {
        const collabRoutes = getRoutes().filter(r => r.isCollaborative);
        return `
          <h1>👥 함께가기 모니터링</h1>
          <div class="subtitle">진행 중인 함께가기 ${collabRoutes.length}건</div>
          ${noDataBanner()}
          <div class="panel">
            <table>
              <thead><tr><th>루트 제목</th><th>참여자</th><th>역할</th><th>댓글/채팅 수</th><th>액션</th></tr></thead>
              <tbody>
                ${collabRoutes.length === 0 ? `<tr class="empty-row"><td colspan="5">진행 중인 함께가기가 없습니다.</td></tr>` : collabRoutes.map(r => `
                  <tr>
                    <td><b>${esc(r.title)}</b></td>
                    <td>${esc((r.participants || []).map(p => p.name).join(', ') || '—')}</td>
                    <td>${esc((r.participants || []).map(p => p.role).join(', ') || '—')}</td>
                    <td>${(r.comments || []).length}개</td>
                    <td><button class="btn btn-ghost" onclick="viewChats('${esc(r.id)}')">채팅 보기</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
            <!-- 참고: 실제 실시간 채팅은 keongyu-api Worker의 D1 chats 테이블 + 5️⃣ Durable Objects 브로드캐스트가
                 소스가 됩니다. 지금 이 표는 메인 앱 localStorage의 route.comments(로컬 발도장 댓글)를 대신 보여줍니다. -->
          </div>
        `;
      }

      function renderSettings() {
        let savedToken = '';
        try { savedToken = localStorage.getItem('admin_token') || ''; } catch (e) {}
        let notice = '';
        try { notice = localStorage.getItem('keongyu_admin_notice') || ''; } catch (e) {}
        const acctId = 'c98c81a5b3f4c57e6b9a5a4e60195ece';
        return `
          <h1>⚙️ 설정</h1>
          <div class="subtitle">Cloudflare 리소스 바로가기 · 관리자 인증 · 공지사항</div>
          <div class="settings-grid">
            <div class="panel">
              <h2 style="font-size:14px; font-weight:900; margin-bottom:10px;">☁️ Cloudflare 대시보드</h2>
              <a class="cf-link" href="https://dash.cloudflare.com/${acctId}/workers-and-pages" target="_blank" rel="noopener">Workers & Pages →</a>
              <a class="cf-link" href="https://dash.cloudflare.com/${acctId}/workers/d1" target="_blank" rel="noopener">D1 (keongyu-db) →</a>
              <a class="cf-link" href="https://dash.cloudflare.com/${acctId}/r2/default/buckets/keongyu-images" target="_blank" rel="noopener">R2 (keongyu-images) →</a>
              <a class="cf-link" href="https://dash.cloudflare.com/${acctId}/workers/services/view/keongyu-api" target="_blank" rel="noopener">Workers (keongyu-api) →</a>
            </div>
            <div class="panel">
              <h2 style="font-size:14px; font-weight:900; margin-bottom:10px;">🔐 관리자 인증</h2>
              <input type="password" id="admin-pw-input" placeholder="새 관리자 토큰 (Workers ADMIN_TOKEN과 일치해야 저장됨)" />
              <button class="btn btn-primary" onclick="saveAdminPassword()">저장</button>
              <div class="hint">서버(keongyu-api)의 실제 ADMIN_TOKEN 시크릿과 서버측에서 대조합니다. 토큰 값 자체를 바꾸려면 여기가 아니라 <code>wrangler secret put ADMIN_TOKEN</code>으로 Workers 시크릿을 갱신해야 합니다 — 이 입력창은 새 토큰이 유효한지 확인하고 이 브라우저의 로컬 캐시를 갱신할 뿐입니다.</div>
            </div>
            <div class="panel">
              <h2 style="font-size:14px; font-weight:900; margin-bottom:10px;">📢 공지사항</h2>
              <textarea id="notice-textarea" placeholder="메인 앱 상단에 노출할 공지 내용을 입력하세요.">${esc(notice)}</textarea>
              <button class="btn btn-primary" onclick="saveNotice()">저장</button>
              <div class="hint">현재는 admin.html 로컬 저장만 됩니다 (메인 앱 노출은 별도 연동 필요).</div>
            </div>
          </div>
        `;
      }

      // ==========================================
      // 3. 액션 함수
      // ==========================================
      window.togglePublic = function(routeId) {
        if (!appState) return;
        const r = appState.routes.find(x => x.id === routeId);
        if (!r) return;
        r.isPublic = !r.isPublic;
        persistAppState();
        // TODO: fetch(`${ADMIN_API_BASE}/api/admin/routes/${routeId}`, {method:'PATCH', headers:{'X-ADMIN-TOKEN': adminToken}, body: JSON.stringify({is_public: r.isPublic})})
        renderTab(currentTab);
      };

      window.deleteRoute = function(routeId) {
        if (!appState) return;
        if (!confirm('이 루트를 삭제할까요? 되돌릴 수 없습니다.')) return;
        appState.routes = appState.routes.filter(x => x.id !== routeId);
        persistAppState();
        // TODO: fetch(`${ADMIN_API_BASE}/api/admin/routes/${routeId}`, {method:'DELETE', headers:{'X-ADMIN-TOKEN': adminToken}})
        renderTab(currentTab);
      };

      window.editRouteDemo = function() {
        alert('메인 앱에서 관리자 권한으로 진입 필요');
      };

      window.exportRoutesJSON = function() {
        const data = JSON.stringify(getRoutes(), null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `keongyu-routes-${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      window.resolveReport = async function(reportId) {
        try {
          const res = await fetch(`${ADMIN_API_BASE}/api/admin/reports/${reportId}`, {
            method: 'PATCH',
            headers: { 'X-ADMIN-TOKEN': adminToken }
          });
          if (!res.ok) { alert('처리에 실패했습니다.'); return; }
        } catch (e) {
          alert('네트워크 오류로 처리에 실패했습니다.');
          return;
        }
        await loadReportsTab(); // 서버가 status='resolved' + admin_logs를 기록했으니 open 목록만 다시 불러옴
      };

      window.grantPoints = function(userId) {
        const amountStr = prompt('지급할 별사탕 수량을 입력하세요:', '50');
        const amount = parseInt(amountStr, 10);
        if (!amount || amount <= 0) return;
        if (appState && appState.user && (appState.user.id === userId || appState.user.name === userId)) {
          appState.user.points = (appState.user.points || 0) + amount;
          persistAppState();
          alert(`⭐ ${amount}개를 지급했습니다.`);
        } else {
          alert(`⭐ ${amount}개를 지급했습니다. (데모 유저는 실제로 반영되지 않습니다)`);
        }
        // TODO: fetch(`${ADMIN_API_BASE}/api/admin/users/${userId}/points`, {method:'POST', headers:{'X-ADMIN-TOKEN': adminToken}, body: JSON.stringify({amount})})
        renderTab('users');
      };

      window.suspendUser = function() {
        if (!confirm('이 사용자를 정지할까요?')) return;
        alert('정지 처리는 데모입니다. 실제로는 D1 users.status 업데이트가 필요합니다.');
        // TODO: fetch(`${ADMIN_API_BASE}/api/admin/users/${userId}/suspend`, {method:'POST', headers:{'X-ADMIN-TOKEN': adminToken}})
      };

      window.openPortOne = function() {
        window.open('https://portone.io/', '_blank', 'noopener,noreferrer');
      };

      window.viewChats = function(routeId) {
        const r = getRoutes().find(x => x.id === routeId);
        if (!r) return;
        const json = JSON.stringify(r.comments || [], null, 2);
        alert(json.length > 1000 ? json.slice(0, 1000) + '\n... (1000자 초과, 생략됨)' : json);
      };

      window.saveAdminPassword = async function() {
        const input = document.getElementById('admin-pw-input');
        const val = (input && input.value || '').trim();
        if (!val) { alert('토큰을 입력해주세요.'); return; }
        const valid = await verifyAdminToken(val);
        if (!valid) {
          alert('서버에 등록된 ADMIN_TOKEN과 일치하지 않아요. 저장하지 않았습니다.');
          return;
        }
        adminToken = val;
        try { localStorage.setItem('admin_token', val); } catch (e) {}
        alert('확인 완료 — 이 브라우저에 로컬 캐시로 저장했습니다.');
        if (input) input.value = '';
      };

      window.saveNotice = function() {
        const ta = document.getElementById('notice-textarea');
        try { localStorage.setItem('keongyu_admin_notice', (ta && ta.value) || ''); } catch (e) {}
        alert('공지사항을 저장했습니다.');
      };

      // ==========================================
      // 4. 인증 게이트 + 초기화
      // ==========================================
      // 로컬에 캐시된 토큰이 있으면 먼저 그걸로 서버 검증(재입력 생략), 없거나 만료/변경됐으면
      // prompt()로 다시 물어봅니다. 어느 경우든 최종 판단은 항상 서버(/api/admin/verify)가 내립니다.
      async function checkAdminAuth() {
        let saved = null;
        try { saved = localStorage.getItem('admin_token'); } catch (e) {}
        if (saved && (await verifyAdminToken(saved))) {
          adminToken = saved;
          return true;
        }
        const input = prompt('관리자 토큰을 입력하세요:');
        if (input && (await verifyAdminToken(input))) {
          adminToken = input;
          try { localStorage.setItem('admin_token', input); } catch (e) {}
          return true;
        }
        alert('토큰이 올바르지 않습니다.');
        return false;
      }

      async function initAdmin() {
        document.querySelectorAll('#sidebar-nav .nav-item').forEach(btn => {
          btn.addEventListener('click', () => {
            if (btn.dataset.tab === 'reports') loadReportsTab();
            else renderTab(btn.dataset.tab);
          });
        });
        renderTab('dashboard');
        await fetchReports(); // 탭 전환 없이 대시보드 신고 KPI만 채워둠
        if (currentTab === 'dashboard') renderTab('dashboard');
      }

      window.addEventListener('DOMContentLoaded', async () => {
        const ok = await checkAdminAuth();
        if (!ok) {
          document.getElementById('admin-shell').innerHTML =
            '<div style="padding:60px; text-align:center; width:100%;"><div style="font-size:32px;">🔒</div><div style="font-size:15px; font-weight:800; margin-top:10px;">접근이 거부되었습니다.</div></div>';
          return;
        }
        initAdmin();
      });
    </script>
  </body>
</html>
